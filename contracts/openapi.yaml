        error: { $ref: '#/components/schemas/Problem' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        resultExpiresAt: { type: string, format: date-time, description: Results are purged from the ephemeral store after this time (≤ 10 min). }
    SynthesisRequest:
      type: object
      required: [text, languageCode]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        voiceId: { type: string, maxLength: 120 }
        speed: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
        pronunciationMode: { type: boolean, default: false, description: Also return a Latin romanisation for learners. }
        outputFormat:
          type: string
          enum: [MP3, OGG_OPUS]
          default: MP3
    SynthesisResponse:
      type: object
      required: [audioUrl, audioUrlExpiresAt, durationMs]
      properties:
        audioUrl: { type: string, format: uri }
        audioUrlExpiresAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        romanization: { type: string }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    Voice:
      type: object
      required: [voiceId, languageCode, displayName, execution]
      properties:
