openapi: 3.1.0
info:
  title: Qal Smart Keyboard API
  version: 2.0.0
  summary: App API (/api/v1) and partner API (/partner/v1) for the Qal Smart Keyboard, plus the interim admin operations (/admin/v1).
  description: |
    Implementation contract for the Qal Smart Keyboard backend (System Design v2.0,
    Architecture Review v2.0). Update this file in the same change as controller/DTO changes.

    ## Privacy rules encoded in this contract
    - **There is no keystroke endpoint.** Ordinary typing, dictionary lookup, suggestions and
      Latin-QWERTY → Ge'ez transliteration run locally in the on-device `keyboard-core`.
      `/me/typing-languages` synchronises *preferences* only.
    - Text or audio is sent **only** after an explicit user action (Translate, Grammar, Rewrite,
      Smart reply, Voice, ...). The server does not persist AI input/output text by default;
      `ai_requests` stores operational metadata only.
    - Saved history, synced dictionary words, destination-profile labels and style free-text
      are encrypted server-side with a per-user data key (crypto-shredded on account deletion).
    - Contacts are never uploaded. Android per-app rules are keyed by a client-computed HMAC.
    - **The server never trusts client-supplied amounts, prices, merchant accounts or payment
      success.** Orders are server-priced; payments are verified server-to-server.

    ## Conventions
    - JSON properties are camelCase; IDs are UUID strings; times are ISO-8601 UTC (`date-time`).
    - Money is integer minor units plus currency exponent (`Money`). Never floating point.
    - Errors are RFC 9457 `application/problem+json` (`Problem`) with stable `code` and `correlationId`.
    - Every response carries `X-Correlation-Id`. Rate-limited endpoints return `RateLimit-*` headers.
    - Lists use cursor pagination: `cursor` + `limit` (≤ 100) → `nextCursor` (absent at the end).
    - State-changing AI, billing, order, attempt, mandate, store-purchase and realtime-session
      POSTs require `Idempotency-Key` (see the parameter for the at-most-once charging rule).
    - Clients send `X-Client-Platform`, `X-App-Version` and `X-Client-Surface` on every request.
      A request from an unsupported app version fails with `APP_VERSION_UNSUPPORTED` (426,
      `components.responses.AppVersionUnsupported`) on every `/api/v1` operation except
      `/config`, billing webhooks and store notifications. Operations do not list it individually.
  contact:
    name: Platform Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.com
    description: Placeholder production host. App API under /api/v1, partner API under /partner/v1.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Phone OTP, Google/Apple, email login, guest sessions and token rotation.
  - name: Devices
    description: Device installations, attestation and language-resource installation reports.
  - name: Me
    description: Profile, deletion, data export and consents.
  - name: Config
    description: Remote configuration, feature flags and AI capability matrix.
  - name: Tools
    description: Unmetered productivity utilities (no AI credits), e.g. the daily currency-rate snapshot.
  - name: Languages
    description: Language catalogue, transliteration profiles and signed resource manifests.
  - name: Preferences
    description: Preferences, typing languages, destination profiles, per-app rules, style profiles and dictionary sync.
  - name: AI
    description: Explicit, user-initiated text AI actions.
  - name: History
    description: Opt-in encrypted AI history.
  - name: Speech
    description: Speech-to-text, speech translation and text-to-speech.
  - name: Realtime
    description: Voice-to-voice and live conversation sessions over WebSocket.
  - name: Entitlements
    description: Effective plan, allowances, usage and AI credits.
  - name: Billing
    description: Provider-neutral orders, payment attempts, mandates, store purchases, subscriptions and receipts.
  - name: Webhooks
    description: Provider-to-server callbacks. Not called by apps; no bearer authentication.
  - name: Organizations
    description: Business organisations, members, seats and partner API clients.
  - name: Glossaries
    description: User and organisation terminology enforced in translation and rewriting.
  - name: Partner
    description: Partner/enterprise language API authenticated with API keys.
  - name: Admin
    description: |
      Admin console operations under /admin/v1 (`x-internal`: not for apps or partners). Interim authentication
      (ADR 0019): an access token of a registered user with an unexpired `user_admin_roles` assignment whose role
      grants the operation's permission; workforce OIDC with MFA (SD 9.2, 18) replaces it. Off unless the server
      enables it (every operation is then 404). Every action and every refusal is written to `audit_events`.

paths:
  # ---------------------------------------------------------------- Auth
  /api/v1/auth/attestation-nonces:
    post:
      tags: [Auth]
      operationId: createAttestationNonce
      summary: Issue a single-use nonce for device attestation
      description: |
        Returns a server-issued nonce that the client binds into a Play Integrity or App Attest
        request. Required before `/auth/guest` and `/devices/{deviceId}/attestations` so that
        attestation tokens cannot be replayed. Nonces expire after 5 minutes.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '201':
          description: Nonce issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationNonce' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/otp/start:
    post:
      tags: [Auth]
      operationId: startPhoneOtp
      summary: Send a one-time code to a phone number
      description: |
        Starts phone sign-in. Responds identically whether or not the number is registered.
        Rate-limited per number, IP and (when `installationId` is sent) device.

        **Ethio Telecom numbers only** (ADR 0007 D48): the SMS provider accepts only
        `+2519XXXXXXXX`. Which prefixes get a code is server configuration
        (`qal.auth.phone.allowed-prefixes`, default `+2519`) and may be widened later without a
        contract change. A well-formed number outside the allowed prefixes is refused with 400,
        no code is sent and no challenge is created, but the attempt counts against the per-IP
        limit: another Ethiopian mobile (such as Safaricom `+2517XXXXXXXX`) is
        `PHONE_CARRIER_NOT_SUPPORTED`; a number from another country is
        `PHONE_REGION_NOT_SUPPORTED`. Clients point those users to Google sign-in. An Ethiopian
        number that is not a mobile number (for example a landline) is 400 `VALIDATION_FAILED`
        with field error `INVALID_PHONE_NUMBER`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpStartRequest' }
            example:
              phoneNumber: '+251911234567'
              channel: SMS
      responses:
        '202':
          description: Code sent (or silently suppressed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyPhoneOtp
      summary: Verify a phone code and obtain a session
      description: |
        Exchanges a valid code for a session. **Guest upgrade:** if the request carries the bearer
        token of a live guest, that guest is linked. For a **new** phone number the guest account
        is upgraded in place (same user id, nothing moves; `isNewUser` is true and
        `mergedGuestUserId` equals `user.id`). For a number that already has an account the
        guest's data (devices, preferences, consents, languages, usage) is merged into that
        account and `mergedGuestUserId` is the guest's id. A guest links **at most once**: after
        the merge or upgrade its bearer token and refresh tokens stop working. A guest bearer
        that can no longer link (already merged, upgraded or ended, including a lost race) is 401
        `GUEST_SESSION_INVALID`; nothing is consumed, so the client discards the guest token and
        retries the same code without it. A registered bearer token is ignored for linking. A
        suspended account gets 403 `ACCOUNT_SUSPENDED`. A guest is **never merged into an account
        whose deletion is pending**: the sign-in succeeds without linking, `mergedGuestUserId` is
        absent and the guest stays a separate, active guest session.

        A wrong code is 401 `OTP_INVALID` with the extension member `attemptsRemaining` (integer,
        at least 1): the wrong codes still allowed before the challenge locks
        (429 `OTP_TOO_MANY_ATTEMPTS`). The member is absent when the challenge is unknown, already
        used or replaced; clients show it when present and never count attempts themselves.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: exchangeOAuthIdToken
      summary: Sign in with a Google or Apple ID token
      description: |
        Verifies the provider ID token (signature, audience, nonce, expiry) server-side.
        Same guest-upgrade merge behaviour as OTP verification (upgrade in place for a new
        identity, at-most-once merge into an existing account, 401 `GUEST_SESSION_INVALID` for a
        guest bearer that can no longer link; no merge into an account whose deletion is pending,
        the sign-in then proceeds without `mergedGuestUserId`). The account is found or created by
        the provider and its `sub` claim only; an e-mail address never links to another account.
        A provider the server cannot verify yet (Apple until its adapter exists) is a 400
        `VALIDATION_FAILED` on `provider`. A rejected token is 401 `UNAUTHENTICATED`; a suspended
        account gets 403 `ACCOUNT_SUSPENDED`; 503 `PROVIDER_UNAVAILABLE` means the issuer's signing
        keys could not be fetched.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [GOOGLE, APPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthExchangeRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email/register:
    post:
      tags: [Auth]
      operationId: registerWithEmail
      summary: Register with email and password
      description: |
        Creates an account that signs in with an e-mail address and a password (ADR 0033). The password is
        10 to 128 characters (Unicode code points), without composition rules; a common password, one
        built from a common word plus digits or symbols, a keyboard or alphabet run, or the address itself
        is refused with 400 `VALIDATION_FAILED` on `password` (`PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`,
        `PASSWORD_TOO_COMMON`, `PASSWORD_MATCHES_EMAIL`); a malformed address with `INVALID_EMAIL` on `email`.
        The address is compared case-insensitively.

        The server decides whether the mailbox must be proven first (`qal.identity.email.verification-required`):
        - **Not required:** 201 with a session. The account exists at once and its address is unverified
          (`user.emailVerified` false).
        - **Required:** 202 with an `EmailVerificationChallenge`; a 6-digit code was e-mailed and **no account
          exists yet**. `POST /auth/email/verify` with the challenge id and the code creates it and signs in.

        An address that belongs to an account is 409 `EMAIL_ALREADY_REGISTERED` (sign in or reset the
        password; the per-IP limit curbs probing). Exception while verification is required: an account
        whose address was never verified does not block the sign-up; proving the mailbox with the code
        takes that account over (its password is replaced, its sessions end). Guest upgrade as for phone
        sign-in: with verification off the guest is upgraded in place here; with verification on, send the
        guest bearer with the verify call.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRegisterRequest' }
      responses:
        '201':
          description: Account created and signed in; the address is not verified (verification not required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '202':
          description: Verification required; a code was e-mailed (or the e-mail failed and can be resent). No account exists yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email/login:
    post:
      tags: [Auth]
      operationId: loginWithEmail
      summary: Sign in with email and password
      description: |
        A wrong address or password is 401 `INVALID_CREDENTIALS` (the same answer whether the address has
        an account or not). After 10 wrong passwords in a row the password is locked for 15 minutes: 429
        `ACCOUNT_LOCKED` with `Retry-After` (reset the password to unlock at once). When the server requires
        verified addresses and this one is not verified, the answer is 403 `EMAIL_NOT_VERIFIED` and a code
        was e-mailed: the Problem carries `challengeId`, `expiresAt`, `resendAvailableAt` and `codeLength`;
        continue with `POST /auth/email/verify`. A suspended account gets 403 `ACCOUNT_SUSPENDED`. A guest
        bearer is merged into the account as for phone sign-in.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailLoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmailCode
      summary: Prove the mailbox with the e-mailed code and sign in
      description: |
        Completes a sign-up that required verification (creates the account, `isNewUser` true) or the
        verification of an existing account (after 403 `EMAIL_NOT_VERIFIED`), and signs in. The challenge id
        binds the code to the client that started the flow. Errors as for phone codes: 401 `OTP_INVALID`
        (with `attemptsRemaining` for a wrong code), 401 `OTP_EXPIRED`, 429 `OTP_TOO_MANY_ATTEMPTS` after 5
        wrong codes (resend to get a new one). 409 `EMAIL_ALREADY_REGISTERED` if a verified account got the
        address meanwhile. Guest upgrade or merge as for phone sign-in (401 `GUEST_SESSION_INVALID` for a
        guest bearer that can no longer link; nothing is consumed).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerifyRequest' }
      responses:
        '200':
          description: Verified and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email/verify/resend:
    post:
      tags: [Auth]
      operationId: resendEmailCode
      summary: E-mail a new code for a verification challenge
      description: |
        Replaces the challenge's code (the old one stops working, attempts start again) and e-mails it.
        429 `RATE_LIMITED` with `Retry-After` before `resendAvailableAt` or when the address got too many
        e-mails; 401 `OTP_INVALID` when the challenge is unknown, used or too old (start again).
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailResendRequest' }
      responses:
        '202':
          description: A new code was e-mailed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Start password recovery
      description: |
        Always returns 202 to avoid account enumeration: a 6-digit reset code is e-mailed only if a live
        account with a password has the address. 503 `EMAIL_NOT_CONFIGURED` when the server cannot send
        e-mail (independent of the address).
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordForgotRequest' }
      responses:
        '202': { description: Recovery email sent if the account exists. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete password recovery
      description: |
        Consumes the single-use reset code (`token`, with the `email` it was sent to), sets the new password,
        clears a lock, marks the address verified and revokes all existing sessions. Every failure of the
        code (unknown address, wrong, expired, used, too many attempts) is the same 400 `RESET_CODE_INVALID`;
        a weak new password is 400 `VALIDATION_FAILED` on `newPassword` (the code is not used up).
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: |
        Every refresh issues a new refresh token and invalidates the presented one. Tokens belong
        to a token family; presenting an already-rotated token is treated as theft and **revokes
        the whole family** (`REFRESH_TOKEN_REUSED`). Access tokens live 10–15 minutes.

        **Grace window (lost responses):** a retry with the token just rotated, sent within a short
        server-configured window (default 30 s) of that rotation while the refresh token issued by
        the lost response has never been used, rotates again (200) and invalidates that unused
        token instead of revoking the family. Clients must still serialise refresh calls and must
        only keep the newest refresh token they received. A suspended account gets 403
        `ACCOUNT_SUSPENDED`.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session (or all sessions)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session(s) revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/guest:
    post:
      tags: [Auth]
      operationId: createGuestSession
      summary: Create an attested guest session for trial AI use
      description: |
        Creates (or resumes) an anonymous guest account bound to one installation. Requires a
        valid Play Integrity / App Attest verdict over a nonce from `/auth/attestation-nonces`.
        Offline typing never needs this call. Guests cannot purchase, sync history or join
        organisations.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSessionRequest' }
      responses:
        '200':
          description: Guest session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Devices
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the caller's devices
      description: |
        Returns the caller's own device installations, oldest first, **including revoked ones**
        (`status` is `ACTIVE` or `REVOKED`), so a client can show a "devices" screen. Another
        user's devices never appear. The push token is write-only and is never returned.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's devices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register or update the current installation
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Device registered (idempotent on installationId).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Update app/OS version or push token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device and its sessions
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/devices/{deviceId}/attestations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: submitDeviceAttestation
      summary: Submit a device-integrity verdict
      description: Verified server-side with Google/Apple. Result is stored on the device row and used for abuse controls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationEvidence' }
      responses:
        '200':
          description: Attestation evaluated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/devices/{deviceId}/resource-installations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: reportResourceInstallations
      summary: Report language-resource install outcomes
      description: Operational telemetry only (version, status, checksum/signature verification). Contains no text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInstallationReport' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Me
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get the current user's profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/deletion-request:
    post:
      tags: [Me]
      operationId: requestAccountDeletion
      summary: Schedule account deletion
      description: |
        Schedules deletion after a cancellation window (14 days, server-configured; `scheduledPurgeAt`
        says when). On purge the user data key is destroyed (crypto-shredding encrypted history,
        dictionary, labels). Financial records required by law are retained in pseudonymised form.
        Active store subscriptions must be cancelled in the store; the response lists any that remain.

        During the window the account is `DELETION_PENDING`: AI features stop at once (entitlement
        reads and the entitlement token answer 403 `DELETION_PENDING`), typing and the other account
        features keep working, the requesting session stays signed in, every other session is signed
        out, and signing in again is possible (to cancel). Guests may delete their account the same way.
        `reason` is accepted for compatibility but not stored. When the purge starts, every token of
        the account is refused (401) and the request can no longer be cancelled. A later sign-in with
        the same phone number or Google account creates a new, empty account.

        Errors: 403 `ACCOUNT_SUSPENDED` (a suspended account is deleted through support) or
        `FORBIDDEN` (the account cannot be deleted in its state); 409 `DELETION_PENDING` when a
        deletion is already pending (read it with `GET`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionRequestCreate' }
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Me]
      operationId: getAccountDeletion
      summary: Get the pending deletion request
      description: |
        The caller's pending request (`SCHEDULED`, or `PROCESSING` at the moment the purge starts),
        so a client can show when the account will be deleted and offer to cancel. 404 when nothing
        is pending (never requested, cancelled or completed).
      responses:
        '200':
          description: The pending request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      operationId: cancelAccountDeletion
      summary: Cancel a pending deletion request
      description: |
        Cancels a scheduled deletion; the account is `ACTIVE` again. Sessions that were signed out by
        the request stay signed out. 409 `DELETION_PENDING` when the purge has already started.
      responses:
        '204': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/data-exports:
    post:
      tags: [Me]
      operationId: requestDataExport
      summary: Request an export of personal data
      description: |
        Queues an asynchronous export of everything the service stores about the caller (SD 19.2: account,
        preferences, consents, history, dictionary, devices, sessions metadata, AI request metadata, feedback,
        usage, credits, subscriptions and receipts). One export is in flight per user: asking while one is
        `REQUESTED` or `PROCESSING` returns that export. At most 3 exports per 24 hours (429 with `Retry-After`).
        Available while an account deletion is pending; a deleted account cannot export (403).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataExportCreate' }
      responses:
        '202':
          description: Export queued (or the export already in flight).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/me/data-exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Me]
      operationId: getDataExport
      summary: Get export status and download URL
      description: |
        Status of one of the caller's exports; another user's id answers 404. A `READY` export carries the
        `downloadUrl` and its expiry; after `downloadExpiresAt` (7 days) the status is `EXPIRED` and the archive is gone.
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/data-exports/{exportId}/archive:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Me]
      operationId: downloadDataExport
      summary: Download the export archive
      description: |
        The `downloadUrl` of a `READY` export. Requires the owner's access token. The archive is stored encrypted under
        the user's data key and is decrypted here for the owner only. 404 for another user's export, an export that is
        not `READY`, an expired one, or one whose keys were destroyed by an account deletion.
      responses:
        '200':
          description: The archive as an attachment (`Content-Disposition`), `Cache-Control` no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExportArchive' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/consents:
    get:
      tags: [Me]
      operationId: listConsents
      summary: List the latest state of each consent
      responses:
        '200':
          description: Consents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/consents/history:
    get:
      tags: [Me]
      operationId: listConsentHistory
      summary: List the caller's own consent decisions
      description: |
        Every grant and withdrawal the caller recorded, **oldest first** (append-only history),
        optionally for one `consentCode`. Cursor-paginated. Only the caller's own records are
        returned. `grantedAt` is the time of a grant record; `revokedAt` the time of a
        withdrawal record.
      parameters:
        - name: consentCode
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConsentCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of decisions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/consents/{consentCode}:
    parameters:
      - name: consentCode
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentCode' }
    put:
      tags: [Me]
      operationId: setConsent
      summary: Grant or revoke a consent
      description: |
        Appends a consent record (append-only history). Revoking `SAVE_AI_HISTORY` stops new
        history writes and offers deletion; revoking `PAYMENT_MANDATE` cancels linked mandates.
        `TERMS_ACCEPTANCE` and `PRIVACY_NOTICE` cannot be revoked (delete the account instead):
        withdrawing one is 422 `VALIDATION_FAILED` with the field error `isGranted` / code
        `CONSENT_NOT_REVOCABLE`. Re-sending an identical decision appends another record
        (re-acceptance is evidence). `details` is stored with the record and never interpreted;
        the client sets `details.surface` to where the decision was made (for example
        `onboarding` or `settings`). A guest may record consents; they move to the account on
        sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentUpdate' }
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Config
  /api/v1/config:
    get:
      tags: [Config]
      operationId: getClientConfig
      summary: Get remote configuration and evaluated feature flags
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      responses:
        '200':
          description: Configuration for this client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/ai/capabilities:
    get:
      tags: [Config]
      operationId: getAiCapabilities
      summary: List available AI tasks, language pairs and the translation language catalogue
      description: |
        Drives client UI. A pair is listed only when an enabled capability exists; marketing must use `qualityTier`.

        **Translation language catalogue (ADR 0040).** `translationLanguages` lists every language the
        active providers can translate from (`asSource`) or into (`asDestination`), with its English and
        native name, script and writing direction. It is provider-driven: it is empty when no provider
        is active or the caller may not use server translation, and a client then keeps its bundled
        list. Translation languages are not typing languages (`isTypingLanguage`): the keyboard's typing
        catalogue is `listLanguages`. A `TRANSLATE` item without `sourceLanguage` and
        `destinationLanguage` means "any pair of `translationLanguages`" (source with `asSource`,
        destination with `asDestination`, never the same language); a pair item names one pair. The
        server still decides per request: a pair no single provider serves is refused with
        `LANGUAGE_PAIR_UNAVAILABLE`.

        **Caching.** The answer carries a strong `ETag` over everything except `generatedAt`. A client
        that keeps the catalogue sends it back in `If-None-Match` and gets `304` without a body while
        nothing changed. `Cache-Control: private, no-cache`: a client may keep its copy but revalidates
        before trusting it.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a previous answer; `304` when it still matches.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Capability matrix and translation language catalogue.
          headers:
            ETag:
              description: Strong validator of the body without `generatedAt`.
              schema: { type: string, maxLength: 100 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCapabilities' }
        '304':
          description: Not modified; the client's copy (named by `If-None-Match`) is current.
          headers:
            ETag:
              description: The current validator (equal to the one sent).
              schema: { type: string, maxLength: 100 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Tools
  /api/v1/tools/fx-rates:
    get:
      tags: [Tools]
      operationId: getFxRates
      summary: Get the daily currency-rate snapshot for the offline converter
      description: |
        One snapshot of exchange rates against `base` (always `USD`): the value of one unit of `base` in each quote
        currency. A client converts between any two currencies as `amount / rates[from] * rates[to]` (`USD` itself is
        `1`). Read-only, unmetered (no AI credits) and identical for every caller, so it is publicly cacheable.
        `asOf` is when the rates were taken; `stale` is `true` when `asOf` is older than the server's staleness
        threshold (default 48 hours) and the client then shows a "rates may be out of date" note. `source` names the
        provider (`seed` is the built-in development table, not live market data). A client keeps the last snapshot and
        converts offline.

        **Caching.** `Cache-Control: public, max-age=3600`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The current snapshot.
          headers:
            Cache-Control:
              description: '`public, max-age=3600`.'
              schema: { type: string, maxLength: 100 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- Languages
  /api/v1/languages:
    get:
      tags: [Languages]
      operationId: listLanguages
      summary: List supported languages and scripts
      description: |
        The keyboard's language catalogue: the languages a user can type in (`/me/typing-languages`
        accepts exactly these). Translation-only languages (ADR 0040) are not listed here; they are
        in `getAiCapabilities.translationLanguages`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Language catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Language' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/languages/{languageCode}/transliteration-profiles:
    parameters:
      - $ref: '#/components/parameters/LanguageCodePath'
    get:
      tags: [Languages]
      operationId: listTransliterationProfiles
      summary: List ACTIVE and RETIRED transliteration profiles for a language
      description: |
        Returns the language's `ACTIVE` and `RETIRED` profiles, each with its `status` (a client
        keeps a RETIRED profile working for users who selected it but offers only ACTIVE ones;
        `DRAFT` profiles are never returned). An unknown, inactive or malformed language code is
        404. Profiles are metadata; mappings live in signed TRANSLITERATION_RULES resources
        executed on-device.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransliterationProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/language-resources:
    get:
      tags: [Languages]
      operationId: listLanguageResources
      summary: List signed language-resource manifests for this client
      description: |
        Returns manifests compatible with the platform, app version and release channel, filtered
        by staged-rollout bucket. **Rollout bucketing is server-side:** the server hashes the
        caller's device id (else user id) with the resource id into a stable bucket 0-99 and
        shows a resource below 100 % only to authenticated callers whose bucket is under the
        percentage; anonymous callers never see a partial rollout. Clients must not bucket or
        filter by rollout themselves. Clients verify the Ed25519 manifest signature against pinned
        keys **and** the artifact SHA-256 before atomically activating a resource; the last
        known-good version is kept for rollback. Delta resources name `baseResourceId`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
        - name: appVersion
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/ReleaseChannel' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ResourceType' }
        - name: languageCode
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Manifests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LanguageResourceManifest' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/language-resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Languages]
      operationId: getLanguageResource
      summary: Get one signed resource manifest
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanguageResourceManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resource-signing-keys:
    get:
      tags: [Languages]
      operationId: listResourceSigningKeys
      summary: List resource-signing public keys (for rotation)
      description: |
        Clients ship with pinned keys; this endpoint only announces *additional* keys signed by a
        currently pinned key (`endorsementSignature`) so rotation needs no app release.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Signing keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SigningKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Preferences
  /api/v1/me/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Get user preferences
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replacePreferences
      summary: Replace user preferences
      description: |
        Optimistic concurrency via `revision`; a stale revision returns 409 `REVISION_CONFLICT`
        (with `currentRevision`). Turning on `historyEnabled` requires the `SAVE_AI_HISTORY`
        consent; without it the call is 403 `CONSENT_REQUIRED` (extension member `consentCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/typing-languages:
    get:
      tags: [Preferences]
      operationId: getTypingLanguages
      summary: Get enabled typing languages and per-language input modes
      responses:
        '200':
          description: Typing languages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replaceTypingLanguages
      summary: Replace the typing-language list, order and input modes
      description: |
        Synchronises preferences only. The server resolves `transliterationProfileCode` to an
        ACTIVE profile of the same language (`PROFILE_NOT_ACTIVE` otherwise). The keyboard caches
        the result and **never calls the API on a keypress**; conversion is local.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
            example:
              revision: 3
              languages:
                - languageCode: am
                  enabled: true
                  isPrimary: true
                  sortOrder: 10
                  inputMode: PHONETIC_LATIN_TO_NATIVE
                  transliterationProfileCode: AM_PHONETIC_QWERTY_TO_ETHIOPIC
                  conversionTrigger: LIVE_COMPOSING
                  showTransliterationCandidates: true
                  unknownTokenBehavior: PRESERVE_LATIN
                - languageCode: en
                  enabled: true
                  isPrimary: false
                  sortOrder: 20
                  inputMode: LATIN_PASSTHROUGH
                  conversionTrigger: LIVE_COMPOSING
                  showTransliterationCandidates: false
                  unknownTokenBehavior: PRESERVE_LATIN
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/me/destination-profiles:
    get:
      tags: [Preferences]
      operationId: listDestinationProfiles
      summary: List destination profiles
      description: |
        Destination profiles replace per-contact preferences: the keyboard cannot know the
        recipient, so the user picks a named profile ("Mum — Amharic, honorific") from the
        destination chip. Labels travel over TLS and are encrypted at rest with the user data key.
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DestinationProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Preferences]
      operationId: createDestinationProfile
      summary: Create a destination profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DestinationProfileInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/me/destination-profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [Preferences]
      operationId: updateDestinationProfile
      summary: Replace a destination profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DestinationProfileInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Preferences]
      operationId: deleteDestinationProfile
      summary: Delete a destination profile
      description: App rules that point at this profile are removed too.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/app-destination-rules:
    get:
      tags: [Preferences]
      operationId: getAppDestinationRules
      summary: Get Android per-app destination rules
      description: |
        Android only (`EditorInfo.packageName`); iOS does not reliably expose the host app.
        The client computes `appPackageHmac = HMAC-SHA256(perUserRuleKey, packageName)`; the
        server never receives plaintext package names.
      responses:
        '200':
          description: Rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replaceAppDestinationRules
      summary: Replace Android per-app destination rules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/app-destination-rules/key:
    get:
      tags: [Preferences]
      operationId: getAppDestinationRuleKey
      summary: Get the per-account key for app-rule hashes
      description: |
        Returns the 256-bit key behind `appPackageHmac = HMAC-SHA256(key, packageName)`. One key
        per account, shared by all of its devices, created on the first read and never
        regenerated (idempotent: every call returns the same key). Any valid access token may
        read it, guests included; a guest's key moves to the account on sign-in when the account
        has none. The response is `Cache-Control: no-store`; keep the key in the Keystore and
        never log it or send it anywhere. Clients must not invent a local key.
      responses:
        '200':
          description: The account's rule key.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDestinationRuleKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/style-profiles/{languageCode}:
    parameters:
      - $ref: '#/components/parameters/LanguageCodePath'
    get:
      tags: [Preferences]
      operationId: getStyleProfile
      summary: Get the personal writing-style profile for a language
      responses:
        '200':
          description: Style profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Preferences]
      operationId: replaceStyleProfile
      summary: Replace the personal writing-style profile for a language
      description: |
        Requires the `PERSONAL_STYLE` entitlement. Only explicit settings and structured
        on-device-computed `learnedHints` are accepted — never raw writing samples.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleProfile' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/dictionary/changes:
    get:
      tags: [Preferences]
      operationId: pullDictionaryChanges
      summary: Pull personal-dictionary changes since a sync token
      description: |
        Requires the `DICTIONARY_SYNC` entitlement and consent (403 `CONSENT_REQUIRED` when the consent is not granted or was
        withdrawn) and a registered account (403 `GUEST_NOT_ALLOWED` for guests). Words are decrypted server-side for delivery
        over TLS only. Changes come oldest first. A deleted word is delivered as a `DELETE` tombstone that still carries the
        word. On download `clientChangeId` is the id of the dictionary entry. Words are NFC-normalised.

        Tombstones are kept for 180 days. When a tombstone the client has not seen was purged (the client was offline
        for longer than that), the pull answers 410 `SYNC_CURSOR_EXPIRED`: the client discards its sync token and
        downloads the whole dictionary again by pulling without `since`, replaces its synced words with the result, and
        then pushes the changes it still has pending. A pull without `since` is never refused this way.
      parameters:
        - name: since
          in: query
          description: Opaque sync token from a previous response; omit for a full sync. An unknown token is 400. A token that is behind a purged tombstone is 410 `SYNC_CURSOR_EXPIRED`.
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryChangesPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/SyncCursorExpired' }
    post:
      tags: [Preferences]
      operationId: pushDictionaryChanges
      summary: Push a batch of personal-dictionary changes
      description: |
        Idempotent per `clientChangeId` (a re-uploaded change counts as applied and changes nothing). Stored as ciphertext
        plus a keyed HMAC for de-duplication. Last writer wins per word in server arrival order: `ADD` of a live word and
        `DELETE` of an absent word are no-ops. Words are NFC-normalised; a word with whitespace or control characters is
        rejected with code `INVALID_WORD` and an unknown or inactive language with `LANGUAGE_NOT_SUPPORTED`. The returned
        `syncToken` is the high-water mark after this batch; a client that did not pull up to the previous version keeps its
        own pull cursor. Same gates as the pull operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryChangesRequest' }
      responses:
        '200':
          description: Batch result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryChangesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- AI
  /api/v1/ai/translate:
    post:
      tags: [AI]
      operationId: translateText
      summary: Translate explicitly submitted text
      description: |
        Feature `TRANSLATE`. Only the submitted text is processed; it is not persisted unless
        `saveToHistory` is true **and** history is enabled. The result is shown for review and
        inserted only after user confirmation; the host app sends the message.

        Cultural intelligence: Amharic and Tigrinya inflect for addressee gender and formality.
        When `addressee.gender` is `UNKNOWN` the response may include gender `alternatives` and an
        `AMBIGUITY` note. Calendar/time/numeral options convert dates and times (e.g. Ethiopian
        clock hours count from 06:00).

        403 codes: `ACCOUNT_SUSPENDED`, `DELETION_PENDING`, `FEATURE_NOT_ENTITLED`, `CONSENT_REQUIRED`
        and `ON_DEVICE_ONLY_PREFERRED` (the account's `aiProcessingPreference` is `ON_DEVICE_ONLY`:
        server AI is never called, nothing is charged).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateRequest' }
            example:
              text: እባክህ ነገ ጠዋት 3 ሰዓት ላይ ደውልልኝ።
              sourceLanguage: am
              destinationLanguage: en
              style: NATURAL
              preserveNames: true
              culturalOptions:
                calendar: GREGORIAN
                timeNotation: INTERNATIONAL
                numerals: WESTERN
                adaptIdioms: true
      responses:
        '200':
          description: Translation for review.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslateResponse' }
              example:
                requestId: 0193a5c2-6f1e-7c3a-9b2d-4e5f6a7b8c9d
                sourceLanguage: am
                detectedSourceLanguage: am
                detectionConfidence: 0.98
                destinationLanguage: en
                translatedText: Please call me tomorrow at 9 a.m.
                alternatives: []
                notes:
                  - type: CULTURAL
                    message: "Converted Ethiopian time '3 ሰዓት ጠዋት' to 9 a.m."
                qualityTier: BETA
                replayed: false
                usage:
                  featureCode: TRANSLATE
                  unitsCharged: 1
                  unit: REQUEST
                  usageSource: PLAN_ALLOWANCE
                  remaining: 9
                  resetsAt: '2026-11-17T21:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/transform:
    post:
      tags: [AI]
      operationId: transformText
      summary: Grammar, rewrite, tone, summarise, explain or script-convert text
      description: |
        One endpoint for writing tasks; `task` selects the feature code
        (`GRAMMAR_CORRECTION`, `REWRITE`, `TONE_ADJUST`, `SUMMARIZE`, `EXPLAIN_TEXT`, `FORMAT_TEXT`,
        `SCRIPT_CONVERSION`). User text is treated strictly as data, never as instructions.

        Text actions (ADR 0027): "Simplify" is `REWRITE` with `options.mode: SIMPLIFY`, "Make more
        professional" is `TONE_ADJUST` with `options.tone: PROFESSIONAL`, "Explain" is `EXPLAIN_TEXT`,
        "Summarise" is `SUMMARIZE`. `outputLanguage` writes the result in another language than the
        text's (every task except `GRAMMAR_CORRECTION`, which keeps the text's language and answers 400
        `VALIDATION_FAILED` on `outputLanguage` for a different one). `SUMMARIZE` and `EXPLAIN_TEXT` run
        on a longer server time budget (about 12 s per provider attempt, 20 s in total) than the other
        tasks (4 s / 8 s): clients should wait accordingly. `FORMAT_TEXT` restructures `text` into the
        `options.format` shape (`BULLETS`, `NUMBERED_LIST`, `PARAGRAPHS`, `REPORT`, `MEETING_NOTES`)
        without adding facts; placeholders such as `[owner]` cover details the text does not give.

        `SCRIPT_CONVERSION` is AI-assisted whole-sentence conversion of romanised Amharic/Tigrinya
        to Ge'ez with context; it is distinct from local keystroke transliteration.

        **Streaming (companion app only):** send `Accept: text/event-stream` to receive Server-Sent
        Events: `event: delta` (`{"text":"..."}`), `event: done` (a full `TransformResponse`),
        `event: error` (a `Problem`). Usage is settled on `done`; a dropped stream before `done`
        releases the reservation. The keyboard uses JSON with an 8 s client timeout.

        403 codes are those of `/ai/translate`, including `ON_DEVICE_ONLY_PREFERRED`. Tasks the server
        cannot serve yet (`SCRIPT_CONVERSION`) answer 400 `VALIDATION_FAILED` on `task`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransformRequest' }
            example:
              task: TONE_ADJUST
              text: ሰላም፣ ሪፖርቱን ቶሎ ላክልኝ።
              language: am
              options:
                tone: HONORIFIC
              addressee:
                formality: HONORIFIC
                gender: UNKNOWN
      responses:
        '200':
          description: Result for review (JSON or SSE stream).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransformResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE stream with `delta`, `done` and `error` events.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/replies:
    post:
      tags: [AI]
      operationId: suggestReplies
      summary: Suggest replies to text the user explicitly supplied
      description: |
        Feature `SMART_REPLY`. `contextText` must come from an explicit user action (paste,
        selection, share sheet). The keyboard never reads other apps' messages.

        ADR 0027: the replies are written in `replyLanguage`, whatever the language of the message.
        `instructions` are the user's own notes on what to answer, in any supported language; every
        suggestion then says that. `intent` picks a preset stance (`AGREE`, `DISAGREE_POLITELY`,
        `ASK_CLARIFICATION`, `ACCEPT_INVITATION`, `DECLINE_POLITELY`, `THANK_SENDER`) that every
        suggestion takes; omitted, the suggestions are varied. Missing details are never invented: a suggestion may hold a
        bracketed placeholder such as `[time]`. To regenerate, send the same body with a higher
        `variation` and a new `Idempotency-Key` (the same key replays the first answer). Server time
        budget about 12 s per provider attempt, 20 s in total. 403 codes are those of
        `/ai/translate`; 422 `OUTPUT_GUARDRAIL_FAILED` or `CONTENT_REJECTED` charge nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepliesRequest' }
            example:
              contextText: Hi Abebe, can we move tomorrow's meeting to Thursday?
              contextLanguage: en
              replyLanguage: en
              count: 3
              tone: POLITE
              instructions: ሐሙስ ከሰዓት በኋላ ይመቸኛል
      responses:
        '200':
          description: Suggestions.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepliesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/drafts:
    post:
      tags: [AI]
      operationId: draftDocument
      summary: Draft a professional email, letter or similar document
      description: |
        Feature `DRAFT_DOCUMENT`. Supports SSE streaming as described for `/ai/transform` (not
        served yet: the server answers JSON; a follow-up of ADR 0027).

        Write e-mail and other documents with AI (ADR 0027, ADR 0048). Served document types:
        `EMAIL`, `JOB_APPLICATION`, `CV`, `COVER_LETTER`, `BUSINESS_MESSAGE` (the remaining enum
        values answer 400 `VALIDATION_FAILED` `NOT_AVAILABLE` on `documentType`), selected by `mode`:
        - `NEW`: `instructions` describe what the document must say, in the user's language; the server
          writes a complete draft — for e-mail-like types with a subject line — in `language`.
        - `REPLY`: `originalEmail` is the e-mail or message received, `instructions` what to answer;
          the subject starts with `Re: `.
        - `IMPROVE`: `draft` is the user's draft (grammar, clarity, tone); `instructions` optional.
          The subject is returned only when the draft had one.
        The input and output languages may differ. Names, dates, numbers and facts are kept; nothing
        is invented: a detail the user did not give is a bracketed placeholder (`[date]`) listed in
        `placeholders`. To regenerate, send the same body with a higher `variation` and a new
        `Idempotency-Key` (the same key replays the first answer). Server time budget about 20 s per
        provider attempt, 30 s in total. Charged one request (`DRAFT_DOCUMENT`, 3 credits when paid
        by credits); nothing on any failure. 403 codes are those of `/ai/translate`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftRequest' }
            example:
              documentType: EMAIL
              mode: NEW
              language: en
              tone: PROFESSIONAL
              instructions: ለአለቃዬ ነገ ታምሜ ስለሆነ ወደ ስራ እንደማልመጣ እና ሪፖርቱን ሰኞ እንደምልክ ንገረው
              recipient: { name: Ms. Sarah Johnson, formality: FORMAL }
              senderName: Abebe Kebede
      responses:
        '200':
          description: Draft (JSON or SSE stream).
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
              example:
                requestId: 0193a5c2-6f1e-7c3a-9b2d-4e5f6a7b8c9d
                mode: NEW
                language: en
                subject: Sick leave tomorrow
                body: "Dear Ms. Johnson,\n\nI am unwell and will not be able to come to work tomorrow, [date]. I will send the report on Monday.\n\nBest regards,\nAbebe Kebede"
                placeholders: ['[date]']
                notes:
                  - type: QUALITY
                    message: 'Beta quality: please review the result before sending.'
                qualityTier: BETA
                replayed: false
                usage:
                  featureCode: DRAFT_DOCUMENT
                  unitsCharged: 1
                  unit: REQUEST
                  usageSource: PLAN_ALLOWANCE
                  remaining: 49
            text/event-stream:
              schema:
                type: string
                description: SSE stream with `delta`, `done` and `error` events.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/detect-language:
    post:
      tags: [AI]
      operationId: detectLanguage
      summary: Detect language(s) of explicitly submitted text
      description: |
        Feature `DETECT_LANGUAGE` — unmetered, rate-limited. Prefer the on-device language-ID model when installed.
        Available to an account whose deletion is pending; a suspended account gets 403
        `ACCOUNT_SUSPENDED`, and an account whose `aiProcessingPreference` is `ON_DEVICE_ONLY` gets 403
        `ON_DEVICE_ONLY_PREFERRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectLanguageRequest' }
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectLanguageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/feedback:
    post:
      tags: [AI]
      operationId: submitAiFeedback
      summary: Rate an AI result
      description: |
        Stores rating and reason codes linked to `aiRequestId`, which must be a succeeded AI
        request of the caller (anything else is 404). One rating per request: sending it again
        replaces the earlier one (rating, reasons, comment and content), so a retry or a changed
        mind is safe. A free-text `comment` and, with `includeContent` true, the client-supplied
        `inputText` / `outputText` are accepted only with a granted `FEEDBACK_TEXT` consent
        (otherwise 403 `CONSENT_REQUIRED` with `consentCode`, and nothing is stored) and are
        stored encrypted. Without `includeContent` the texts are ignored. Feedback is never used
        to train third-party models.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '202': { description: Feedback recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- History
  /api/v1/me/history:
    get:
      tags: [History]
      operationId: listHistory
      summary: List opt-in AI history items
      description: |
        Newest first. Items past their expiry are not listed (favourites never expire). Texts are
        decrypted for the owner only. Listing works whatever the history setting is, so a person
        who turned history off can still review and delete what is left. A malformed `cursor` is
        400 `VALIDATION_FAILED`.
      parameters:
        - name: favorite
          in: query
          schema: { type: boolean }
        - name: featureCode
          in: query
          schema: { $ref: '#/components/schemas/FeatureCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History page (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [History]
      operationId: clearHistory
      summary: Delete all history items
      description: Deletes every history item of the caller, favourites included. Idempotent.
      responses:
        '204': { description: All history deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/history/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [History]
      operationId: getHistoryItem
      summary: Get one history item
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [History]
      operationId: updateHistoryItem
      summary: Mark or unmark a history item as favourite
      description: |
        Favourites are exempt from automatic retention expiry until unmarked; unmarking starts a
        new expiry of `historyRetentionDays` from now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HistoryItemUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [History]
      operationId: deleteHistoryItem
      summary: Delete one history item
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Speech
  /api/v1/speech/upload-sessions:
    post:
      tags: [Speech]
      operationId: createAudioUploadSession
      summary: Get a short-lived signed URL for an audio upload
      description: |
        For audio longer than the inline limit. The object lives in a private bucket with a
        lifecycle rule and is deleted right after processing (or at `expiresAt` + 1 h at most).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSessionRequest' }
      responses:
        '201':
          description: Upload session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speech/transcriptions:
    post:
      tags: [Speech]
      operationId: createTranscription
      summary: Transcribe speech to text
      description: |
        Feature `SPEECH_TO_TEXT`, metered in seconds of provider-confirmed audio, rounded up to a
        whole second per request. Inline audio (≤ 30 s) usually completes synchronously (200);
        uploaded audio returns a job (202). Audio and transcripts are not retained by default;
        job results are held in an encrypted ephemeral store for at most 10 minutes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscriptionRequest' }
      responses:
        '200':
          description: Completed synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '202':
          description: Job accepted; poll the job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/transcriptions/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Speech]
      operationId: getSpeechJob
      summary: Get a speech job status and result
      description: Used for both transcription and speech-translation jobs. Results expire at `resultExpiresAt`.
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/speech/translations:
    post:
      tags: [Speech]
      operationId: createSpeechTranslation
      summary: Transcribe and translate speech (optionally speak the result)
      description: Feature `SPEECH_TRANSLATE` (seconds). If `synthesizeSpeech` is true, `TEXT_TO_SPEECH` characters are also charged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechTranslationRequest' }
      responses:
        '200':
          description: Completed synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/synthesis:
    post:
      tags: [Speech]
      operationId: synthesizeSpeech
      summary: Text-to-speech and pronunciation playback
      description: |
        Feature `TEXT_TO_SPEECH`, metered in characters. `Accept: application/json` returns a
        short-lived audio URL (≤ 10 min); `Accept: audio/mpeg` or `audio/ogg` streams audio.
        `pronunciationMode` also returns a Latin romanisation produced by the reverse
        transliteration profile.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynthesisRequest' }
      responses:
        '200':
          description: Synthesised speech.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisResponse' }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/ogg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/voices:
    get:
      tags: [Speech]
      operationId: listVoices
      summary: List available TTS voices
      parameters:
        - name: languageCode
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Voices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Voice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Realtime
  /api/v1/realtime/sessions:
    post:
      tags: [Realtime]
      operationId: createRealtimeSession
      summary: Start a voice-to-voice or live-conversation session
      description: |
        Features `VOICE_TO_VOICE` / `LIVE_CONVERSATION`, metered in server-measured seconds of
        session audio. Companion app (and Android keyboard dictation) only. Returns a single-use
        `ticket` (valid 60 s) for the WebSocket `websocketUrl`; pass it as the
        `Sec-WebSocket-Protocol` value `ticket.<ticket>`. Allowance is reserved in 60 s blocks and
        settled on close.

        **WebSocket protocol**
        - Client → server *binary* frames: audio per `audioInput` (default PCM16 little-endian,
          16 kHz, mono, 20–100 ms frames).
        - Client → server *text* frames (`RealtimeClientMessage`): `start`, `speaker_switch`
          (manual turn change in conversation mode), `stop`, `ping`.
        - Server → client *text* frames (`RealtimeServerMessage`): `partial_transcript`,
          `final_transcript`, `translation`, `tts_audio` (base64 chunk; binary frames may be used
          when `audioOutput.transport = BINARY`), `usage`, `error`, `session_ended`, `pong`.
        - The server closes with 4001 (ticket invalid), 4002 (quota exhausted), 4003 (max
          duration), 4500 (provider failure). No audio or transcript is persisted.
      x-websocket-protocol:
        subprotocolPrefix: ticket.
        clientTextMessage: { $ref: '#/components/schemas/RealtimeClientMessage' }
        serverTextMessage: { $ref: '#/components/schemas/RealtimeServerMessage' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealtimeSessionRequest' }
            example:
              mode: LIVE_CONVERSATION
              languageA: am
              languageB: en
              synthesizeSpeech: true
              maxDurationSeconds: 900
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/realtime/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Realtime]
      operationId: getRealtimeSession
      summary: Get realtime session status and billed seconds
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/realtime/sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Realtime]
      operationId: endRealtimeSession
      summary: End a realtime session and settle usage
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Entitlements
  /api/v1/me/entitlements:
    get:
      tags: [Entitlements]
      operationId: getEntitlements
      summary: Get effective plan, allowances and a signed entitlement token
      description: |
        Effective plan = highest `planRank` among ACTIVE/GRACE_PERIOD subscriptions and
        organisation seats (allowances are not summed). `entitlementToken` is an Ed25519 JWS
        valid 24 h with 72 h offline grace; clients may use it **only** for offline gates such as
        on-device premium models. Server-metered features are always re-checked server-side.
        Claims and client verification rules are in the `EntitlementToken` schema; the public keys
        are at `/.well-known/jwks.json`, and `getEntitlementToken` issues a token on its own.
        A subscription in `GRACE_PERIOD` keeps its plan for the grace period (default 3 days
        after the period end when no explicit end is set). An ACTIVE subscription just past its
        period end keeps access for a 24 h renewal lag so late store notifications do not cut
        off paying users (ADR 0007 D22).
      responses:
        '200':
          description: Entitlements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
              example:
                plan:
                  planCode: PREMIUM
                  displayName: Premium
                  planRank: 10
                  source: SUBSCRIPTION
                  effectiveUntil: '2026-12-17T08:00:00Z'
                features:
                  - featureCode: TRANSLATE
                    accessEnabled: true
                    includedUnits: 600
                    unit: REQUEST
                    resetPeriod: MONTHLY
                    used: 42
                    remaining: 558
                    resetsAt: '2026-12-17T08:00:00Z'
                  - featureCode: ON_DEVICE_AI_MODELS
                    accessEnabled: true
                    unit: NONE
                    resetPeriod: NONE
                creditBalance: 250
                entitlementToken:
                  jws: eyJhbGciOiJFZERTQSIsImtpZCI6ImVudC0yMDI2LTExIn0.eyJzdWIiOiIuLi4ifQ.c2ln
                  keyId: ent-2026-11
                  expiresAt: '2026-11-18T08:00:00Z'
                  offlineGraceUntil: '2026-11-21T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/entitlements/token:
    get:
      tags: [Entitlements]
      operationId: getEntitlementToken
      summary: Get a fresh signed entitlement token
      description: |
        Issues a new `EntitlementToken` (the same token `getEntitlements` embeds) from the
        entitlements in force now, without usage figures, so the keyboard can refresh its offline
        gates cheaply. Any active account may call it, guests included (their gates are all false).
        A suspended account gets 403 `ACCOUNT_SUSPENDED` and a deletion-pending one 403
        `DELETION_PENDING`; on any 401 or 403 the client drops its cached token. Every call signs a
        new token (new `jti`), so a user may call it 60 times per hour (429 `RATE_LIMITED` with
        `Retry-After`). The response is `Cache-Control: no-store`.
      responses:
        '200':
          description: A new entitlement token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementToken' }
              example:
                jws: eyJhbGciOiJFZERTQSIsInR5cCI6InFhbC1lbnQrand0Iiwia2lkIjoiZW50LTIwMjYtMTEifQ.eyJzdWIiOiIuLi4ifQ.c2ln
                keyId: ent-2026-11
                expiresAt: '2026-11-19T08:00:00Z'
                offlineGraceUntil: '2026-11-22T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /.well-known/jwks.json:
    get:
      tags: [Entitlements]
      operationId: getEntitlementTokenKeys
      summary: Get the public keys that sign entitlement tokens
      description: |
        RFC 7517 JWK Set of the Ed25519 (RFC 8037) keys that sign entitlement tokens: the current
        signing key first, then, during a rotation, previous keys, which stay listed until every
        token they signed is past its offline grace (96 h after their last use). Clients verify
        with the key set **pinned in the app build** and never trust a key only because it was
        listed here; a new key is shipped in app builds before it starts signing (ADR 0013).
        Anonymous (the `Authorization` header is ignored) and outside `/api/v1`, so the app-version
        gate does not apply.
      security: []
      responses:
        '200':
          description: The published key set.
          headers:
            Cache-Control:
              description: '`max-age=3600, public`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                    kid: ent-2026-11
                    use: sig
                    alg: EdDSA
  /api/v1/me/usage:
    get:
      tags: [Entitlements]
      operationId: getUsage
      summary: Get usage per feature for current and recent periods
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/credits:
    get:
      tags: [Entitlements]
      operationId: getCredits
      summary: Get AI credit balance and lots
      description: |
        The caller's own credits (SD 15.4, 15.6), guests included. `balanceUnits` is the exact spendable
        balance (6 dp; show it rounded down). `lots` are the lots that still have credits and have not
        expired, soonest expiry first (the order they are spent in); `nextExpiryAt` is the soonest of
        their expiries (absent when none expires). Credits work in every country.
      responses:
        '200':
          description: Credit summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/credits/transactions:
    get:
      tags: [Entitlements]
      operationId: listCreditTransactions
      summary: List AI credit ledger entries
      description: |
        The caller's own append-only credit ledger, newest first (purchases, consumption, returns of unused
        reservations as `ADJUSTMENT`, expiry, refund reversals). `paymentOrderId` is set on the rows of a
        purchased lot. Keyset paging: pass `nextCursor` back as `cursor`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger page (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditTransaction' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Billing
  /api/v1/billing/options:
    get:
      tags: [Billing]
      operationId: getBillingOptions
      summary: Get approved purchase flow, products and payment methods
      description: |
        Evaluates `billing_market_channel_policies` (missing/expired/REVIEW_REQUIRED/BLOCKED
        ⇒ `purchaseUiAllowed = false`, `purchaseFlow = NONE`). Methods are returned only when the
        provider, merchant account, base method, account method, adapter and policy gates all pass.
        Only public method codes are exposed — never merchant-account IDs or secret references.

        **Billing country (ADR 0045).** The server resolves it and is the final authority: the edge's
        `CF-IPCountry` (trusted only from a configured edge), checked against the client hints
        `X-Qal-Network-Country` / `X-Qal-Sim-Country`. Hints alone never unlock a country-specific
        provider: without a trusted IP country the global default applies. The resolved country is
        returned as `marketCountry` (`ZZ` = global default) with `marketResolution`; send that value
        back as `CreateOrderRequest.marketCountry`. Options are ordered by provider priority (the
        first method is the default). Existing entitlements never depend on the current country.

        **Market offerings (T8.10).** `products` lists only the product families the resolved market sells
        (`SUBSCRIPTIONS` and/or `AI_CREDITS`, admin `/admin/v1/billing/market-offerings/{countryCode}`; a
        market without its own setting inherits `ZZ`): a credits-only market lists no plans, a plans-only
        market no credit packs. Credit packs (`productType = AI_CREDIT_PACK`) carry `creditUnits`,
        `creditValidityDays` and one `ONE_TIME` price with `renewalModel = NONE` (no subscription, nothing
        to cancel).

        **Store-billed credit packs (T8.10, outside Ethiopia).** With `purchaseFlow = STORE_BILLING` (Google
        Play through RevenueCat) `products` lists the credit packs sellable through the store in the market
        (ACTIVE pack, the market offers `AI_CREDITS`, an active store product mapping): one `ONE_TIME` price
        with `renewalModel = STORE_MANAGED`, `storeProductId` (the Play / RevenueCat product identifier, e.g.
        `credits_500`) and the suggested RevenueCat `storeOfferingId` / `storePackageId`. Its `listPrice` is a
        placeholder (the store sets and charges the price): show the store's formatted price for
        `storeProductId`. Buy with the store SDK, then report the purchase to `/billing/store-purchases`;
        store purchases never use orders. Store-billed plans keep coming from the RevenueCat offering.
        A build without store billing (`distributionChannel = DIRECT_DOWNLOAD` or `WEB`) in a store-billing
        market gets `purchaseUiAllowed = false`, `purchaseFlow = NONE` and a `notice` (no purchase in this
        build): Play Billing exists only for apps installed from Google Play.
      parameters:
        - name: marketCountry
          in: query
          required: false
          description: Informational client guess; ignored for eligibility (the server resolves the billing country).
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: clientPlatform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
        - name: distributionChannel
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DistributionChannel' }
        - name: storefront
          in: query
          description: Store storefront country reported by the store SDK, when available.
          schema: { type: string, maxLength: 8 }
        - $ref: '#/components/parameters/NetworkCountry'
        - $ref: '#/components/parameters/SimCountry'
      responses:
        '200':
          description: Options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/billing/products:
    get:
      tags: [Billing]
      operationId: listBillingProducts
      summary: List sellable products and active prices for a market and channel
      description: |
        Only ACTIVE products with an active price, of the product families the market offers (see
        `getBillingOptions`). Where the market's policy for the channel is `STORE_BILLING` (outside
        Ethiopia), the store-sellable credit packs with their `storeProductId` instead (whatever the policy's
        approval; nothing for a channel without store billing).
      parameters:
        - name: marketCountry
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: salesChannel
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SalesChannel' }
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/billing/promotions/validate:
    post:
      tags: [Billing]
      operationId: validatePromotion
      summary: Check a promotion code against a product and market
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionValidateRequest' }
      responses:
        '200':
          description: Validation result (invalid codes return `valid = false`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/billing/orders:
    post:
      tags: [Billing]
      operationId: createPaymentOrder
      summary: Create a server-priced payment order
      description: |
        The server resolves the active price for product, period, market, channel and renewal
        model; the client never supplies an amount. `amount.total = list − discount + (tax if
        EXCLUSIVE)`. Upgrades (`upgradeFromSubscriptionId`) apply the unused value of the
        current term as a server-computed discount. Store purchases do **not** use orders — see
        `/billing/store-purchases`.

        `marketCountry` must equal the billing country the server resolves for this request (ADR
        0045, see `/billing/options`), otherwise 403 `BILLING_POLICY_DENIED`; `salesChannel` must
        match `X-Client-Platform` when that header is sent. The resolved country and a summary of
        the signals (never an IP address) are recorded on the order for audit. Guests get 403
        `GUEST_NOT_ALLOWED` (a guest's credits or plan could not follow it; sign in first).

        **Prepaid credit packs (T8.10, SD 15.6).** `productCode` of an `AI_CREDIT_PACK` (e.g. `CREDITS_500`)
        with `billingPeriod: ONE_TIME`; `renewalPreference` is `NONE` (omitted or `MANUAL_RENEW` is read as
        `NONE`; `AUTO_RENEW` is 422 `MANDATE_NOT_SUPPORTED`). The order is `orderType = AI_CREDIT_TOPUP`, a
        one-off payment through the same attempts, verification and receipts as plans. Once verified PAID
        it grants exactly one credit lot (`fulfilment.creditLotId`) of the pack's credit units, expiring
        after the pack's validity; the units and validity are fixed when the order is created. A product
        family the market does not offer (admin market offerings) is 422 `PRODUCT_NOT_AVAILABLE`, like an
        unknown or inactive product. Store-billing markets (outside Ethiopia) never use orders, for plans or
        packs: 403 `BILLING_POLICY_DENIED`; buy through the store and report the purchase to
        `/billing/store-purchases`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/NetworkCountry'
        - $ref: '#/components/parameters/SimCountry'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example:
              productCode: PLAN_PREMIUM
              billingPeriod: MONTHLY
              marketCountry: ET
              salesChannel: ANDROID_DIRECT
              renewalPreference: MANUAL_RENEW
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
              example:
                orderId: 0193a5c2-7a10-7d11-8e2f-1a2b3c4d5e6f
                orderReference: EAK-ET-2611-7Q4M2X
                orderType: SUBSCRIPTION_PURCHASE
                status: AWAITING_PAYMENT
                productCode: PLAN_PREMIUM
                billingPeriod: MONTHLY
                renewalModel: MANUAL_RENEW
                marketCountry: ET
                salesChannel: ANDROID_DIRECT
                taxBehavior: INCLUSIVE
                amounts:
                  list: { amountMinor: 29900, currency: ETB, exponent: 2 }
                  discount: { amountMinor: 0, currency: ETB, exponent: 2 }
                  tax: { amountMinor: 3900, currency: ETB, exponent: 2 }
                  total: { amountMinor: 29900, currency: ETB, exponent: 2 }
                expiresAt: '2026-11-17T09:30:00Z'
                allowedMethods:
                  - methodCode: CHAPA_TELEBIRR
                    providerCode: CHAPA
                    displayName: telebirr
                    methodType: MOBILE_MONEY
                    supportsAutoRenew: false
                    requiresRedirect: true
                createdAt: '2026-11-17T09:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/billing/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Billing]
      operationId: getPaymentOrder
      summary: Get order status and fulfilment
      description: Poll after returning from checkout. A redirect/success screen is never proof of payment.
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: cancelPaymentOrder
      summary: Cancel an unpaid order
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/billing/orders/{orderId}/attempts:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: createPaymentAttempt
      summary: Start a payment attempt with an approved method
      description: |
        The server resolves the provider, merchant account and account-enabled method from the
        public `methodCode` and the order's market/currency/environment. Retrying with another
        method creates a new attempt on the same order (never a duplicate entitlement). While a
        hosted checkout of the same method is still open, a new key returns that open attempt
        instead of creating a second provider session (ADR 0045).

        Hosted checkout (`nextAction.type = REDIRECT`): open `checkoutUrl` in a WebView or custom
        tab. The provider sends the payer back to `/api/v1/billing/return/{attemptId}`, which only
        triggers a server-side verification and redirects (303) to the app's return URI
        (`qalkeyboard://billing/return?orderId=…&attemptId=…&result=…`); the app intercepts either
        URL, closes the checkout and polls the order. A return is never proof of payment.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttemptRequest' }
      responses:
        '201':
          description: Attempt started; follow `nextAction`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/billing/orders/{orderId}/attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Billing]
      operationId: getPaymentAttempt
      summary: Get payment attempt status
      responses:
        '200':
          description: Attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/return/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Billing]
      operationId: returnFromCheckout
      summary: Landing URL the hosted checkout redirects the payer to
      description: |
        Used as the provider's success/cancel/error URL (ADR 0045). No bearer token (the payer's
        browser arrives here). It never changes payment state: for an open attempt it queues a
        server-to-server verification (at most once per 30 s per attempt), then answers 303 to the
        app's allow-listed return URI with `orderId`, `attemptId` and `result`. Unknown attempts
        are 404.
      security: []
      parameters:
        - name: result
          in: query
          required: false
          description: Which provider URL was used. UX only; never trusted.
          schema:
            type: string
            enum: [success, cancel, error]
      responses:
        '303':
          description: Redirect to the app's return URI.
          headers:
            Location:
              description: e.g. `qalkeyboard://billing/return?orderId=…&attemptId=…&result=success`.
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/orders/{orderId}/manual-transfer-claims:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: submitManualTransferClaim
      summary: Submit a bank-transfer reference for reconciliation
      description: |
        A claim only. Premium is never granted from a screenshot; finance reconciles against bank
        data or an authorised reviewer approves. Evidence is stored privately with restricted access.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ManualTransferClaimForm' }
            encoding:
              evidence:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '201':
          description: Claim submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualTransferClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/billing/mandates:
    post:
      tags: [Billing]
      operationId: createPaymentMandate
      summary: Start a recurring-payment mandate after explicit consent
      description: |
        Requires a granted, unrevoked `PAYMENT_MANDATE` consent record (`consentRecordId`) and an
        account-level method approved for auto-renew (`MANDATE_NOT_SUPPORTED` otherwise). A prior
        one-time charge is never treated as a mandate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMandateRequest' }
      responses:
        '201':
          description: Mandate created; follow `nextAction` to sign it with the provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/billing/mandates/{mandateId}:
    parameters:
      - $ref: '#/components/parameters/MandateId'
    delete:
      tags: [Billing]
      operationId: revokePaymentMandate
      summary: Revoke a mandate and stop future debits
      description: Calls provider cancellation where supported and records the outcome; no further debits are scheduled either way.
      responses:
        '200':
          description: Mandate revoked (or cancellation pending at provider).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/store-purchases:
    post:
      tags: [Billing]
      operationId: verifyStorePurchase
      summary: Verify and link a Google Play or App Store purchase
      description: |
        Verifies with the Play Developer API or App Store Server API, checks `appAccountToken` /
        obfuscated account ID matches the caller, acknowledges Google purchases (within 3 days or
        Google refunds them) and fulfils the same internal subscription/credit records.
        Re-submitting the same purchase is idempotent.

        **`provider: REVENUECAT`** (ADR 0046, the global store option): the app buys through the
        RevenueCat SDK, configured with the caller's RevenueCat App User ID = the caller's `userId`
        (lower-case UUID, never an e-mail or phone number), then reports `productId` (the RevenueCat
        product identifier, Play `subscriptionId:basePlanId`). The server never trusts the client: it
        reads the caller's customer from the RevenueCat REST API (secret key) and links every mapped,
        current store subscription it finds (`store_purchases`, STORE_MANAGED terms). No token is sent.
        The store acknowledges Google purchases through RevenueCat. Registered users only (guests 403
        `GUEST_NOT_ALLOWED`). `STORE_PURCHASE_INVALID` (422) when RevenueCat has no such purchase for the
        caller, the product is not mapped to a plan, or the purchase environment (sandbox / production)
        is not the one this server honours. RevenueCat unreachable: 503 `PROVIDER_UNAVAILABLE`.

        **`provider: GOOGLE_PLAY` / `APPLE_APP_STORE`** keep their shape. While the server has no direct
        Play / App Store adapter they are verified the same way, through the configured store-verification
        provider (`qal.billing.store-verification-provider`, default REVENUECAT) by the caller's user id:
        `purchaseToken` / `signedTransactionInfo` are accepted but neither trusted, stored nor logged.
        The RevenueCat App User ID is the access token's `sub` (= `userId`).

        **Credit packs (T8.10, store consumables).** `productId` is the pack's store product id (e.g.
        `credits_500`, `storeProductId` in the billing options) and `transactionId` the store transaction id
        (Play order id `GPA.…`; optional: without it the caller's most recent transaction of the product is
        answered). The server reads the caller's RevenueCat customer (`non_subscriptions`) and grants **one**
        credit lot per store transaction (`creditLotId`, `creditUnits`, `creditsExpireAt` = store purchase
        time + the pack's validity), only when the transaction is listed for the caller, of the honoured
        environment, and the pack is sellable through the store in its market (ACTIVE pack, the market offers
        AI credits, an approved `STORE_BILLING` policy). Re-reports, the RevenueCat webhook (which also grants
        on its own, e.g. when the app was closed), replays and concurrent calls never grant twice. A
        verified purchase that may not be granted yet is kept and granted once the market opens: 403
        `BILLING_POLICY_DENIED` (policy not approved) or 422 `PRODUCT_NOT_AVAILABLE` (pack or offering off)
        meanwhile. A transaction of another account, unknown or not (yet) listed: 422
        `STORE_PURCHASE_INVALID`. A store refund reverses the unused credits (status `REFUNDED`).
        `distributionChannel` `DIRECT_DOWNLOAD` / `WEB` (a build without store billing): 403
        `BILLING_POLICY_DENIED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorePurchaseRequest' }
      responses:
        '200':
          description: Verified and linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorePurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/subscriptions:
    get:
      tags: [Billing]
      operationId: listSubscriptions
      summary: List current and past subscriptions
