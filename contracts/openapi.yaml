  # ---------------------------------------------------------------- Webhooks
  /api/v1/billing/webhooks/{providerCode}/{accountCode}:
    parameters:
      - $ref: '#/components/parameters/ProviderCodePath'
      - name: accountCode
        in: path
        required: true
        description: Merchant account code; selects the account-specific webhook secret.
        schema: { type: string, maxLength: 60, pattern: '^[A-Za-z0-9_-]+$' }
    post:
      tags: [Webhooks]
      operationId: receiveGatewayWebhook
      summary: Receive a payment-gateway webhook
      description: |
        No bearer token. Processing:
        1. Verify the provider signature with the merchant account's webhook secret (and network
           allowlist where supported). Invalid ⇒ 401, event stored as INVALID, not processed.
        2. Persist idempotently on `(provider, external_event_id)`; providers without event IDs
           use `sha256(payload)`. Store only a redacted payload and its hash.
        3. Acknowledge with 200 immediately; process asynchronously via the outbox.
        4. Fetch the transaction from the provider API and match order reference, amount,
           currency, merchant account, method and environment before fulfilment. The webhook body
           alone never grants anything.

        Providers that do not sign their callbacks (ArifPay, ADR 0045) are authenticated with the
        per-attempt token `t` that the server put into the notify URL (an HMAC of the account and the
        payment's merchant reference under the account's webhook secret); a missing or wrong token is
        401 `WEBHOOK_SIGNATURE_INVALID`.

        Chapa (ADR 0045, step A2) signs with the dashboard webhook secret (`CHAPA_WEBHOOK_SECRET`):
        `x-chapa-signature` = hex HMAC-SHA256 of the payload, and/or `chapa-signature` = hex
        HMAC-SHA256 of the secret itself (as documented by Chapa). One valid header is enough; none or
        only wrong ones ⇒ 401. Chapa sends no event id: the event is stored under
        `event:reference:status`. Chapa's `callback_url` (a GET) is pointed at
        `/billing/return/{attemptId}`, which only queues a verification.
      security: []
      parameters:
        - name: t
          in: query
          required: false
          description: Notification token embedded in the notify URL by the server (unsigned providers only). Never logged.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RawProviderEvent' }
      responses:
        '200':
          description: Received (including duplicates).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/store-notifications/{providerCode}:
    parameters:
      - name: providerCode
        in: path
        required: true
        schema:
          type: string
          enum: [GOOGLE_PLAY, APPLE_APP_STORE, REVENUECAT]
    post:
      tags: [Webhooks]
      operationId: receiveStoreNotification
      summary: Receive Google Play RTDN, App Store Server Notifications V2 or RevenueCat webhooks
      description: |
        Google: Pub/Sub push with OIDC-authenticated push subscription (verify the Google-signed
        JWT audience). Apple: `signedPayload` JWS verified against Apple's certificate chain.
        Stored idempotently, acknowledged with 200, then verified against the Play Developer API /
        App Store Server API before any `store_purchases` or subscription change.

        **REVENUECAT** (ADR 0046): the `Authorization` header must equal the value configured in the
        RevenueCat dashboard (`REVENUECAT_WEBHOOK_AUTH`, compared in constant time); when a signing
        secret is configured (`REVENUECAT_WEBHOOK_SIGNING_SECRET`), `X-RevenueCat-Webhook-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`, at most 5 minutes old) must be valid too.
        Wrong or missing ⇒ 401, stored as INVALID. Deduplicated on the event `id`; the event (minus
        subscriber attributes) is kept in `store_purchase_events`. Processing never trusts the body: it
        re-reads the customer from the RevenueCat REST API and applies the current state, so retries
        and out-of-order delivery are safe. Always answers exactly 200 for a stored or duplicate event
        (RevenueCat treats any other 2xx as a failure). 404 when the store provider has no adapter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RawProviderEvent' }
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Authentication of the notification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

