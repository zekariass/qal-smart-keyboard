  # ---------------------------------------------------------------- Admin (interim, B3.2)
  /admin/v1/language-datasets:
    post:
      tags: [Admin]
      operationId: registerLanguageDatasets
      summary: Register source datasets with their licences (admin)
      description: |
        Records the corpora, wordlists and other inputs that packs are built from (`language_datasets`, rule N10).
        Accepts the `datasets.manifest.json` document written by the pack build as is (unknown members are
        ignored). Every licence must be on the commercial-use allow-list (`language-data/licenses.json`: unknown
        codes fail closed, any `-NC` code is refused). New rows get `permittedUses` `[COMMERCIAL]` and review status
        `PENDING_REVIEW`; an existing code is left unchanged and must carry the same licence (otherwise
        `PUBLICATION_CONFLICT`). Permission `resources:upload`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLanguageDatasetsRequest' }
      responses:
        '200':
          description: The datasets as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanguageDatasetList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/language-resources:
    post:
      tags: [Admin]
      operationId: uploadLanguageResource
      summary: Upload a signed language pack (admin)
      description: |
        The body is one pack container (`docs/specs/pack-format-v1.md`), at most 33 685 504 bytes by default.
        It is verified exactly as a device verifies it (size, framing, key, strict Ed25519 signature, manifest,
        key-id match, size, SHA-256) against `resource_signing_keys`, then checked against the publishing policy:
        no delta packs yet, signed by an `ACTIVE` key, a catalogue language, a commercial licence on the
        allow-list, at least one registered commercial dataset (`datasetCode`), for `TRANSLITERATION_RULES` a
        profile id equal to a backend `profile_code` of the language (ADR 0007 D21), and a version newer than every
        version of the (language, type, platform) slot that was ever released. A refusal is a `PACK_REJECTED`
        Problem whose `reason` names the failed check. The accepted pack is stored and listed as `DRAFT`
        (invisible to clients). Permission `resources:upload`.
      x-internal: true
      parameters:
        - name: datasetCode
          in: query
          description: Code of a registered source dataset the pack was built from; repeat for several (1-50).
          schema:
            type: array
            maxItems: 50
            items: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }
          style: form
          explode: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded as a draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PackRejected' }
        '415':
          description: The body is not `application/octet-stream` (`UNSUPPORTED_MEDIA_TYPE`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/PackRejected' }
  /admin/v1/language-resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Admin]
      operationId: getAdminLanguageResource
      summary: Get a language resource in any state (admin)
      description: Permission `languages:read`.
      x-internal: true
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/language-resources/{resourceId}/stage:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      operationId: stageLanguageResource
      summary: Stage a draft on the INTERNAL channel (admin)
      description: |
        `DRAFT` to `STAGED`: re-checks the policy, re-signs the pack with the server key with
        `releaseChannel` `INTERNAL` in its signed manifest, and publishes it on the `INTERNAL` channel at 100 %
        (visible to internal builds only). A rules pack may use a `DRAFT` or `ACTIVE` profile here. Permission
        `resources:edit`.
      x-internal: true
      responses:
        '200':
          description: Staged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PackRejected' }
  /admin/v1/language-resources/{resourceId}/stable-approval:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      operationId: approveLanguageResourceForStable
      summary: Approve a staged or beta resource for STABLE (admin, four-eyes)
      description: |
        Records the second pair of eyes that publishing to `STABLE` needs (Review D25) as an audit event. The admin
        who then publishes must be someone else. Permission `resources:approve`.
      x-internal: true
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/language-resources/{resourceId}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      operationId: publishLanguageResource
      summary: Publish a staged resource to BETA or STABLE (admin)
      description: |
        `STAGED` or `PUBLISHED` to `PUBLISHED` on `BETA` or `STABLE` with a rollout percentage and an optional
        minimum app version (default: the current one). The channel never narrows (retire instead). Re-checks the
        policy (a rules pack needs an `ACTIVE` profile, rule N9), re-signs the pack with the server key for that
        channel and minimum app version (same resource id, version and artifact, so devices treat it as the same
        pack) and links the rules pack to its `ACTIVE` profile. `STABLE` needs a prior approval by another admin
        (`APPROVAL_REQUIRED` otherwise). Repeat the call to change the rollout or to re-sign after a key rotation.
        Permission `resources:publish`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishLanguageResourceRequest' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PackRejected' }
  /admin/v1/language-resources/{resourceId}/retire:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      operationId: retireLanguageResource
      summary: Retire a draft, staged or published resource (admin)
      description: Clients stop discovering it; its version still counts for downgrade protection. Permission `resources:publish`.
      x-internal: true
      responses:
        '200':
          description: Retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLanguageResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/pack-signer:
    get:
      tags: [Admin]
      operationId: getPackSigner
      summary: The server's pack signing key (admin)
      description: Public key only, and whether it is registered in `resource_signing_keys`. Permission `signing_keys:manage`.
      x-internal: true
      responses:
        '200':
          description: The signing key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackSigner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/resource-signing-keys:
    post:
      tags: [Admin]
      operationId: registerResourceSigningKey
      summary: Register a resource-signing public key (admin)
      description: |
        The server's own key is registered without an endorsement (it is pinned in app builds). Any other key is
        endorsed by the server key (`docs/specs/pack-format-v1.md` 7.4), which must be registered `ACTIVE`, unless
        `endorse` is false (a key that may only sign uploads, such as a build pipeline key; devices never trust it).
        Permission `signing_keys:manage`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterSigningKeyRequest' }
      responses:
        '201':
          description: Registered as `ACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSigningKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/resource-signing-keys/{keyId}/retire:
    parameters:
      - $ref: '#/components/parameters/SigningKeyIdPath'
    post:
      tags: [Admin]
      operationId: retireResourceSigningKey
      summary: Mark an ACTIVE signing key RETIRING (admin)
      description: Its packs still verify; it may no longer sign uploads. Permission `signing_keys:manage`.
      x-internal: true
      responses:
        '200':
          description: Retiring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSigningKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/resource-signing-keys/{keyId}/revoke:
    parameters:
      - $ref: '#/components/parameters/SigningKeyIdPath'
    post:
      tags: [Admin]
      operationId: revokeResourceSigningKey
      summary: Revoke a signing key (admin)
      description: Never verifies again; discovery stops serving packs it signed until they are re-signed. Permission `signing_keys:manage`.
      x-internal: true
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSigningKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/billing/provider-routes/{countryCode}/{clientPlatform}/{distributionChannel}:
    parameters:
      - name: countryCode
        in: path
        required: true
        description: ISO 3166-1 alpha-2 billing country, or `ZZ` for the global default used by countries without routes.
        schema: { $ref: '#/components/schemas/CountryCode' }
      - name: clientPlatform
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
      - name: distributionChannel
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DistributionChannel' }
    get:
      tags: [Admin]
      operationId: getProviderRoutes
      summary: Ordered payment providers for a country and channel (admin)
      description: |
        The provider resolution layer's configuration (ADR 0045): providers in priority order (the first
        eligible one is the default), each with its live eligibility so an operator can see why one is
        skipped. Permission `billing:read`. An unconfigured scope returns an empty list with revision 0.
      x-internal: true
      responses:
        '200':
          description: The route set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderRouteSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      operationId: replaceProviderRoutes
      summary: Replace the ordered providers for a country and channel (admin)
      description: |
        Switches the default provider (e.g. ArifPay ⇄ Chapa for Ethiopia) without a deploy: the list order
        is the priority order. `expectedRevision` is the revision last read (0 for a new scope); a stale one
        is 409 `REVISION_CONFLICT` with `currentRevision`. Providers must exist in `payment_providers`;
        this does not activate a provider, merchant account or market policy (those gates still apply).
        An empty list removes the scope (countries then fall back to `ZZ`). Permission
        `providers:configure`; audited as `BILLING_PROVIDER_ROUTES_REPLACE`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderRouteSetUpdate' }
      responses:
        '200':
          description: The new route set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderRouteSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/billing/products:
    get:
      tags: [Admin]
      operationId: listAdminBillingProducts
      summary: Billing products with their price rows (admin)
      description: |
        Every product (any status) with its price rows, newest first, optionally only the rows of one
        market. Permission `billing:read`.
      x-internal: true
      parameters:
        - name: marketCountry
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CountryCode' }
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminBillingProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/billing/products/{productCode}:
    parameters:
      - $ref: '#/components/parameters/AdminProductCode'
    patch:
      tags: [Admin]
      operationId: updateAdminBillingProduct
      summary: Edit a billing product (admin)
      description: |
        Display name, description, and for credit packs the credit units and validity (days) of the
        pack. Orders already created keep the units and validity they were created with. Changing
        `productStatus` (DRAFT, ACTIVE, RETIRED; only ACTIVE products are sold) needs `prices:approve`,
        everything else `prices:edit`. Audited as `BILLING_PRODUCT_UPDATE`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBillingProductUpdate' }
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBillingProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/billing/products/{productCode}/prices/{marketCountry}/{salesChannel}:
    parameters:
      - $ref: '#/components/parameters/AdminProductCode'
      - name: marketCountry
        in: path
        required: true
        description: ISO 3166-1 alpha-2 market, or `ZZ` for the global market (unknown or untrusted billing country).
        schema: { $ref: '#/components/schemas/CountryCode' }
      - name: salesChannel
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SalesChannel' }
    put:
      tags: [Admin]
      operationId: setAdminBillingPrice
      summary: Set a product's price for a market and channel (admin)
      description: |
        Sets the price of one scope (product, market, channel, currency, billing period, renewal model)
        without a deploy. The scope's current row is updated in place while no order uses it; once an
        order references it, it is closed (`validUntil` = now) and a new `priceVersion` starts now, so
        every order keeps the exact price it was created with. `active: false` ends the scope's price
        (nothing is sold in it). The same values again change nothing. Credit packs use `ONE_TIME` +
        `NONE`; subscriptions a term period (`MONTHLY`, `ANNUAL`, ...) with `MANUAL_RENEW`. Permission
        `prices:edit`; audited as `BILLING_PRICE_SET` (old and new amounts).
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBillingPriceUpdate' }
      responses:
        '200':
          description: The product with its price rows in this market.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBillingProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/billing/market-offerings/{countryCode}:
    parameters:
      - name: countryCode
        in: path
        required: true
        description: ISO 3166-1 alpha-2 market, or `ZZ` for the default every market without its own setting inherits.
        schema: { $ref: '#/components/schemas/CountryCode' }
    get:
      tags: [Admin]
      operationId: getMarketOfferings
      summary: Product families a market sells (admin)
      description: |
        Whether the market sells `SUBSCRIPTIONS` (plans) and `AI_CREDITS` (credit packs): each with the
        market's own setting or the inherited `ZZ` default (`source`), off when neither exists (fail
        closed). Enforced in `/billing/options`, `/billing/products` and order creation. It never changes
        existing subscriptions, credit lots or entitlements. Permission `billing:read`.
      x-internal: true
      responses:
        '200':
          description: The market's offerings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOfferingSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      operationId: replaceMarketOfferings
      summary: Set what a market sells (admin)
      description: |
        Replaces the market's own settings: each listed offering is set for the market, an offering left
        out inherits `ZZ` again (for `ZZ` itself: off). Credits only, for example:
        `{"expectedRevision": 1, "offerings": [{"offering": "SUBSCRIPTIONS", "enabled": false},
        {"offering": "AI_CREDITS", "enabled": true}]}`. `expectedRevision` is the revision last read (0
        when the market has no settings); a stale one is 409 `REVISION_CONFLICT` with `currentRevision`.
        Products still need an ACTIVE status, an active price in the market and an approved market/channel
        policy to be sold. Permission `prices:edit`; audited as `BILLING_MARKET_OFFERINGS_REPLACE`.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketOfferingSetUpdate' }
      responses:
        '200':
          description: The market's offerings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOfferingSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived (10–15 min) user access token from `/auth/*`. Guest tokens carry `accountType = GUEST`.
        Where the token is optional (`security: [{}, bearerAuth]`), a token that is sent must be valid:
        an invalid or expired one gets 401 and is never silently ignored.
    partnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key (sk_live_… / sk_test_…)
      description: |
        Partner API key sent as `Authorization: Bearer sk_live_…`. Stored server-side as prefix +
        SHA-256 hash; scoped (translate, transform, transliterate, detect_language, speech,
        usage_read), rate-limited per key and optionally IP-restricted. `sk_test_` keys hit
        sandbox providers and are not billed.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, unique per logical operation, retained for at least 24 h per user/API client.
        Reusing a key after the original request **failed** (or its reservation was released)
        returns that original failed/released outcome, not a fresh attempt: the client must use
        a **new key** for every new attempt.
        - **At-most-once charging:** usage, credits, orders, attempts, mandates and store fulfilment
          are applied at most once per key.
        - **AI results:** a retry with the same key and body returns the original result from an
          encrypted ephemeral cache (≤ 10 min, `replayed: true`). After cache expiry the request is
          recomputed **without a second charge**. PostgreSQL never stores AI text.
        - Reusing a key with a different body returns 409 `IDEMPOTENCY_KEY_REUSED`; an in-flight
          duplicate returns 409 `REQUEST_IN_PROGRESS` with `Retry-After`.
        - **Keys older than 24 h** may be refused with 409 `IDEMPOTENCY_KEY_REUSED`: the server keeps the
          request fingerprint for 24 h only and never hands out a result it cannot verify against the body.
          Use a new key for anything older.
        - A replay served from the cache keeps the **original `requestId` and `usage`** (`replayed: true`);
          it never reports a second charge.
        - Replaying a key whose original request was **cancelled** (the client went away before the
          result) returns 503 `PROVIDER_UNAVAILABLE`, like any other released original; use a new key.
      schema: { type: string, format: uuid }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Semantic app version, e.g. `2.0.3`.
      schema: { type: string, maxLength: 40 }
    NetworkCountry:
      name: X-Qal-Network-Country
      in: header
      required: false
      description: |
        Client hint (ADR 0045): ISO 3166-1 alpha-2 country of the mobile network the device is on
        (Android `TelephonyManager.networkCountryIso`). Case-insensitive; invalid or empty values are
        ignored. Supporting evidence only: it never unlocks a payment method on its own.
      schema: { type: string, maxLength: 8 }
    SimCountry:
      name: X-Qal-Sim-Country
      in: header
      required: false
      description: |
        Client hint (ADR 0045): ISO 3166-1 alpha-2 country of the SIM provider (Android
        `TelephonyManager.simCountryIso`). Same rules as `X-Qal-Network-Country`.
      schema: { type: string, maxLength: 8 }
    ClientSurface:
      name: X-Client-Surface
      in: header
      required: false
      description: Which client surface made the call (affects timeouts, streaming and analytics).
      schema:
        type: string
        enum: [KEYBOARD, COMPANION]
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: UI locale for messages (e.g. `am`, `ti`, `om`, `en`).
      schema: { type: string, maxLength: 35 }
    AdminProductCode:
      name: productCode
      in: path
      required: true
      schema: { type: string, maxLength: 60, pattern: '^[A-Z][A-Z0-9_]*$' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous `nextCursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SigningKeyIdPath:
      name: keyId
      in: path
      required: true
      schema: { type: string, maxLength: 120 }
    LanguageCodePath:
      name: languageCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LanguageCode' }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MandateId:
      name: mandateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderCodePath:
      name: providerCode
      in: path
      required: true
      description: Stable payment provider code (e.g. CHAPA, ARIFPAY, TELEBIRR_DIRECT).
      schema: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]*$' }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GlossaryId:
      name: glossaryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    X-Correlation-Id:
      description: Correlation ID for support and tracing; also returned in Problem bodies.
      schema: { type: string, maxLength: 100 }
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema: { type: integer }
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed or invalid request (`VALIDATION_FAILED`, `INPUT_TOO_LONG`, `LANGUAGE_NOT_SUPPORTED`, `RESET_CODE_INVALID`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/validation-failed
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            correlationId: d8d14c6e-f6da-4c1b-8be8-6be9b5c4f1f5
            errors:
              - field: destinationLanguage
                code: REQUIRED
                message: destinationLanguage is required.
    Unauthorized:
      description: Missing/invalid/expired credentials (`UNAUTHENTICATED`, `GUEST_SESSION_INVALID`, `TOKEN_EXPIRED`, `REFRESH_TOKEN_REUSED`, `OTP_INVALID`, `INVALID_CREDENTIALS`, `API_KEY_INVALID`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed (`FEATURE_NOT_ENTITLED`, `CONSENT_REQUIRED`, `GUEST_NOT_ALLOWED`, `ATTESTATION_REQUIRED`, `BILLING_POLICY_DENIED`, `API_SCOPE_MISSING`, `ACCOUNT_SUSPENDED`, `EMAIL_NOT_VERIFIED`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is not visible to the caller (`NOT_FOUND`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SyncCursorExpired:
      description: |
        The sync token is older than the oldest retained deletion (`SYNC_CURSOR_EXPIRED`): deleted words were purged
        after 180 days and this client never saw them. Discard the token, pull without `since` for a full download and
        replace the locally synced words with it.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        State conflict (`IDEMPOTENCY_KEY_REUSED`, `REQUEST_IN_PROGRESS`, `REVISION_CONFLICT`, `ORDER_NOT_PAYABLE`, `STORE_PURCHASE_ALREADY_LINKED`, `EMAIL_ALREADY_REGISTERED`, ...).
        A `REVISION_CONFLICT` Problem carries the extension member `currentRevision` (integer):
        re-read the document, merge, and retry with that revision.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/revision-conflict
            title: Revision conflict
            status: 409
            code: REVISION_CONFLICT
            correlationId: 3f2a6f0e-7c1b-4d2e-9a53-5b8c0d1e2f34
            currentRevision: 7
    Unprocessable:
      description: Semantically invalid for current state (`PROFILE_NOT_ACTIVE`, `PRICE_NOT_AVAILABLE`, `PAYMENT_METHOD_UNAVAILABLE`, `MANDATE_NOT_SUPPORTED`, `STORE_PURCHASE_INVALID`, `OUTPUT_GUARDRAIL_FAILED`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PackRejected:
      description: |
        The uploaded or re-checked pack failed verification or the publishing policy (`PACK_REJECTED`; 413 when it
        is larger than the upload limit). The extension member `reason` (string) names the failed check.
        Verification (`docs/specs/pack-format-v1.md` section 6): MALFORMED, TOO_LARGE, UNSUPPORTED_FORMAT_VERSION,
        UNKNOWN_KEY, REVOKED_KEY, BAD_SIGNATURE, INVALID_MANIFEST, UNSUPPORTED_RESOURCE_TYPE, KEY_MISMATCH,
        SIZE_MISMATCH, CHECKSUM_MISMATCH. Publishing policy: DELTA_NOT_SUPPORTED, KEY_NOT_ACTIVE, UNKNOWN_LANGUAGE,
        LICENSE_MISSING, LICENSE_UNKNOWN, LICENSE_NOT_COMMERCIAL, DATASET_MISSING, DATASET_UNKNOWN,
        DATASET_NOT_COMMERCIAL, INVALID_ARTIFACT, PROFILE_UNKNOWN, PROFILE_MISMATCH, PROFILE_NOT_ACTIVE, DOWNGRADE.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/pack-rejected
            title: Language pack rejected
            status: 422
            code: PACK_REJECTED
            correlationId: 0b6f2d1e-5c4a-4f3e-9d8c-7b6a5f4e3d2c
            detail: The pack licence is not on the commercial-use allow-list
            reason: LICENSE_NOT_COMMERCIAL
    TooManyRequests:
      description: |
        `RATE_LIMITED` (short-term abuse/rate limit; honour `Retry-After`) or `QUOTA_EXCEEDED`
        (plan allowance and credits exhausted; body is a `QuotaExceededProblem` with reset time and
        upgrade/credit options), or `ACCOUNT_LOCKED` (too many wrong passwords; honour `Retry-After`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/QuotaExceededProblem'
              - $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/quota-exceeded
            title: Daily translation allowance used
            status: 429
            code: QUOTA_EXCEEDED
            correlationId: 6a1f0c2e-3b4d-4e5f-8a9b-0c1d2e3f4a5b
            featureCode: TRANSLATE
            resetAt: '2026-11-17T21:00:00Z'
            creditBalance: 0
            upgradeOptions:
              - type: PLAN
                productCode: PLAN_PREMIUM
              - type: CREDIT_PACK
                productCode: CREDITS_500
    ServiceUnavailable:
      description: Provider or capability temporarily unavailable (`PROVIDER_UNAVAILABLE`, `PROVIDER_TIMEOUT`, `LANGUAGE_PAIR_UNAVAILABLE`, `ZERO_RETENTION_UNAVAILABLE`, `EMAIL_NOT_CONFIGURED`). No usage is charged.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/language-pair-unavailable
            title: Translation is not currently available for this language pair.
            status: 503
            code: LANGUAGE_PAIR_UNAVAILABLE
            correlationId: d8d14c6e-f6da-4c1b-8be8-6be9b5c4f1f5
            sourceLanguage: om
            destinationLanguage: ti

    AppVersionUnsupported:
      description: 'The app version (`X-Client-Platform` + `X-App-Version`) is below the platform minimum (`APP_VERSION_UNSUPPORTED`). The Problem carries `minSupportedAppVersion`; the client must update.'
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/app-version-unsupported
            title: This version of the app is no longer supported.
            status: 426
            code: APP_VERSION_UNSUPPORTED
            correlationId: d8d14c6e-f6da-4c1b-8be8-6be9b5c4f1f5
            minSupportedAppVersion: 1.4.0

  schemas:
    # ------------------------------------------------------------ primitives
    LanguageCode:
      type: string
      description: BCP 47-compatible language tag (e.g. `am`, `ti`, `om`, `en`, `ar`, `ti-ER`).
      pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
      maxLength: 35
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: '^[A-Z]{2}$'
    CurrencyCode:
      type: string
      description: ISO 4217 currency code.
      pattern: '^[A-Z]{3}$'
    NextCursor:
      type: string
      description: Cursor for the next page; absent when there are no more results.
      maxLength: 512
    ClientPlatformEnum:
      type: string
      enum: [ANDROID, IOS, WEB]
    FeatureCode:
      type: string
      description: Canonical feature codes (`feature_catalog`). Typing features are never entitlement-gated.
      enum:
        - OFFLINE_TYPING
        - DIRECT_SCRIPT_LAYOUT
        - PHONETIC_TRANSLITERATION
        - OFFLINE_SUGGESTIONS
        - DETECT_LANGUAGE
        - TRANSLATE
        - GRAMMAR_CORRECTION
        - REWRITE
        - TONE_ADJUST
        - SMART_REPLY
        - SUMMARIZE
        - EXPLAIN_TEXT
        - DRAFT_DOCUMENT
        - SCRIPT_CONVERSION
        - SPEECH_TO_TEXT
        - SPEECH_TRANSLATE
        - TEXT_TO_SPEECH
        - VOICE_TO_VOICE
        - LIVE_CONVERSATION
        - HISTORY_SYNC
        - DICTIONARY_SYNC
        - PERSONAL_STYLE
        - CUSTOM_GLOSSARY
        - ON_DEVICE_AI_MODELS
        - PREMIUM_THEMES
        - FORMAT_TEXT
        - AI_CHAT
        - SOCIAL_POST
        - FORM_ASSIST
        - OCR_SCAN
        - SKETCH_ENHANCE
        - DOODLE_TO_IMAGE
        - HANDWRITING_RECOGNITION
        - AI_STICKER_GEN
        - AI_IMAGE_GEN
        - DRAW_SKETCH
        - STICKER_MAKER
        - GIF_MAKER
        - CARD_MAKER
        - IMAGE_ANNOTATOR
        - QR_GENERATE
    MeteringUnit:
      type: string
      description: REQUEST; SECOND (audio, rounded up per request to a whole second); CHARACTER (TTS); NONE (boolean access).
      enum: [REQUEST, SECOND, CHARACTER, NONE]
    ResetPeriod:
      type: string
      enum: [NONE, DAILY, WEEKLY, MONTHLY, YEARLY]
    QualityTier:
      type: string
      enum: [UNVERIFIED, EXPERIMENTAL, BETA, PRODUCTION]
    ExecutionMode:
      type: string
      enum: [SERVER, ON_DEVICE, HYBRID]
    Money:
      type: object
      description: Integer minor units with explicit exponent (ETB 2, UGX 0). `29900`/ETB/2 = 299.00 ETB.
      required: [amountMinor, currency, exponent]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 0 }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exponent: { type: integer, minimum: 0, maximum: 4 }
    Addressee:
      type: object
      description: |
        Who the text is addressed to. Amharic/Tigrinya verbs and pronouns inflect for gender and
        formality; `HONORIFIC` selects respectful forms (e.g. እርስዎ). `UNKNOWN` gender may yield
        alternatives.
      properties:
        formality:
          type: string
          enum: [INFORMAL, FORMAL, HONORIFIC]
          default: INFORMAL
        gender:
          type: string
          enum: [MASCULINE, FEMININE, PLURAL, UNKNOWN]
          default: UNKNOWN
    CulturalOptions:
      type: object
      properties:
        calendar:
          type: string
          enum: [GREGORIAN, ETHIOPIAN]
          description: Convert dates to this calendar in the output.
        timeNotation:
          type: string
          enum: [INTERNATIONAL, ETHIOPIAN]
          description: ETHIOPIAN counts clock hours from 06:00 (06:00 = 12 ሰዓት / 0).
        numerals:
          type: string
          enum: [WESTERN, ETHIOPIC]
        adaptIdioms:
          type: boolean
          default: true
          description: Replace idioms with natural equivalents and explain them in `notes`.
    AiNote:
      type: object
      description: |
        A short static message from the server, never text derived from the user's content.
        Calendar, clock and numeral conversions are reported as `CULTURAL`; the server does not
        emit a separate conversion type.
      required: [type, message]
      properties:
        type:
          type: string
          enum: [CULTURAL, AMBIGUITY, GLOSSARY_APPLIED, NAME_PRESERVED, QUALITY, SAFETY]
        message: { type: string, maxLength: 500 }
        span:
          type: object
          properties:
            start: { type: integer, minimum: 0 }
            end: { type: integer, minimum: 0 }
    UsageSummary:
      type: object
      required: [featureCode, unitsCharged, unit, usageSource]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        unitsCharged: { type: integer, minimum: 0 }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
        usageSource:
          type: string
          enum: [PLAN_ALLOWANCE, AI_CREDITS, ORGANIZATION, PARTNER_CONTRACT, UNMETERED]
        remaining:
          type: integer
          description: Remaining plan allowance in this period (absent if unlimited/not applicable).
        creditBalance: { type: number, minimum: 0, description: Remaining credits after this charge and rounded down to a whole credit for display (SD 15.4). }
        creditsCharged:
          type: number
          minimum: 0
          description: |
            Credits charged for this request (up to 6 decimal places). Present when credits paid
            all or part of the request. For a mixed charge `usageSource` is `AI_CREDITS`,
            `allowanceUnitsCharged` is the part the plan allowance covered and `creditsCharged`
            the part credits covered.
        allowanceUnitsCharged:
          type: integer
          minimum: 0
          description: Units covered by the plan allowance when a request was paid partly by allowance and partly by credits (`unitsCharged` is the total).
        resetsAt: { type: string, format: date-time }

    # ------------------------------------------------------------ errors
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details with extension members. Known extension members: `consentCode`
        on 403 `CONSENT_REQUIRED` (the consent to request), `currentRevision` on 409
        `REVISION_CONFLICT` (the revision the client should re-read), `featureCode`, `resetAt`,
        `creditBalance` and `upgradeOptions` on 429 `QUOTA_EXCEEDED`, `attemptsRemaining` (integer)
        on 401 `OTP_INVALID` for a wrong code of a known challenge, `reason` on 413/422 `PACK_REJECTED`
        (admin pack publishing), `challengeId`, `expiresAt`, `resendAvailableAt` and `codeLength` on 403
        `EMAIL_NOT_VERIFIED` (the verification challenge whose code was e-mailed).
        `GUEST_SESSION_INVALID` (401, `WWW-Authenticate: Bearer error="invalid_token"`) means the
        guest bearer token's account was merged, upgraded, ended or suspended: discard the guest
        session (do not refresh it) and sign in or create a new guest session.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri, description: 'Problem type URI, or `about:blank`.' }
        title: { type: string, description: "Short, safe, localised summary." }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: |
            Stable machine-readable code. Clients switch on `code`, never on `title`.
            VALIDATION_FAILED, INPUT_TOO_LONG, UNAUTHENTICATED, GUEST_SESSION_INVALID, TOKEN_EXPIRED, REFRESH_TOKEN_REUSED,
            OTP_INVALID, OTP_EXPIRED, OTP_TOO_MANY_ATTEMPTS, PHONE_REGION_NOT_SUPPORTED, PHONE_CARRIER_NOT_SUPPORTED, EMAIL_ALREADY_REGISTERED,
            INVALID_CREDENTIALS, ACCOUNT_LOCKED, EMAIL_NOT_VERIFIED, EMAIL_NOT_CONFIGURED, RESET_CODE_INVALID,
            ATTESTATION_REQUIRED, ATTESTATION_FAILED, ACCOUNT_SUSPENDED, DELETION_PENDING,
            GUEST_NOT_ALLOWED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
            UNSUPPORTED_MEDIA_TYPE, REVISION_CONFLICT, IDEMPOTENCY_KEY_REUSED,
            REQUEST_IN_PROGRESS, ON_DEVICE_ONLY_PREFERRED, CONSENT_REQUIRED, FEATURE_NOT_ENTITLED, QUOTA_EXCEEDED,
            RATE_LIMITED, LANGUAGE_NOT_SUPPORTED, LANGUAGE_PAIR_UNAVAILABLE, PROFILE_NOT_ACTIVE,
            OUTPUT_GUARDRAIL_FAILED, CONTENT_REJECTED, PROVIDER_UNAVAILABLE, PROVIDER_TIMEOUT,
            ZERO_RETENTION_UNAVAILABLE, UPLOAD_EXPIRED, AUDIO_TOO_LONG, UNSUPPORTED_AUDIO_FORMAT,
            REALTIME_SESSION_LIMIT, BILLING_POLICY_DENIED, PRODUCT_NOT_AVAILABLE,
            PRICE_NOT_AVAILABLE, PROMOTION_INVALID, PAYMENT_METHOD_UNAVAILABLE, ORDER_NOT_PAYABLE,
            ORDER_EXPIRED, PAYMENT_VERIFICATION_FAILED, MANDATE_NOT_SUPPORTED,
            STORE_PURCHASE_INVALID, STORE_PURCHASE_ALREADY_LINKED, SUBSCRIPTION_NOT_RENEWABLE,
            SEAT_UNAVAILABLE, API_KEY_INVALID, API_SCOPE_MISSING, WEBHOOK_SIGNATURE_INVALID,
            APP_VERSION_UNSUPPORTED, PACK_REJECTED, PUBLICATION_CONFLICT, SYNC_CURSOR_EXPIRED, APPROVAL_REQUIRED, INTERNAL_ERROR.
          pattern: '^[A-Z][A-Z0-9_]*$'
        correlationId: { type: string, maxLength: 100 }
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            required: [code, message]
            properties:
              field: { type: string, description: JSON Pointer or dotted path of the offending field. }
              code: { type: string }
              message: { type: string }
      additionalProperties: true
    QuotaExceededProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [featureCode]
          properties:
            featureCode: { $ref: '#/components/schemas/FeatureCode' }
            resetAt: { type: string, format: date-time }
            creditBalance: { type: number, minimum: 0, description: Remaining credits and rounded down to a whole credit for display (SD 15.4). }
            upgradeOptions:
              type: array
              items:
                type: object
                required: [type, productCode]
                properties:
                  type:
                    type: string
                    enum: [PLAN, CREDIT_PACK]
                  productCode: { type: string }

    # ------------------------------------------------------------ auth
    AttestationNonce:
      type: object
      required: [nonce, expiresAt]
      properties:
        nonce: { type: string, minLength: 16, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
    AttestationEvidence:
      type: object
      required: [provider, token, nonce]
      properties:
        provider:
          type: string
          enum: [PLAY_INTEGRITY, APP_ATTEST]
        token:
          type: string
          maxLength: 16384
          writeOnly: true
          description: Play Integrity token, or App Attest attestation/assertion object (base64).
        keyId:
          type: string
          maxLength: 256
          description: App Attest key identifier (iOS only).
        nonce: { type: string, maxLength: 128 }
    AttestationResult:
      type: object
      required: [attestationStatus, checkedAt]
      properties:
        attestationStatus:
          type: string
          enum: [VALID, FAILED, UNSUPPORTED]
        checkedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    DeviceRegistration:
      type: object
      required: [installationId, platform]
      properties:
        installationId: { type: string, format: uuid, description: Random per-install ID; not a hardware identifier. }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        pushProvider:
          type: string
          enum: [FCM, APNS]
        pushToken: { type: string, maxLength: 4096, writeOnly: true }
    OtpStartRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          description: E.164 phone number.
          pattern: '^\+[1-9][0-9]{6,14}$'
        channel:
          type: string
          enum: [SMS, VOICE_CALL]
          default: SMS
        installationId:
          type: string
          format: uuid
          description: 'Optional. Random per-install ID, the same value as `device.installationId` on verify (not a hardware identifier). When present, the per-device rate limit applies.'
        attestation: { $ref: '#/components/schemas/AttestationEvidence' }
    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, codeLength]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }
        codeLength: { type: integer, minimum: 4, maximum: 8 }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{4,8}$', writeOnly: true }
        ageConfirmed: { type: boolean, description: Required for new accounts (minimum digital age of consent). }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    OAuthExchangeRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken: { type: string, maxLength: 8192, writeOnly: true }
        nonce: { type: string, maxLength: 256 }
        authorizationCode: { type: string, maxLength: 2048, writeOnly: true, description: "Apple only, for token revocation on account deletion." }
        displayName: { type: string, maxLength: 120 }
        ageConfirmed: { type: boolean }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailRegisterRequest:
      type: object
      required: [email, password, ageConfirmed]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        displayName: { type: string, maxLength: 120 }
        ageConfirmed: { type: boolean, const: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 128, writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailVerificationChallenge:
      type: object
      required: [challengeId, expiresAt, codeLength]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }
        codeLength: { type: integer, minimum: 4, maximum: 8 }
    EmailVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{4,8}$', writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailResendRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId: { type: string, format: uuid }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    PasswordResetRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 320, description: The address the code was sent to. }
        token: { type: string, maxLength: 256, writeOnly: true, description: The 6-digit code from the reset e-mail. }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 512, writeOnly: true }
    LogoutRequest:
      type: object
      properties:
        allDevices: { type: boolean, default: false }
    GuestSessionRequest:
      type: object
      required: [installationId, platform, attestation]
      properties:
        installationId: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        attestation: { $ref: '#/components/schemas/AttestationEvidence' }
    AuthSession:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, tokenType, user]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken: { type: string, readOnly: true }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, readOnly: true, description: Store in Keystore/Keychain only; shared with the iOS extension via keychain access group (Full Access). }
        refreshTokenExpiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        isNewUser: { type: boolean, description: True when this sign-in created the registered account (including by upgrading a guest in place). }
        mergedGuestUserId: { type: string, format: uuid, description: "Present when a guest was linked by this sign-in. Equals `user.id` for an upgrade in place (new identity); the guest's own id when its data was merged into an existing account. Absent when no guest was linked." }
        user: { $ref: '#/components/schemas/UserProfile' }

    # ------------------------------------------------------------ devices / me
    Device:
      type: object
      required: [id, installationId, platform, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        installationId: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        attestationStatus:
          type: string
          enum: [NOT_CHECKED, VALID, FAILED, UNSUPPORTED]
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time, readOnly: true }
    DeviceUpdate:
      type: object
      properties:
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        pushProvider:
          type: string
          enum: [FCM, APNS]
        pushToken: { type: string, maxLength: 4096, writeOnly: true }
    ResourceInstallationReport:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [resourceId, installedVersion, status]
            properties:
              resourceId: { type: string, format: uuid }
              installedVersion: { type: string, maxLength: 40 }
              status:
                type: string
                enum: [PENDING, INSTALLED, FAILED, REMOVED, ROLLED_BACK]
              checksumVerified: { type: boolean }
              signatureVerified: { type: boolean }
              errorCode: { type: string, maxLength: 80 }
    UserProfile:
      type: object
      required: [id, accountType, accountStatus]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        accountType:
          type: string
          enum: [REGISTERED, GUEST]
        accountStatus:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, DELETION_PENDING]
        displayName: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        phoneNumberMasked: { type: string, description: 'e.g. +251 9•• ••• 567', readOnly: true }
        phoneVerified: { type: boolean }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        marketSource:
          type: string
          description: 'How the market was determined (the values of users.market_source).'
          enum: [USER_SELECTED, STOREFRONT, SIM_COUNTRY, BILLING, ADMIN]
        uiLocale: { type: string, maxLength: 35 }
        timeZone: { type: string, maxLength: 64, description: "IANA zone, e.g. Africa/Addis_Ababa." }
        createdAt: { type: string, format: date-time, readOnly: true }
    UserProfileUpdate:
      type: object
      properties:
        displayName: { type: string, maxLength: 120 }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        uiLocale: { type: string, maxLength: 35 }
        timeZone: { type: string, maxLength: 64 }
    DeletionRequestCreate:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }
        reason: { type: string, maxLength: 255 }
    DeletionRequest:
      type: object
      required: [id, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, SCHEDULED, CANCELLED, PROCESSING, COMPLETED, FAILED]
        requestedAt: { type: string, format: date-time }
        scheduledPurgeAt: { type: string, format: date-time }
        activeStoreSubscriptions:
          type: array
          description: Store subscriptions the user must cancel in the store to stop being charged.
          items: { $ref: '#/components/schemas/Subscription' }
    DataExportCreate:
      type: object
      properties:
        format:
          type: string
          enum: [JSON]
          default: JSON
    DataExport:
      type: object
      required: [id, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, PROCESSING, READY, EXPIRED, FAILED]
        requestedAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        downloadUrl:
          type: string
          format: uri
          description: "Present while `READY`: the archive endpoint of this API (`/me/data-exports/{id}/archive`). It is not a bucket URL and needs the owner's access token."
        downloadExpiresAt: { type: string, format: date-time, description: "End of the 7-day link; the archive is deleted then." }
    DataExportArchive:
      type: object
      description: "The export document: a manifest listing every section with its row count and everything left out, and the data."
      required: [manifest, data]
      properties:
        manifest:
          type: object
          required: [format, formatVersion, exportId, userId, generatedAt, linkExpiresAt, sections, excluded]
          properties:
            format: { type: string, enum: [qal-data-export] }
            formatVersion: { type: integer, minimum: 1 }
            exportId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            generatedAt: { type: string, format: date-time }
            linkExpiresAt: { type: string, format: date-time }
            sections:
              type: array
              items:
                type: object
                required: [code, dataClass, description, rows]
                properties:
                  code: { type: string, description: "Key of the section in `data`." }
                  dataClass: { type: string }
                  description: { type: string }
                  rows: { type: integer, minimum: 0 }
            excluded:
              type: array
              items:
                type: object
                required: [code, reason]
                properties:
                  code: { type: string }
                  reason: { type: string }
            notes:
              type: array
              items: { type: string }
        data:
          type: object
          description: "One array of rows per manifest section."
          additionalProperties:
            type: array
            items: { type: object, additionalProperties: true }
    ConsentCode:
      type: string
      enum:
        - TERMS_ACCEPTANCE
        - PRIVACY_NOTICE
        - AI_PROCESSING
        - SAVE_AI_HISTORY
        - SAVE_AUDIO_HISTORY
        - DICTIONARY_SYNC
        - FEEDBACK_TEXT
        - COMMUNITY_CONTRIBUTION
        - PERSONAL_STYLE
        - PAYMENT_MANDATE
        - ANALYTICS
        - MARKETING
    Consent:
      type: object
      required: [id, consentCode, consentVersion, isGranted, recordedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true, description: Consent record ID (used as `consentRecordId` for mandates). }
        consentCode: { $ref: '#/components/schemas/ConsentCode' }
        consentVersion: { type: string, maxLength: 40 }
        isGranted: { type: boolean }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
    ConsentUpdate:
      type: object
      required: [consentVersion, isGranted]
      properties:
        consentVersion: { type: string, maxLength: 40, description: Version of the text shown to the user. }
        isGranted: { type: boolean }
        details:
          type: object
          description: |
            Consent-specific context, e.g. mandate amount/frequency shown to the user. The
            conventional member `surface` names where the decision was made (`onboarding`,
            `settings`, ...). Stored with the record; at most 2000 characters serialised.
          additionalProperties: true

    # ------------------------------------------------------------ config
    ClientConfig:
      type: object
      required: [configVersion, minSupportedAppVersion, flags, values, serverTime]
      properties:
        configVersion: { type: integer }
        minSupportedAppVersion: { type: string }
        recommendedAppVersion: { type: string }
        flags:
          type: object
          description: Evaluated feature flags for this user/device/app version.
          additionalProperties: { type: boolean }
        values:
          type: object
          description: Active `app_configurations` values for this platform scope.
          additionalProperties: true
        serverTime: { type: string, format: date-time }
    FxRates:
      type: object
      required: [base, asOf, rates, source, stale]
      properties:
        base: { type: string, enum: [USD], description: Currency every rate is quoted against. }
        asOf: { type: string, format: date-time, description: When the rates were taken. }
        rates:
          type: object
          description: ISO 4217 code to the value of one unit of `base` in that currency.
          additionalProperties: { type: number, format: double, exclusiveMinimum: 0 }
        source: { type: string, maxLength: 100, description: Provider label; `seed` is the built-in development table. }
        stale: { type: boolean, description: '`asOf` is older than the server''s staleness threshold.' }
    AiCapabilities:
      type: object
      required: [items, generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [featureCode, qualityTier, execution]
            properties:
              featureCode: { $ref: '#/components/schemas/FeatureCode' }
              sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
              destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
              qualityTier: { $ref: '#/components/schemas/QualityTier' }
              execution: { $ref: '#/components/schemas/ExecutionMode' }
              supportsAutoDetection: { type: boolean }
              supportsStreaming: { type: boolean }
              maxInputCharacters: { type: integer, minimum: 1 }
        translationLanguages:
          type: array
          description: |
            ADR 0040: the languages server translation offers now, from the active providers' enabled
            capabilities (pair rows and per-model language sets), in catalogue order. Absent or empty:
            keep the client's bundled list.
          items: { $ref: '#/components/schemas/TranslationLanguage' }
    TranslationLanguage:
      type: object
      required: [code, englishName, writingDirection, asSource, asDestination]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        englishName: { type: string }
        nativeName: { type: string, description: The language's name in itself (autonym). }
        scriptCode: { type: string, description: "ISO 15924 (Latn, Ethi, Arab, Hans, Deva, ...)." }
        writingDirection:
          type: string
          enum: [LTR, RTL]
        asSource: { type: boolean, description: Text in this language can be translated. }
        asDestination: { type: boolean, description: Text can be translated into this language. }
        supportsAutoDetection:
          type: boolean
          description: The language can be detected when the request omits `sourceLanguage`.
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        isTypingLanguage:
          type: boolean
          description: Also a keyboard (typing) language listed by `listLanguages`.

    # ------------------------------------------------------------ languages
    InputMode:
      type: string
      enum: [DIRECT_SCRIPT_LAYOUT, PHONETIC_LATIN_TO_NATIVE, LATIN_PASSTHROUGH]
    Language:
      type: object
      required: [code, englishName, writingDirection, supportLevel]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        englishName: { type: string }
        nativeName: { type: string }
        scriptCode: { type: string, description: "ISO 15924 (Ethi, Latn, Arab)." }
        writingDirection:
          type: string
          enum: [LTR, RTL]
        supportLevel:
          type: string
          enum: [PLANNED, ALPHA, BETA, GA]
        isLaunchLanguage: { type: boolean }
        inputModes:
          type: array
          description: |
            Input modes the language offers. Read from `supported_languages.metadata.inputModes`
            (an array of `InputMode` values; unknown values are dropped). Absent when the
            catalogue row has none: treat absence as "no declared modes", not as "none supported".
          items: { $ref: '#/components/schemas/InputMode' }
    TransliterationProfile:
      type: object
      required: [code, version, languageCode, sourceScript, targetScript, status]
      properties:
        code: { type: string, maxLength: 100 }
        version: { type: string, maxLength: 40 }
        displayName: { type: string }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        sourceScript: { type: string }
        targetScript: { type: string }
        inputScheme:
          type: string
          enum: [PHONETIC, KEYMAP, ROMANIZATION]
        reversible: { type: boolean, description: Supports native → Latin (pronunciation/romanised display). }
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        rulesResourceId: { type: string, format: uuid }
    ReleaseChannel:
      type: string
      enum: [INTERNAL, BETA, STABLE]
    ResourceType:
      type: string
      enum:
        - KEYBOARD_LAYOUT
        - TRANSLITERATION_RULES
        - DICTIONARY
        - FREQUENCY_LIST
        - PREDICTION_MODEL
        - AUTOCORRECTION_MODEL
        - PROTECTED_TERMS
        - EMOJI_KEYWORDS
        - GLOSSARY
        - PRONUNCIATION
        - SPELL_MODEL
        - LANGUAGE_ID_MODEL
        - TRANSLATION_MODEL
        - ASR_MODEL
        - TTS_VOICE
        - ON_DEVICE_LLM
        - OTHER
    LanguageResourceManifest:
      type: object
      description: >-
        Discovery metadata for one pack, used to decide what to download. It is NOT trusted:
        the downloaded artifact is a self-authenticating container (docs/specs/pack-format-v1.md)
        whose embedded manifest is Ed25519-signed and verified on the device before activation.
      required: [id, languageCode, resourceType, version, platform, channel, artifactUrl, sha256, sizeBytes, signatureKeyId]
      properties:
        id: { type: string, format: uuid }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        version: { type: string, description: Semantic version. }
        platform:
          type: string
          enum: [SHARED, ANDROID, IOS]
        channel: { $ref: '#/components/schemas/ReleaseChannel' }
        artifactUrl: { type: string, format: uri, description: HTTPS CDN URL. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 of the artifact inside the container; equals the signed manifest value." }
        sizeBytes: { type: integer, format: int64, minimum: 0, description: "Artifact size inside the container; equals the signed manifest value." }
        containerSizeBytes: { type: integer, format: int64, minimum: 0, description: "Size of the whole container file, for download planning." }
        baseResourceId: { type: string, format: uuid, description: Present for delta artifacts; apply only on top of this installed resource. }
        signatureKeyId: { type: string }
        minAppVersion: { type: string }
        licenseCode: { type: string, description: SPDX or internal licence code; non-commercial licences are never published. }
        deviceRequirements:
          type: object
          description: |
            The names below are canonical. For rows written with the older column-comment names
            the server also accepts `wifiOnly` (as `wifiOnlyDefault`) and `iosExtensionAllowed`
            (as `iosExtensionCompatible`) and always answers with the canonical names. Members of
            the wrong type are omitted.
          properties:
            minRamMb: { type: integer, minimum: 0 }
            minFreeStorageMb: { type: integer, minimum: 0 }
            accelerator:
              type: string
              enum: [NONE, NNAPI, GPU, NPU, CORE_ML]
            minOsVersion: { type: string }
            wifiOnlyDefault: { type: boolean }
            iosExtensionCompatible: { type: boolean, description: False for resources too large for the keyboard extension memory ceiling. }
        transliteration:
          type: object
          description: Present for TRANSLITERATION_RULES.
          properties:
            profileCode: { type: string }
            profileVersion: { type: string }
            normalizationForm:
              type: string
              enum: [NFC, NFD]
            rankingVersion: { type: string }
        releaseNotes: { type: string }
        publishedAt: { type: string, format: date-time }
    SigningKey:
      type: object
      required: [keyId, algorithm, publicKey, status]
      properties:
        keyId: { type: string }
        algorithm:
          type: string
          const: Ed25519
        publicKey: { type: string, description: Base64 raw public key. }
        status:
          type: string
          enum: [ACTIVE, RETIRING, REVOKED]
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        endorsedByKeyId: { type: string }
        endorsementSignature: { type: string }

    # ------------------------------------------------------------ admin (interim, B3.2)
    AdminLanguageResource:
      type: object
      description: |
        A language resource as the publisher sees it. `state`: `DRAFT` (uploaded and validated, invisible),
        `STAGED` (published on the `INTERNAL` channel only), `PUBLISHED` (`BETA` or `STABLE`), `RETIRED`, `REVOKED`.
      required: [id, languageCode, resourceType, version, platform, state, channel, rolloutPercentage, sha256,
        artifactUri, datasetCodes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        version: { type: string, maxLength: 40 }
        platform:
          type: string
          enum: [SHARED, ANDROID, IOS]
        state:
          type: string
          enum: [DRAFT, STAGED, PUBLISHED, RETIRED, REVOKED]
        channel: { $ref: '#/components/schemas/ReleaseChannel' }
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
        minAppVersion: { type: string, maxLength: 40 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the artifact inside the container. }
        sizeBytes: { type: integer, format: int64, minimum: 0, description: Artifact size. }
        containerSizeBytes: { type: integer, format: int64, minimum: 0, description: Size of the stored container file. }
        licenseCode: { type: string, maxLength: 60 }
        signatureKeyId: { type: string, description: 'Key that signed the stored container (the uploader''s key while DRAFT, the server key once staged).' }
        artifactUri: { type: string, description: 'Storage location of the current container (`s3://bucket/key`).' }
        datasetCodes:
          type: array
          items: { type: string }
        releaseNotes: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublishLanguageResourceRequest:
      type: object
      required: [channel, rolloutPercentage]
      properties:
        channel:
          type: string
          enum: [BETA, STABLE]
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
        minAppVersion: { type: string, maxLength: 40, description: Semantic version; omitted keeps the current one. }
        releaseNotes: { type: string, maxLength: 2000 }
    LanguageDatasetRecord:
      type: object
      description: One source dataset; the shape of a `datasets.manifest.json` entry (other members are ignored).
      required: [datasetCode, licenseCode]
      properties:
        datasetCode: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }
        name: { type: string, maxLength: 200 }
        languageCode: { type: string, description: 'Catalogue language, or `mul` / absent for multilingual.' }
        sourceUrl: { type: string }
        licenseCode: { type: string, maxLength: 60 }
        licenseUrl: { type: string }
    RegisterLanguageDatasetsRequest:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/LanguageDatasetRecord' }
    LanguageDataset:
      type: object
      required: [datasetCode, licenseCode, reviewStatus, permittedUses, created]
      properties:
        datasetCode: { type: string }
        licenseCode: { type: string }
        reviewStatus:
          type: string
          enum: [PENDING_REVIEW, APPROVED, RESTRICTED, REJECTED]
        permittedUses:
          type: array
          items:
            type: string
            enum: [TRAINING, EVALUATION, DICTIONARY, COMMERCIAL, RESEARCH_ONLY]
        created: { type: boolean, description: False when the code was already registered. }
    LanguageDatasetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LanguageDataset' }
    PackSigner:
      type: object
      required: [keyId, algorithm, publicKey, registered]
      properties:
        keyId: { type: string }
        algorithm:
          type: string
          const: Ed25519
        publicKey: { type: string, description: Base64 raw public key. }
        registered: { type: boolean, description: True when `resource_signing_keys` holds this key id with the same public key. }
        status:
          type: string
          enum: [ACTIVE, RETIRING, REVOKED]
    RegisterSigningKeyRequest:
      type: object
      required: [keyId, publicKey]
      properties:
        keyId: { type: string, pattern: '^[A-Za-z0-9._-]{1,120}$' }
        publicKey: { type: string, description: Base64 of the raw 32-byte Ed25519 public key. }
        endorse: { type: boolean, default: true, description: 'Endorse with the server key (ignored for the server''s own key).' }
    AdminSigningKey:
      type: object
      required: [keyId, algorithm, publicKey, status]
      properties:
        keyId: { type: string }
        algorithm:
          type: string
          const: Ed25519
        publicKey: { type: string, description: Base64 raw public key. }
        status:
          type: string
          enum: [ACTIVE, RETIRING, REVOKED]
        validFrom: { type: string, format: date-time }
        endorsedByKeyId: { type: string }
        endorsementSignature: { type: string, description: 'Base64 Ed25519 signature over the endorsement message of `docs/specs/pack-format-v1.md` 7.4.' }

    # ------------------------------------------------------------ preferences
    Formality:
      type: string
      enum: [INFORMAL, FORMAL, HONORIFIC]
    AddresseeGender:
      type: string
      enum: [MASCULINE, FEMININE, PLURAL, UNKNOWN]
    TranslationStyle:
      type: string
      enum: [LITERAL, NATURAL, POLITE, PROFESSIONAL, FRIENDLY]
    Tone:
      type: string
      description: |
        The database default `NATURAL` (no tone chosen) is deliberately not a value: a profile
        without a tone omits `defaultTone` in responses, and requests must omit it too.
      enum: [FRIENDLY, POLITE, PROFESSIONAL, CONCISE, APOLOGETIC, HONORIFIC, ROMANTIC, CONFIDENT,
        FUNNY, PERSUASIVE]
    EmailTone:
      type: string
      description: |
        Tone of an AI-written e-mail (`DraftRequest.tone`, ADR 0027). FORMAL suits authorities and
        senior people, CASUAL people the user knows well, PERSUASIVE makes a case with one call to
        action.
      enum: [PROFESSIONAL, FORMAL, FRIENDLY, CASUAL, POLITE, PERSUASIVE, APOLOGETIC, CONCISE]
      default: PROFESSIONAL
    Preferences:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0, description: Optimistic-concurrency revision; echo the last value read. }
        defaultSourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        sourceDetectionMode:
          type: string
          enum: [AUTO, MANUAL]
          default: AUTO
        defaultDestinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        translationMode:
          type: string
          enum: [DISABLED, MANUAL, PROMPT]
          default: MANUAL
        defaultTranslationStyle: { $ref: '#/components/schemas/TranslationStyle' }
        preserveNamesInTranslation: { type: boolean, default: true }
        voiceInputLanguageMode:
          type: string
          enum: [AUTO, MANUAL]
        preferredVoiceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        calendarSystem:
          type: string
          enum: [GREGORIAN, ETHIOPIAN]
          default: GREGORIAN
        timeNotation:
          type: string
          enum: [INTERNATIONAL, ETHIOPIAN]
          default: INTERNATIONAL
        numeralStyle:
          type: string
          enum: [WESTERN, ETHIOPIC]
          default: WESTERN
        defaultFormality: { $ref: '#/components/schemas/Formality' }
        defaultAddresseeGender: { $ref: '#/components/schemas/AddresseeGender' }
        aiProcessingPreference:
          type: string
          enum: [SERVER, PREFER_ON_DEVICE, ON_DEVICE_ONLY]
          default: SERVER
          description: ON_DEVICE_ONLY disables server AI; features without an installed on-device model become unavailable.
        historyEnabled: { type: boolean, default: false, description: Requires SAVE_AI_HISTORY consent. }
        historyRetentionDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
        keyboardTheme: { type: string, maxLength: 40 }
        hapticsEnabled: { type: boolean }
        soundEnabled: { type: boolean }
        analyticsOptIn: { type: boolean, default: false }
        updatedAt: { type: string, format: date-time, readOnly: true }
    TypingLanguage:
      type: object
      required: [languageCode, enabled, inputMode]
      properties:
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean }
        isPrimary: { type: boolean, default: false }
        sortOrder: { type: integer, default: 100 }
        inputMode: { $ref: '#/components/schemas/InputMode' }
        transliterationProfileCode:
          type: string
          maxLength: 100
          description: Required iff `inputMode = PHONETIC_LATIN_TO_NATIVE`; must be an ACTIVE profile of this language.
        conversionTrigger:
          type: string
          enum: [LIVE_COMPOSING, WORD_BOUNDARY, MANUAL]
          default: LIVE_COMPOSING
        showTransliterationCandidates: { type: boolean, default: true }
        unknownTokenBehavior:
          type: string
          enum: [PRESERVE_LATIN, SUGGEST_ONLY]
          default: PRESERVE_LATIN
    TypingLanguagesDocument:
      type: object
      required: [languages, revision]
      properties:
        revision: { type: integer, minimum: 0 }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TypingLanguage' }
    DestinationProfileInput:
      type: object
      required: [label, destinationLanguage]
      properties:
        label: { type: string, minLength: 1, maxLength: 80, description: Encrypted at rest with the user data key. }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        formality: { $ref: '#/components/schemas/Formality' }
        addresseeGender: { $ref: '#/components/schemas/AddresseeGender' }
        defaultTone: { $ref: '#/components/schemas/Tone' }
        defaultStyle: { $ref: '#/components/schemas/TranslationStyle' }
        glossaryId: { type: string, format: uuid }
        sortOrder: { type: integer }
    DestinationProfile:
      type: object
      required: [id, label, destinationLanguage, sortOrder, createdAt, updatedAt]
      description: A `DestinationProfileInput` plus server-assigned members (flat, so every member is validated together).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        label: { type: string, minLength: 1, maxLength: 80, description: Encrypted at rest with the user data key. }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        formality: { $ref: '#/components/schemas/Formality' }
        addresseeGender: { $ref: '#/components/schemas/AddresseeGender' }
        defaultTone: { $ref: '#/components/schemas/Tone' }
        defaultStyle: { $ref: '#/components/schemas/TranslationStyle' }
        glossaryId: { type: string, format: uuid }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    AppDestinationRule:
      type: object
      required: [appPackageHmac]
      description: Exactly one of `destinationProfileId` or `destinationLanguage` must be set.
      properties:
        appPackageHmac: { type: string, pattern: '^[0-9a-f]{64}$', description: "HMAC-SHA256(per-user rule key, packageName), hex." }
        destinationProfileId: { type: string, format: uuid }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean, default: true }
    AppDestinationRulesDocument:
      type: object
      required: [rules, revision]
      properties:
        revision: { type: integer, minimum: 0 }
        rules:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppDestinationRule' }
    AppDestinationRuleKey:
      type: object
      required: [keyId, key]
      properties:
        keyId: { type: string, maxLength: 64, description: Opaque identifier of this key (a truncated digest and safe to log). }
        key: { type: string, format: byte, description: Standard base64 of the 32 key bytes. Secret and never logged. }
    StyleProfile:
      type: object
      required: [languageCode, enabled]
      properties:
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean }
        formality: { $ref: '#/components/schemas/Formality' }
        lengthPreference:
          type: string
          enum: [SHORT, BALANCED, DETAILED]
        emojiUse:
          type: string
          enum: [NONE, LIGHT, FREQUENT]
        greeting: { type: string, maxLength: 120, description: Encrypted at rest. }
        signOff: { type: string, maxLength: 200, description: Encrypted at rest. }
        preferredPhrases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        avoidPhrases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        learnedHints:
          type: object
          description: Structured parameters computed on-device from accepted AI results. Never raw text.
          properties:
            averageSentenceLength: { type: number, minimum: 0, maximum: 200 }
            formalityScore: { type: number, minimum: 0, maximum: 1 }
            emojiRate: { type: number, minimum: 0, maximum: 1 }
            codeSwitchRate: { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
        updatedAt: { type: string, format: date-time, readOnly: true }
    DictionaryChange:
      type: object
      required: [op, languageCode, word, clientChangeId]
      properties:
        op:
          type: string
          enum: [ADD, DELETE]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        word: { type: string, minLength: 1, maxLength: 64 }
        clientChangeId: { type: string, format: uuid }
        changedAt: { type: string, format: date-time }
    DictionaryChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DictionaryChange' }
    DictionaryChangesResult:
      type: object
      required: [applied, syncToken]
      properties:
        applied: { type: integer, minimum: 0 }
        rejected:
          type: array
          items:
            type: object
            required: [clientChangeId, code]
            properties:
              clientChangeId: { type: string, format: uuid }
              code: { type: string }
        syncToken: { type: string, maxLength: 128 }
    DictionaryChangesPage:
      type: object
      required: [changes, syncToken, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryChange' }
        syncToken: { type: string, maxLength: 128 }
        hasMore: { type: boolean }

    # ------------------------------------------------------------ AI
    TranslateCoreRequest:
      type: object
      required: [text, destinationLanguage]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        sourceLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: Omit for automatic detection.
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        style: { $ref: '#/components/schemas/TranslationStyle' }
        preserveNames: { type: boolean, default: true }
        glossaryId: { type: string, format: uuid }
        addressee: { $ref: '#/components/schemas/Addressee' }
        culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
    TranslateRequest:
      allOf:
        - $ref: '#/components/schemas/TranslateCoreRequest'
        - type: object
          properties:
            destinationProfileId:
              type: string
              format: uuid
              description: Fills destination, addressee, style and glossary defaults; explicit fields win.
            saveToHistory: { type: boolean, default: false, description: Honoured only when history is enabled. }
    Alternative:
      type: object
      required: [text]
      properties:
        label: { type: string, maxLength: 80, description: 'e.g. "Addressing a woman"' }
        text: { type: string }
        addressee: { $ref: '#/components/schemas/Addressee' }
    TranslateResponse:
      type: object
      required: [requestId, destinationLanguage, translatedText, qualityTier, replayed]
      properties:
        requestId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        detectedSourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        detectionConfidence: { type: number, minimum: 0, maximum: 1 }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        translatedText: { type: string }
        alternatives:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Alternative' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean, description: True when returned from the idempotency replay cache. }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    TransformTask:
      type: string
      enum: [GRAMMAR_CORRECTION, REWRITE, TONE_ADJUST, SUMMARIZE, EXPLAIN_TEXT, FORMAT_TEXT, SCRIPT_CONVERSION]
    TransformRequest:
      type: object
      required: [task, text]
      properties:
        task: { $ref: '#/components/schemas/TransformTask' }
        text: { type: string, minLength: 1, maxLength: 5000 }
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: Language of `text`; omit for detection.
        outputLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: |
            Language of the result (ADR 0027); omit to keep the language of `text`. For
            `EXPLAIN_TEXT`, `options.explainIn` is the same option (a different value is 400). For
            `GRAMMAR_CORRECTION` it may only name the language of `text`.
        options:
          type: object
          properties:
            mode:
              type: string
              description: |
                GRAMMAR_CORRECTION → GRAMMAR | SPELLING_ONLY. REWRITE → NATURAL | SHORTEN | EXPAND |
                CLARIFY | SIMPLIFY (short sentences and everyday words, jargon explained, every fact kept).
                Other tasks take no mode.
              enum: [GRAMMAR, SPELLING_ONLY, NATURAL, SHORTEN, EXPAND, CLARIFY, SIMPLIFY]
            tone:
              $ref: '#/components/schemas/Tone'
              description: Required for TONE_ADJUST.
            targetLength:
              type: string
              enum: [SHORT, MEDIUM, LONG]
              description: SUMMARIZE / REWRITE.
            explainIn:
              $ref: '#/components/schemas/LanguageCode'
              description: EXPLAIN_TEXT output language (same as `outputLanguage`).
            format:
              type: string
              enum: [BULLETS, NUMBERED_LIST, PARAGRAPHS, REPORT, MEETING_NOTES]
              description: Required for FORMAT_TEXT; other tasks take no format.
            sourceRomanization:
              type: string
              enum: [AUTO, SERA, INFORMAL_CHAT]
              description: SCRIPT_CONVERSION input convention.
        addressee: { $ref: '#/components/schemas/Addressee' }
        glossaryId: { type: string, format: uuid }
        variation:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: 0 = first answer; a higher number asks for a different version of the same request (regenerate, with a new `Idempotency-Key`; the same key with another `variation` is 409).
        applyStyleProfile: { type: boolean, default: false, description: Requires PERSONAL_STYLE. }
        saveToHistory: { type: boolean, default: false }
    TextEdit:
      type: object
      required: [start, end, replacement]
      properties:
        start: { type: integer, minimum: 0, description: UTF-16 offset into the input (clients map to graphemes). }
        end: { type: integer, minimum: 0 }
        original: { type: string }
        replacement: { type: string }
        category:
          type: string
          enum: [SPELLING, GRAMMAR, PUNCTUATION, STYLE, SCRIPT]
    TransformResponse:
      type: object
      required: [requestId, task, resultText, qualityTier, replayed]
      properties:
        requestId: { type: string, format: uuid }
        task: { $ref: '#/components/schemas/TransformTask' }
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: Language of `resultText` (the request's `outputLanguage`, else the language of the text when known).
        resultText: { type: string }
        edits:
          type: array
          description: GRAMMAR_CORRECTION / SCRIPT_CONVERSION edit list for inline review.
          items: { $ref: '#/components/schemas/TextEdit' }
        alternatives:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Alternative' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    RepliesRequest:
      type: object
      required: [contextText, replyLanguage]
      properties:
        contextText: { type: string, minLength: 1, maxLength: 5000, description: Message text the user explicitly pasted/selected/shared. }
        contextLanguage: { $ref: '#/components/schemas/LanguageCode' }
        replyLanguage: { $ref: '#/components/schemas/LanguageCode' }
        count: { type: integer, minimum: 1, maximum: 5, default: 3 }
        intent:
          type: string
          enum: [AGREE, DISAGREE_POLITELY, ASK_CLARIFICATION, ACCEPT_INVITATION, DECLINE_POLITELY,
            THANK_SENDER]
          description: A preset stance every suggestion takes; omit for varied options (ADR 0048).
        tone: { $ref: '#/components/schemas/Tone' }
        addressee: { $ref: '#/components/schemas/Addressee' }
        instructions:
          type: string
          maxLength: 1000
          description: The user's own notes on what to answer, in any supported language (ADR 0027).
        variation:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: 0 = first answer; a higher number asks for a different set (regenerate, with a new `Idempotency-Key`).
        applyStyleProfile: { type: boolean, default: false }
        saveToHistory: { type: boolean, default: false, description: Honoured only when history is enabled. }
    RepliesResponse:
      type: object
      required: [requestId, suggestions, replayed]
      properties:
        requestId: { type: string, format: uuid }
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: The reply language.
        suggestions:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              tone: { $ref: '#/components/schemas/Tone' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    DraftRequest:
      type: object
      description: |
        ADR 0027. `language` is the language of the document; `instructions` (or the older `purpose`,
        not both) may be in any supported language. Which texts a `mode` needs: NEW `instructions`;
        REPLY `originalEmail` and `instructions`; IMPROVE `draft` (`instructions` optional).
        `originalEmail` outside REPLY and `draft` outside IMPROVE are 400.
      required: [language]
      properties:
        documentType:
          type: string
          enum: [EMAIL, LETTER, APPLICATION, ANNOUNCEMENT, OTHER, JOB_APPLICATION, CV, COVER_LETTER,
            BUSINESS_MESSAGE]
          default: EMAIL
          description: |
            Served: EMAIL, JOB_APPLICATION, CV, COVER_LETTER, BUSINESS_MESSAGE. The others
            (LETTER, APPLICATION, ANNOUNCEMENT, OTHER) answer 400 `NOT_AVAILABLE`.
        mode:
          type: string
          enum: [NEW, REPLY, IMPROVE]
          default: NEW
        language: { $ref: '#/components/schemas/LanguageCode' }
        instructions:
          type: string
          maxLength: 2000
          description: What the e-mail must say (NEW), what to answer (REPLY) or what to change (IMPROVE), in the user's words.
        purpose:
          type: string
          minLength: 1
          maxLength: 500
          deprecated: true
          description: Older name of `instructions`.
        keyPoints:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
          description: Appended to `instructions` as list lines.
        originalEmail:
          type: string
          maxLength: 8000
          description: REPLY only, the e-mail being answered.
        draft:
          type: string
          maxLength: 8000
          description: IMPROVE only, the user's draft.
        tone: { $ref: '#/components/schemas/EmailTone' }
        variation:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: 0 = first answer; a higher number asks for a different version (regenerate, with a new `Idempotency-Key`).
        recipient:
          type: object
          properties:
            name: { type: string, maxLength: 120 }
            role: { type: string, maxLength: 120 }
            formality: { $ref: '#/components/schemas/Formality' }
            gender: { $ref: '#/components/schemas/AddresseeGender' }
        senderName: { type: string, maxLength: 120 }
        length:
          type: string
          enum: [SHORT, MEDIUM, LONG]
          default: MEDIUM
        includeSubject: { type: boolean, default: true }
        culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
        applyStyleProfile: { type: boolean, default: false }
        glossaryId: { type: string, format: uuid }
        saveToHistory: { type: boolean, default: false, description: Honoured only when history is enabled. }
    DraftResponse:
      type: object
      required: [requestId, body, replayed]
      properties:
        requestId: { type: string, format: uuid }
        mode:
          type: string
          enum: [NEW, REPLY, IMPROVE]
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: The language of the e-mail.
        subject:
          type: string
          description: 'Absent when `includeSubject` was false or an improved draft had none; REPLY subjects start with `Re:`.'
        body: { type: string }
        placeholders:
          type: array
          items: { type: string }
          description: |
            Bracketed items in `subject` or `body` the user must fill in before sending (`[date]`,
            `[ቀን]`), brackets included, in order of appearance; empty when there are none.
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    DetectLanguageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LanguageCode' }
    DetectLanguageResponse:
      type: object
      required: [languages, mixedLanguage]
      properties:
        languages:
          type: array
          items:
            type: object
            required: [languageCode, confidence]
            properties:
              languageCode: { $ref: '#/components/schemas/LanguageCode' }
              scriptCode: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
        mixedLanguage: { type: boolean, description: True when code-switching is detected. }
        romanizedNative: { type: boolean, description: True when Amharic/Tigrinya appears to be written in Latin script. }
    FeedbackRequest:
      type: object
      required: [aiRequestId, rating]
      properties:
        aiRequestId: { type: string, format: uuid }
        rating:
          type: string
          enum: [POSITIVE, NEGATIVE]
        reasonCodes:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [WRONG_MEANING, WRONG_TONE, WRONG_GENDER_OR_FORMALITY, UNNATURAL, SPELLING, NAME_CHANGED, WRONG_SCRIPT, TOO_SLOW, OTHER]
        comment: { type: string, maxLength: 1000, description: Requires FEEDBACK_TEXT consent; encrypted. }
        includeContent: { type: boolean, default: false, description: "Attach the input/output text (client-supplied) with FEEDBACK_TEXT consent; without it inputText and outputText are ignored." }
        inputText: { type: string, maxLength: 5000 }
        outputText: { type: string, maxLength: 10000 }

    # ------------------------------------------------------------ history
    HistoryItem:
      type: object
      required: [id, featureCode, inputText, outputText, favorite, createdAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        inputText: { type: string }
        outputText: { type: string }
        favorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    HistoryItemUpdate:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }

    # ------------------------------------------------------------ speech
    AudioContentType:
      type: string
      enum: ['audio/ogg; codecs=opus', 'audio/webm; codecs=opus', audio/wav, audio/flac, audio/mp4]
    UploadSessionRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType: { $ref: '#/components/schemas/AudioContentType' }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        estimatedDurationMs: { type: integer, minimum: 1, maximum: 600000 }
    UploadSession:
      type: object
      required: [uploadSessionId, uploadUrl, method, expiresAt, maxBytes]
      properties:
        uploadSessionId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method:
          type: string
          const: PUT
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time, description: ≤ 5 minutes after issue. }
        maxBytes: { type: integer }
    InlineAudio:
      type: object
      required: [contentType, dataBase64]
      properties:
        contentType: { $ref: '#/components/schemas/AudioContentType' }
        dataBase64: { type: string, contentEncoding: base64, maxLength: 1400000, description: ≤ 30 s of audio. }
    TranscriptionRequest:
      type: object
      description: Exactly one of `uploadSessionId` or `inlineAudio`.
      properties:
        uploadSessionId: { type: string, format: uuid }
        inlineAudio: { $ref: '#/components/schemas/InlineAudio' }
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
          description: Omit with `autoDetect` true.
        autoDetect: { type: boolean, default: false }
        candidateLanguages:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/LanguageCode' }
        punctuate: { type: boolean, default: true }
        outputScript:
          type: string
          enum: [NATIVE, LATIN]
          default: NATIVE
        saveToHistory: { type: boolean, default: false }
