        jobType:
          type: string
          enum: [TRANSCRIPTION, TRANSCRIBE_TRANSLATE, SYNTHESIS]
        status:
          type: string
          enum: [PENDING, UPLOADING, PROCESSING, SUCCEEDED, FAILED, CANCELLED, EXPIRED]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        detectedLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        transcript: { type: string }
        translation: { type: string }
        synthesizedAudioUrl: { type: string, format: uri }
        audioDurationMs: { type: integer, minimum: 0 }
        notes:
          type: array
