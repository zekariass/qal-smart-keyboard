        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        displayName: { type: string }
        gender:
          type: string
          enum: [FEMALE, MALE, NEUTRAL]
        quality:
          type: string
          enum: [STANDARD, NEURAL]
        execution: { $ref: '#/components/schemas/ExecutionMode' }
        sampleUrl: { type: string, format: uri }

    # ------------------------------------------------------------ realtime
    RealtimeSessionRequest:
      type: object
      required: [mode, languageA, languageB]
      properties:
        mode:
          type: string
          enum: [VOICE_TO_VOICE, LIVE_CONVERSATION]
        languageA: { $ref: '#/components/schemas/LanguageCode' }
        languageB: { $ref: '#/components/schemas/LanguageCode' }
        autoDetectSpeaker: { type: boolean, default: false, description: Detect turn language automatically instead of manual speaker switching. }
        synthesizeSpeech: { type: boolean, default: true }
        voiceA: { type: string, maxLength: 120 }
        voiceB: { type: string, maxLength: 120 }
        addressee: { $ref: '#/components/schemas/Addressee' }
        maxDurationSeconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
    RealtimeSession:
      type: object
      required: [sessionId, mode, status]
      properties:
        sessionId: { type: string, format: uuid }
        mode:
          type: string
          enum: [VOICE_TO_VOICE, LIVE_CONVERSATION]
        status:
          type: string
          enum: [CREATED, ACTIVE, ENDED, FAILED, EXPIRED]
        languageA: { $ref: '#/components/schemas/LanguageCode' }
        languageB: { $ref: '#/components/schemas/LanguageCode' }
        websocketUrl: { type: string, format: uri, description: 'wss:// URL; present only on creation.' }
        ticket: { type: string, readOnly: true, description: "Single-use, valid 60 s; present only on creation." }
        ticketExpiresAt: { type: string, format: date-time }
        audioInput:
          type: object
          properties:
            encoding:
              type: string
              enum: [PCM16LE, OPUS]
            sampleRateHz: { type: integer, enum: [16000, 24000, 48000] }
            channels: { type: integer, const: 1 }
            frameDurationMs: { type: integer, minimum: 20, maximum: 100 }
        audioOutput:
          type: object
          properties:
            encoding:
              type: string
              enum: [PCM16LE, OGG_OPUS, MP3]
            sampleRateHz: { type: integer }
            transport:
              type: string
              enum: [BASE64_JSON, BINARY]
        maxDurationSeconds: { type: integer }
        billedSeconds: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    RealtimeClientMessage:
      type: object
      description: Client → server WebSocket text frame.
      required: [type]
      properties:
        type:
          type: string
          enum: [start, speaker_switch, stop, ping]
        speaker:
          type: string
          enum: [A, B]
        clientTimestampMs: { type: integer, format: int64 }
    RealtimeServerMessage:
      type: object
      description: Server → client WebSocket text frame.
      required: [type]
      properties:
        type:
          type: string
          enum: [partial_transcript, final_transcript, translation, tts_audio, usage, error, session_ended, pong]
        turnId: { type: string }
        speaker:
          type: string
          enum: [A, B]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        text: { type: string }
        audioBase64: { type: string, contentEncoding: base64 }
        audioSequence: { type: integer, minimum: 0 }
        secondsUsed: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
        code: { type: string }
        message: { type: string }

    # ------------------------------------------------------------ entitlements
    FeatureEntitlement:
      type: object
      required: [featureCode, accessEnabled, unit, resetPeriod]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        accessEnabled: { type: boolean }
        includedUnits: { type: integer, description: Absent = unlimited (or boolean access when unit is NONE). }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
        resetPeriod: { $ref: '#/components/schemas/ResetPeriod' }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        resetsAt: { type: string, format: date-time }
    Entitlements:
      type: object
      required: [plan, features, entitlementToken]
      properties:
        plan:
          type: object
          required: [planCode, planRank, source]
          properties:
            planCode: { type: string, description: 'FREE, PREMIUM, PREMIUM_PLUS, BUSINESS (data-driven).' }
            displayName: { type: string }
            planRank: { type: integer }
            source:
              type: string
              description: |
                Where the plan comes from: `SUBSCRIPTION` (payment, promotion or admin grant),
                `STORE_PURCHASE` (Google Play or App Store), `ORGANIZATION_SEAT`, `PARTNER`
                (partner-contract grant) or `DEFAULT` (FREE for registered users, GUEST for guests).
              enum: [DEFAULT, SUBSCRIPTION, STORE_PURCHASE, ORGANIZATION_SEAT, PARTNER]
            subscriptionId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            effectiveUntil: { type: string, format: date-time }
        features:
          type: array
          items: { $ref: '#/components/schemas/FeatureEntitlement' }
        creditBalance: { type: number, minimum: 0 }
        entitlementToken: { $ref: '#/components/schemas/EntitlementToken' }
    EntitlementToken:
      type: object
      description: |
        Signed statement of the caller's **offline** gates (SD 15.5, ADR 0013). Clients use it only
        where they cannot ask the server (on-device models, SD 11.9); every server feature is
        re-checked server-side on every call.

        `jws` is a compact JWS, header `alg: EdDSA` (Ed25519), `typ: qal-ent+jwt`, `kid`. Claims,
        none of them personal data: `iss`, `aud` (the keyboard clients), `sub` (user id),
        `deviceId` (when the access token is bound to a device), `planCode`, `features` (object of
        feature code to boolean: offline gates only, currently `ON_DEVICE_AI_MODELS` and `PREMIUM_THEMES`; never a
        metered allowance), `policyVersion` (quota policy that produced the gates), `ver` (token
        format, 1), `iat`, `exp` (`iat` + 24 h), `offlineGraceUntil` (`exp` + 72 h) and `jti`.
        Times are NumericDate seconds.

        Client rules: accept only `alg` EdDSA and `typ` qal-ent+jwt (no `crit`, no embedded or
        remote keys); find `kid` in the key set pinned in the app build; verify the Ed25519
        signature; check `iss`, `aud`, `ver`, `sub` (the signed-in user), `deviceId` (when present),
        `exp - iat <= 24 h` and `offlineGraceUntil - exp <= 72 h`. Before `exp` the gates apply;
        from `exp` until `offlineGraceUntil` they apply only while offline (online, fetch a new
        token); after that the token is void. "Now" is the later of the device clock and the newest
        `iat` or server time seen, so turning the clock back does not extend a token.
      required: [jws, keyId, expiresAt, offlineGraceUntil]
      properties:
        jws: { type: string, description: 'Compact Ed25519 JWS (claims and verification rules above).' }
        keyId: { type: string, description: 'The `kid` of the signing key.' }
        expiresAt: { type: string, format: date-time, description: 'The `exp` claim.' }
        offlineGraceUntil: { type: string, format: date-time, description: 'The `offlineGraceUntil` claim.' }
    JsonWebKeySet:
      type: object
      description: 'RFC 7517 JWK Set of the entitlement-token public keys (Ed25519, RFC 8037).'
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg]
            properties:
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              x: { type: string, description: 'Base64url of the raw 32-byte public key.' }
              kid: { type: string }
              use: { type: string, const: sig }
              alg: { type: string, const: EdDSA }
    UsageReport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [featureCode, periodStart, periodEnd, usedUnits, unit]
            properties:
              featureCode: { $ref: '#/components/schemas/FeatureCode' }
              periodStart: { type: string, format: date-time }
              periodEnd: { type: string, format: date-time }
              usedUnits: { type: integer, minimum: 0 }
              includedUnits: { type: integer }
              creditsConsumed: { type: number, minimum: 0, description: Credits are fractional (6 decimal places) because audio is costed per second. }
              unit: { $ref: '#/components/schemas/MeteringUnit' }
    CreditSummary:
      type: object
      required: [balanceUnits, lots]
      properties:
        balanceUnits: { type: number, format: double, minimum: 0, description: Exact balance (6 dp); display rounded down to whole credits. }
        nextExpiryAt: { type: string, format: date-time }
        lots:
          type: array
          items:
            type: object
            required: [lotId, originalUnits, remainingUnits, source]
            properties:
              lotId: { type: string, format: uuid }
              originalUnits: { type: number, format: double, exclusiveMinimum: 0 }
              remainingUnits: { type: number, format: double, minimum: 0 }
              source:
                type: string
                enum: [PURCHASE, GRANT, PROMOTION, REFUND, ADJUSTMENT]
              expiresAt: { type: string, format: date-time }
    CreditTransaction:
      type: object
      required: [id, transactionType, deltaUnits, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        transactionType:
          type: string
          enum: [PURCHASE, GRANT, CONSUMPTION, REFUND, EXPIRY, ADJUSTMENT, REVERSAL]
        deltaUnits: { type: number, format: double }
        balanceAfter: { type: number, format: double, minimum: 0 }
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        lotId: { type: string, format: uuid }
        aiRequestId: { type: string, format: uuid }
        paymentOrderId: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ billing
    SalesChannel:
      type: string
      enum: [WEB, ANDROID_GOOGLE_PLAY, ANDROID_DIRECT, IOS_APP_STORE, IOS_DIRECT, ADMIN, PARTNER]
    DistributionChannel:
      type: string
      enum: [GOOGLE_PLAY, APPLE_APP_STORE, DIRECT_DOWNLOAD, WEB]
    PurchaseFlow:
      type: string
      enum: [STORE_BILLING, LOCAL_GATEWAY_IN_APP, EXTERNAL_WEB_CHECKOUT, CONSUMPTION_ONLY, NONE]
    BillingPeriod:
      type: string
      enum: [ONE_TIME, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, LIFETIME]
    RenewalModel:
      type: string
      enum: [NONE, MANUAL_RENEW, AUTO_RENEW, STORE_MANAGED]
    TaxBehavior:
      type: string
      enum: [INCLUSIVE, EXCLUSIVE, NOT_APPLICABLE]
    Price:
      type: object
      required: [billingPeriod, renewalModel, listPrice, taxBehavior]
      properties:
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        listPrice: { $ref: '#/components/schemas/Money' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        displayPrice: { type: string, description: "Localised display string, e.g. \"299.00 ብር\"." }
        storeProductId: { type: string, description: "Store SKU to launch the store billing flow (STORE_BILLING only; the Play / RevenueCat product identifier, e.g. `credits_500`)." }
        storeOfferId: { type: string, description: Play base plan / offer of a store subscription (absent for one-time products). }
        storeOfferingId: { type: string, description: Suggested RevenueCat offering holding `storeProductId` (STORE_BILLING only). }
        storePackageId: { type: string, description: Suggested RevenueCat package identifier inside `storeOfferingId` (STORE_BILLING only). }
    Product:
      type: object
      required: [productCode, productType, displayName, prices]
      properties:
        productCode: { type: string, maxLength: 60, description: 'e.g. PLAN_PREMIUM, PLAN_PREMIUM_PLUS, CREDITS_500.' }
        productType:
          type: string
          enum: [SUBSCRIPTION, AI_CREDIT_PACK, ADD_ON]
        displayName: { type: string }
        description: { type: string }
        planCode: { type: string }
        creditUnits: { type: integer, minimum: 1 }
        creditValidityDays: { type: integer, minimum: 1 }
        prices:
          type: array
          items: { $ref: '#/components/schemas/Price' }
    PaymentMethodOption:
      type: object
      required: [methodCode, providerCode, displayName, methodType]
      description: Public method only — never merchant account IDs or secrets.
      properties:
        methodCode: { type: string, maxLength: 60, description: 'Public method code, e.g. CHAPA_TELEBIRR, CHAPA_CBEBIRR, ARIFPAY_CARD.' }
        providerCode: { type: string, maxLength: 40 }
        displayName: { type: string }
        methodType:
          type: string
          description: '`HOSTED_CHECKOUT` = the provider''s own page lets the payer pick a wallet, bank or card (ADR 0045).'
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD, PAYPAL, APP_STORE, MANUAL, HOSTED_CHECKOUT]
        supportsAutoRenew: { type: boolean }
        requiresRedirect: { type: boolean }
        minAmount: { $ref: '#/components/schemas/Money' }
        maxAmount: { $ref: '#/components/schemas/Money' }
        logoUrl: { type: string, format: uri }
        priority: { type: integer, minimum: 1, description: 'Provider priority for this market and channel (1 = default).' }
        isDefault: { type: boolean, description: True on the method the app should preselect. }
    MarketResolution:
      type: object
      description: How the server resolved the billing country (ADR 0045). Never contains IP addresses.
      required: [source, confidence, globalDefault]
      properties:
        source:
          type: string
          description: |
            `IP_EDGE` trusted edge country header; `DEV_MOCK` development override; `CLIENT_HINTS` network and
            SIM hints agree (no trusted IP country); `NONE` nothing usable.
          enum: [IP_EDGE, DEV_MOCK, CLIENT_HINTS, NONE]
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW, NONE]
        globalDefault: { type: boolean, description: True when the global (`ZZ`) providers apply. }
    BillingOptions:
      type: object
      required: [marketCountry, clientPlatform, distributionChannel, purchaseFlow, purchaseUiAllowed, products, paymentMethods, policyEvaluatedAt]
      properties:
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        marketResolution: { $ref: '#/components/schemas/MarketResolution' }
        clientPlatform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        distributionChannel: { $ref: '#/components/schemas/DistributionChannel' }
        purchaseFlow: { $ref: '#/components/schemas/PurchaseFlow' }
        purchaseUiAllowed: { type: boolean, description: "False ⇒ show no prices, buttons or purchase calls-to-action." }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        paymentMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethodOption' }
        notice: { type: string, description: 'Optional notice without a purchase call-to-action (e.g. consumption only, or a build without store billing in a store-billing market: no purchase in this build).' }
        policyEvaluatedAt: { type: string, format: date-time }
    PromotionValidateRequest:
      type: object
      required: [code, productCode, billingPeriod, marketCountry, salesChannel]
      properties:
        code: { type: string, minLength: 3, maxLength: 40 }
        productCode: { type: string, maxLength: 60 }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
    PromotionValidation:
      type: object
      required: [valid, code]
      properties:
        valid: { type: boolean }
        code: { type: string }
        discount: { $ref: '#/components/schemas/Money' }
        discountPercent: { type: integer, minimum: 1, maximum: 100 }
        reasonCode:
          type: string
          enum: [NOT_FOUND, EXPIRED, NOT_ELIGIBLE, REDEMPTION_LIMIT_REACHED, NOT_APPLICABLE_TO_PRODUCT]
        validUntil: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [productCode, billingPeriod, marketCountry, salesChannel]
      properties:
        productCode: { type: string, maxLength: 60 }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        renewalPreference:
          type: string
          enum: [NONE, MANUAL_RENEW, AUTO_RENEW]
          default: MANUAL_RENEW
        promotionCode: { type: string, maxLength: 40 }
        upgradeFromSubscriptionId: { type: string, format: uuid }
    OrderAmounts:
      type: object
      required: [list, discount, tax, total]
      properties:
        list: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    PaymentOrder:
      type: object
      required: [orderId, orderReference, orderType, status, productCode, marketCountry, salesChannel, amounts, taxBehavior, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        orderReference: { type: string, maxLength: 40, description: Human-readable reference used with providers and bank transfers. }
        orderType:
          type: string
          enum: [SUBSCRIPTION_PURCHASE, SUBSCRIPTION_RENEWAL, SUBSCRIPTION_UPGRADE, AI_CREDIT_TOPUP, ADD_ON_PURCHASE]
        status:
          type: string
          enum: [CREATED, AWAITING_PAYMENT, PAID, FAILED, CANCELLED, EXPIRED, PARTIALLY_REFUNDED, REFUNDED]
        productCode: { type: string }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        amounts: { $ref: '#/components/schemas/OrderAmounts' }
        discountReason:
          type: string
          enum: [PROMOTION, UPGRADE_PRORATION, ADMIN]
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        allowedMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethodOption' }
        fulfilment:
          type: object
          properties:
            subscriptionId: { type: string, format: uuid }
            creditLotId: { type: string, format: uuid }
            receiptId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CreateAttemptRequest:
      type: object
      required: [methodCode]
      properties:
        methodCode: { type: string, maxLength: 60 }
        returnUrl: { type: string, format: uri, description: "App deep link; must match a server-side allowlist. UX only, never proof of payment." }
        payerPhoneNumber: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: For approved direct wallet push charges. }
        locale: { type: string, maxLength: 35 }
    PaymentAttempt:
      type: object
      required: [attemptId, attemptNumber, status, methodCode, providerCode, createdAt]
      properties:
        attemptId: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [INITIATED, PENDING, REQUIRES_ACTION, SUCCEEDED, FAILED, CANCELLED, EXPIRED, UNKNOWN]
        methodCode: { type: string }
        providerCode: { type: string }
        nextAction:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [NONE, REDIRECT, DIRECT_CHARGE_PENDING, BANK_TRANSFER]
            checkoutUrl: { type: string, format: uri, description: Provider-hosted checkout (open in a browser tab/custom tab). }
            directChargeInstructions:
              type: object
              properties:
                message: { type: string, description: 'e.g. "Approve the payment in the telebirr app".' }
                expiresAt: { type: string, format: date-time }
            bankTransferInstructions:
              type: object
              properties:
                bankName: { type: string }
                accountName: { type: string }
                accountNumber: { type: string }
                reference: { type: string, description: Must be quoted exactly in the transfer. }
                amount: { $ref: '#/components/schemas/Money' }
                expiresAt: { type: string, format: date-time }
        failureCode: { type: string }
        failureMessage: { type: string, maxLength: 500, description: "Safe, localised message." }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ManualTransferClaimForm:
      type: object
      required: [attemptId, bankReference, transferDate]
      properties:
        attemptId: { type: string, format: uuid }
        payerName: { type: string, maxLength: 160 }
        bankReference: { type: string, maxLength: 160 }
        transferDate: { type: string, format: date }
        evidence: { type: string, format: binary, description: Optional JPEG/PNG/PDF ≤ 5 MB. }
    ManualTransferClaim:
      type: object
      required: [claimId, status, submittedAt]
      properties:
        claimId: { type: string, format: uuid }
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, MATCHED, REJECTED]
        submittedAt: { type: string, format: date-time }
    CreateMandateRequest:
      type: object
      required: [subscriptionId, methodCode, consentRecordId, maxAmount, intervalUnit]
      properties:
        subscriptionId: { type: string, format: uuid }
        methodCode: { type: string, maxLength: 60 }
        consentRecordId: { type: string, format: uuid, description: "Granted PAYMENT_MANDATE consent showing amount, frequency and cancellation terms." }
        maxAmount: { $ref: '#/components/schemas/Money' }
        intervalUnit:
          type: string
          enum: [DAY, WEEK, MONTH, YEAR]
        intervalCount: { type: integer, minimum: 1, default: 1 }
        returnUrl: { type: string, format: uri }
    PaymentMandate:
      type: object
      required: [mandateId, status, providerCode, methodCode, maxAmount, intervalUnit, intervalCount]
      properties:
        mandateId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, SIGNING_REQUIRED, ACTIVE, PAUSED, CANCELLED, EXPIRED, FAILED, REVOKED]
        providerCode: { type: string }
        methodCode: { type: string }
        maxAmount: { $ref: '#/components/schemas/Money' }
        intervalUnit:
          type: string
          enum: [DAY, WEEK, MONTH, YEAR]
        intervalCount: { type: integer, minimum: 1 }
        nextAction:
          type: object
          properties:
            signingUrl: { type: string, format: uri }
            instructions: { type: string }
        consentedAt: { type: string, format: date-time }
        nextChargeAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
    StorePurchaseRequest:
      type: object
      required: [provider, productId]
      description: |
        Google requires `purchaseToken` (+ `packageName`); Apple requires `signedTransactionInfo`;
        RevenueCat (ADR 0046) requires neither: the server reads the caller's RevenueCat customer
        (App User ID = the caller's `userId`). `productId` is the store / RevenueCat product identifier
        (Play: `subscriptionId:basePlanId`, e.g. `qal_premium:monthly`; a credit pack: its in-app product id,
        e.g. `credits_500`, with the store `transactionId`).
      properties:
        provider:
          type: string
          enum: [GOOGLE_PLAY, APPLE_APP_STORE, REVENUECAT]
        productId: { type: string, maxLength: 255 }
        transactionId: { type: string, minLength: 1, maxLength: 255, description: 'Store transaction id of a one-time purchase (Play order id `GPA.…`): which credit-pack purchase is reported. A hint only: the server verifies it with the store provider.' }
        distributionChannel:
          type: string
          enum: [GOOGLE_PLAY, APPLE_APP_STORE, DIRECT_DOWNLOAD, WEB]
          description: The build reporting the purchase. `DIRECT_DOWNLOAD` / `WEB` have no store billing and are refused (403 `BILLING_POLICY_DENIED`).
        purchaseToken: { type: string, maxLength: 4096, writeOnly: true }
        packageName: { type: string, maxLength: 255 }
        signedTransactionInfo: { type: string, maxLength: 16384, writeOnly: true, description: StoreKit 2 JWS transaction. }
        appAccountToken: { type: string, format: uuid, description: Must equal the account token the app set at purchase (StoreKit appAccountToken / Play obfuscatedAccountId). }
      oneOf:
        - required: [purchaseToken, packageName]
          properties:
            provider: { enum: [GOOGLE_PLAY] }
        - required: [signedTransactionInfo]
          properties:
            provider: { enum: [APPLE_APP_STORE] }
        - properties:
            provider: { enum: [REVENUECAT] }
    StorePurchaseResult:
      type: object
      required: [storePurchaseId, status, environment]
      properties:
        storePurchaseId: { type: string, format: uuid }
        productId: { type: string, description: The store product identifier the purchase is for (without a Play base plan suffix). }
        autoRenewing: { type: boolean }
        status:
          type: string
          enum: [PENDING, ACTIVE, IN_GRACE_PERIOD, ON_HOLD, PAUSED, CANCELLED, EXPIRED, REVOKED, REFUNDED]
        environment:
          type: string
          enum: [SANDBOX, PRODUCTION]
        acknowledgedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        subscription: { $ref: '#/components/schemas/Subscription' }
        purchaseType:
          type: string
          description: '`SUBSCRIPTION` (a store plan) or `CONSUMABLE` (a credit pack: `creditLotId`, no `subscription`).'
          enum: [SUBSCRIPTION, CONSUMABLE]
        productCode: { type: string, maxLength: 60, description: 'CONSUMABLE: our pack, e.g. `CREDITS_500`.' }
        transactionId: { type: string, maxLength: 255, description: 'CONSUMABLE: the store transaction id (the idempotency key).' }
        creditLotId: { type: string, format: uuid, description: 'CONSUMABLE: the one credit lot this purchase granted (absent while not granted, e.g. REFUNDED before a grant or EXPIRED).' }
        creditUnits: { type: integer, format: int64, minimum: 1, description: 'CONSUMABLE: credits the pack grants.' }
        creditsExpireAt: { type: string, format: date-time, description: 'CONSUMABLE: when the granted credits expire (store purchase time + the pack validity).' }
    Subscription:
      type: object
      required: [subscriptionId, planCode, status, sourceType, billingMode]
      properties:
        subscriptionId: { type: string, format: uuid }
        planCode: { type: string }
        status:
          type: string
          enum: [PENDING, ACTIVE, GRACE_PERIOD, PAST_DUE, PAUSED, CANCELLED, EXPIRED, REVOKED, UPGRADED]
        sourceType:
          type: string
          enum: [PAYMENT, STORE, ADMIN_GRANT, PROMOTION, PARTNER]
        billingMode:
          type: string
          enum: [MANUAL_RENEW, AUTO_RENEW, STORE_MANAGED, GRANT, LIFETIME]
        providerCode: { type: string }
        methodCode: { type: string }
        mandateId: { type: string, format: uuid }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        autoRenewEnabled: { type: boolean }
        cancelAtPeriodEnd: { type: boolean }
        nextBillingAt: { type: string, format: date-time }
        renewable: { type: boolean, description: True when `/renew` can create a manual-renewal order. }
        manageUrl: { type: string, format: uri, description: Store subscription management URL (STORE_MANAGED). }
    RenewSubscriptionRequest:
      type: object
      required: [salesChannel]
      properties:
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        promotionCode: { type: string, maxLength: 40 }
    Receipt:
      type: object
      required: [receiptId, receiptNumber, orderId, issuedAt, lines, total]
      properties:
        receiptId: { type: string, format: uuid }
        receiptNumber: { type: string, description: Sequential per market/seller. }
        orderId: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        sellerName: { type: string }
        sellerTaxId: { type: string }
        buyerName: { type: string }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, amount]
            properties:
              description: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitAmount: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        paymentMethodDisplay: { type: string }
        pdfUrl: { type: string, format: uri }
    RawProviderEvent:
      type: object
      description: Provider-specific payload; parsed and verified by the provider adapter.
      additionalProperties: true
    WebhookAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean, const: true }
    ProviderRoute:
      type: object
      required: [providerCode, priority, enabled]
      properties:
        providerCode: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]*$' }
        priority: { type: integer, minimum: 1, readOnly: true }
        enabled: { type: boolean }
        notes: { type: string, maxLength: 1000 }
        providerActive: { type: boolean, readOnly: true, description: 'payment_providers is_active and ACTIVE.' }
        adapterRegistered: { type: boolean, readOnly: true, description: An adapter for this provider is running in this environment. }
    ProviderRouteSet:
      type: object
      required: [countryCode, clientPlatform, distributionChannel, revision, routes]
      properties:
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        clientPlatform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        distributionChannel: { $ref: '#/components/schemas/DistributionChannel' }
        revision: { type: integer, minimum: 0 }
        routes:
          type: array
          items: { $ref: '#/components/schemas/ProviderRoute' }
    ProviderRouteSetUpdate:
      type: object
      required: [expectedRevision, routes]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        routes:
          type: array
          maxItems: 20
          description: In priority order (first = default).
          items:
            type: object
            required: [providerCode]
            properties:
              providerCode: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]*$' }
              enabled: { type: boolean, default: true }
              notes: { type: string, maxLength: 1000 }
    AdminBillingPrice:
      type: object
      required: [priceId, marketCountry, salesChannel, amount, taxBehavior, billingPeriod, renewalModel, priceVersion, active, validFrom]
      properties:
        priceId: { type: string, format: uuid }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        amount: { $ref: '#/components/schemas/Money' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        taxRateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        priceVersion: { type: integer, minimum: 1 }
        active: { type: boolean, description: The row is active and inside its validity window now. }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    AdminBillingProduct:
      type: object
      required: [productCode, productType, displayName, productStatus, prices]
      properties:
        productCode: { type: string, maxLength: 60 }
        productType:
          type: string
          enum: [SUBSCRIPTION, AI_CREDIT_PACK, ADD_ON]
        displayName: { type: string, maxLength: 120 }
        description: { type: string }
        productStatus:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        planCode: { type: string }
        creditUnits: { type: integer, format: int64, minimum: 1 }
        creditValidityDays: { type: integer, minimum: 1 }
        prices:
          type: array
          items: { $ref: '#/components/schemas/AdminBillingPrice' }
    AdminBillingProductUpdate:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        productStatus:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        creditUnits: { type: integer, format: int64, minimum: 1, maximum: 1000000, description: Credit packs only. }
        creditValidityDays: { type: integer, minimum: 1, maximum: 3650, description: Credit packs only. }
    AdminBillingPriceUpdate:
      type: object
      required: [currency, amountMinor, billingPeriod, renewalModel]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000, description: 'Integer minor units of `currency` (4900 = 49.00 ETB).' }
        taxBehavior:
          type: string
          enum: [INCLUSIVE, EXCLUSIVE, NOT_APPLICABLE]
          default: INCLUSIVE
        taxRateBasisPoints: { type: integer, minimum: 0, maximum: 10000, description: Required for EXCLUSIVE. }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        active: { type: boolean, default: true, description: false ends the price of this scope. }
    MarketOffering:
      type: string
      enum: [SUBSCRIPTIONS, AI_CREDITS]
    MarketOfferingSet:
      type: object
      required: [countryCode, revision, offerings]
      properties:
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        revision: { type: integer, minimum: 0 }
        offerings:
          type: array
          items:
            type: object
            required: [offering, enabled, source]
            properties:
              offering: { $ref: '#/components/schemas/MarketOffering' }
              enabled: { type: boolean, description: Effective value for the market. }
              source:
                type: string
                enum: [MARKET, DEFAULT, NONE]
                description: '`MARKET` its own setting, `DEFAULT` inherited from `ZZ`, `NONE` no setting (off).'
              notes: { type: string }
    MarketOfferingSetUpdate:
      type: object
      required: [expectedRevision, offerings]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        offerings:
          type: array
          maxItems: 2
          items:
            type: object
            required: [offering, enabled]
            properties:
              offering: { $ref: '#/components/schemas/MarketOffering' }
              enabled: { type: boolean }
              notes: { type: string, maxLength: 1000 }

    # ------------------------------------------------------------ organizations
    OrgRole:
      type: string
      enum: [OWNER, ADMIN, BILLING, MEMBER]
    OrganizationDataPolicy:
      type: object
      properties:
        zeroDataRetentionRequired: { type: boolean, default: false }
        allowedProcessingRegions:
          type: array
          items: { type: string, maxLength: 40 }
        historyDisabled: { type: boolean, default: false }
    Organization:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        billingEmail: { type: string, format: email }
        dataPolicy: { $ref: '#/components/schemas/OrganizationDataPolicy' }
        myRole: { $ref: '#/components/schemas/OrgRole' }
        createdAt: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [name, countryCode]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        billingEmail: { type: string, format: email }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        billingEmail: { type: string, format: email }
        dataPolicy: { $ref: '#/components/schemas/OrganizationDataPolicy' }
    OrganizationMember:
      type: object
      required: [userId, role, status]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string }
        contactMasked: { type: string }
        role: { $ref: '#/components/schemas/OrgRole' }
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        seat: { $ref: '#/components/schemas/SeatAssignment' }
        joinedAt: { type: string, format: date-time }
    InvitationCreate:
      type: object
      required: [role]
      description: Exactly one of `email` or `phoneNumber`.
      properties:
        email: { type: string, format: email }
        phoneNumber: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        role: { $ref: '#/components/schemas/OrgRole' }
        assignSeatFromSubscriptionId: { type: string, format: uuid }
      oneOf:
        - required: [email]
        - required: [phoneNumber]
    Invitation:
      type: object
      required: [invitationId, role, status, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRole' }
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        expiresAt: { type: string, format: date-time }
    SeatAssignmentRequest:
      type: object
      required: [organizationSubscriptionId]
      properties:
        organizationSubscriptionId: { type: string, format: uuid }
    SeatAssignment:
      type: object
      required: [organizationSubscriptionId, planCode, assignedAt]
      properties:
        organizationSubscriptionId: { type: string, format: uuid }
        planCode: { type: string }
        assignedAt: { type: string, format: date-time }
    FeatureUsage:
      type: object
      required: [featureCode, usedUnits, unit]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        usedUnits: { type: integer, minimum: 0 }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
    OrganizationUsage:
      type: object
      required: [periodStart, periodEnd, byFeature]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/FeatureUsage' }
        byApiClient:
          type: array
          items:
            type: object
            required: [apiClientId, usage]
            properties:
              apiClientId: { type: string, format: uuid }
              usage:
                type: array
                items: { $ref: '#/components/schemas/FeatureUsage' }
    ApiScope:
      type: string
      enum: [translate, transform, transliterate, detect_language, speech, usage_read]
    ApiClientCreate:
      type: object
      required: [name, environment, scopes]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        environment:
          type: string
          enum: [TEST, LIVE]
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiScope' }
        rateLimitPerMinute: { type: integer, minimum: 1, maximum: 10000 }
        allowedIpCidrs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 43 }
    ApiKeySummary:
      type: object
      required: [keyId, prefix, status, createdAt]
      properties:
        keyId: { type: string, format: uuid }
        prefix: { type: string, description: 'First characters for identification, e.g. sk_live_7Hq2.' }
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        description: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApiClient:
      type: object
      required: [clientId, name, environment, scopes, status]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        environment:
          type: string
          enum: [TEST, LIVE]
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ApiScope' }
        rateLimitPerMinute: { type: integer }
        allowedIpCidrs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKeySummary' }
        createdAt: { type: string, format: date-time }
    ApiKeyCreate:
      type: object
      properties:
        description: { type: string, maxLength: 200 }
        expiresAt: { type: string, format: date-time }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKeySummary'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, readOnly: true, description: Full API key. Returned only once; store it securely. }

    # ------------------------------------------------------------ glossaries
    Glossary:
      type: object
      required: [glossaryId, name, ownerType, sourceLanguage, destinationLanguage, enforcement]
      properties:
        glossaryId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        ownerType:
          type: string
          enum: [USER, ORGANIZATION]
        organizationId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
          description: STRICT fails the guardrail if a matched term is not rendered as specified.
        entryCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GlossaryCreate:
      type: object
      required: [name, sourceLanguage, destinationLanguage]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        organizationId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
          default: PREFER
    GlossaryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
    GlossaryEntryInput:
      type: object
      required: [sourceTerm]
      description: Either `targetTerm` or `doNotTranslate = true`.
      properties:
        sourceTerm: { type: string, minLength: 1, maxLength: 200 }
        targetTerm: { type: string, maxLength: 200 }
        doNotTranslate: { type: boolean, default: false }
        caseSensitive: { type: boolean, default: false }
        partOfSpeech: { type: string, maxLength: 30 }
        note: { type: string, maxLength: 500 }
    GlossaryEntry:
      allOf:
        - $ref: '#/components/schemas/GlossaryEntryInput'
        - type: object
          required: [entryId]
          properties:
            entryId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    GlossaryBatchRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [UPSERT, DELETE]
              entryId: { type: string, format: uuid, description: Required for DELETE; optional for UPSERT (match by sourceTerm otherwise). }
              entry: { $ref: '#/components/schemas/GlossaryEntryInput' }
    GlossaryBatchResult:
      type: object
      required: [upserted, deleted]
      properties:
        upserted: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            required: [index, code]
            properties:
              index: { type: integer, minimum: 0 }
              code: { type: string }
              message: { type: string }

    # ------------------------------------------------------------ partner
    TransliterateRequest:
      type: object
      required: [text, languageCode, direction]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        profileCode: { type: string, maxLength: 100, description: Defaults to the language's active phonetic profile. }
        profileVersion: { type: string, maxLength: 40, description: Pin a version for reproducible output. }
        direction:
          type: string
          enum: [LATIN_TO_NATIVE, NATIVE_TO_LATIN]
        returnCandidates: { type: boolean, default: false }
        maxCandidates: { type: integer, minimum: 1, maximum: 5, default: 3 }
    TransliterateResponse:
      type: object
      required: [text, profileCode, profileVersion]
      properties:
        text: { type: string }
        profileCode: { type: string }
        profileVersion: { type: string }
        tokens:
          type: array
          description: Present when `returnCandidates` is true.
          items:
            type: object
            required: [input, output]
            properties:
              input: { type: string }
              output: { type: string }
              candidates:
                type: array
                items: { type: string }
              preserved: { type: boolean, description: True for protected/unknown tokens kept as-is. }
        charactersBilled: { type: integer, minimum: 0 }
    PartnerUsage:
      type: object
      required: [apiClientId, periodStart, periodEnd, byFeature]
      properties:
        apiClientId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/FeatureUsage' }
    PartnerLanguages:
      type: object
      required: [languages, transliterationProfiles, capabilities]
      properties:
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        transliterationProfiles:
          type: array
          items: { $ref: '#/components/schemas/TransliterationProfile' }
        capabilities: { $ref: '#/components/schemas/AiCapabilities' }
