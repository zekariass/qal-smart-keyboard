          required: [destinationLanguage]
          properties:
            destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
            addressee: { $ref: '#/components/schemas/Addressee' }
            culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
            synthesizeSpeech: { type: boolean, default: false }
            voiceId: { type: string, maxLength: 120 }
    PartnerTranscriptionRequest:
      type: object
      description: Exactly one of `audioUrl` or `inlineAudio`.
      properties:
        audioUrl: { type: string, format: uri, description: HTTPS URL fetched once and not retained. }
        inlineAudio: { $ref: '#/components/schemas/InlineAudio' }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        autoDetect: { type: boolean, default: false }
        punctuate: { type: boolean, default: true }
        destinationLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: If set, also translate (SPEECH_TRANSLATE).
      oneOf:
        - required: [audioUrl]
        - required: [inlineAudio]
    SpeechJob:
      type: object
      required: [jobId, jobType, status, createdAt]
