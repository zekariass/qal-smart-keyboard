openapi: 3.1.0
info:
  title: Qal Smart Keyboard API
  version: 2.0.0
  summary: App API (/api/v1) and partner API (/partner/v1) for the Qal Smart Keyboard.
  description: |
    Implementation contract for the Qal Smart Keyboard backend (System Design v2.0,
    Architecture Review v2.0). Update this file in the same change as controller/DTO changes.

    ## Privacy rules encoded in this contract
    - **There is no keystroke endpoint.** Ordinary typing, dictionary lookup, suggestions and
      Latin-QWERTY → Ge'ez transliteration run locally in the on-device `keyboard-core`.
      `/me/typing-languages` synchronises *preferences* only.
    - Text or audio is sent **only** after an explicit user action (Translate, Grammar, Rewrite,
      Smart reply, Voice, ...). The server does not persist AI input/output text by default;
      `ai_requests` stores operational metadata only.
    - Saved history, synced dictionary words, destination-profile labels and style free-text
      are encrypted server-side with a per-user data key (crypto-shredded on account deletion).
    - Contacts are never uploaded. Android per-app rules are keyed by a client-computed HMAC.
    - **The server never trusts client-supplied amounts, prices, merchant accounts or payment
      success.** Orders are server-priced; payments are verified server-to-server.

    ## Conventions
    - JSON properties are camelCase; IDs are UUID strings; times are ISO-8601 UTC (`date-time`).
    - Money is integer minor units plus currency exponent (`Money`). Never floating point.
    - Errors are RFC 9457 `application/problem+json` (`Problem`) with stable `code` and `correlationId`.
    - Every response carries `X-Correlation-Id`. Rate-limited endpoints return `RateLimit-*` headers.
    - Lists use cursor pagination: `cursor` + `limit` (≤ 100) → `nextCursor` (absent at the end).
    - State-changing AI, billing, order, attempt, mandate, store-purchase and realtime-session
      POSTs require `Idempotency-Key` (see the parameter for the at-most-once charging rule).
    - Clients send `X-Client-Platform`, `X-App-Version` and `X-Client-Surface` on every request.
      A request from an unsupported app version fails with `APP_VERSION_UNSUPPORTED` (426).
  contact:
    name: Platform Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.com
    description: Placeholder production host. App API under /api/v1, partner API under /partner/v1.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Phone OTP, Google/Apple, email login, guest sessions and token rotation.
  - name: Devices
    description: Device installations, attestation and language-resource installation reports.
  - name: Me
    description: Profile, deletion, data export and consents.
  - name: Config
    description: Remote configuration, feature flags and AI capability matrix.
  - name: Languages
    description: Language catalogue, transliteration profiles and signed resource manifests.
  - name: Preferences
    description: Preferences, typing languages, destination profiles, per-app rules, style profiles and dictionary sync.
  - name: AI
    description: Explicit, user-initiated text AI actions.
  - name: History
    description: Opt-in encrypted AI history.
  - name: Speech
    description: Speech-to-text, speech translation and text-to-speech.
  - name: Realtime
    description: Voice-to-voice and live conversation sessions over WebSocket.
  - name: Entitlements
    description: Effective plan, allowances, usage and AI credits.
  - name: Billing
    description: Provider-neutral orders, payment attempts, mandates, store purchases, subscriptions and receipts.
  - name: Webhooks
    description: Provider-to-server callbacks. Not called by apps; no bearer authentication.
  - name: Organizations
    description: Business organisations, members, seats and partner API clients.
  - name: Glossaries
    description: User and organisation terminology enforced in translation and rewriting.
  - name: Partner
    description: Partner/enterprise language API authenticated with API keys.

paths:
  # ---------------------------------------------------------------- Auth
  /api/v1/auth/attestation-nonces:
    post:
      tags: [Auth]
      operationId: createAttestationNonce
      summary: Issue a single-use nonce for device attestation
      description: |
        Returns a server-issued nonce that the client binds into a Play Integrity or App Attest
        request. Required before `/auth/guest` and `/devices/{deviceId}/attestations` so that
        attestation tokens cannot be replayed. Nonces expire after 5 minutes.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '201':
          description: Nonce issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationNonce' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/otp/start:
    post:
      tags: [Auth]
      operationId: startPhoneOtp
      summary: Send a one-time code to a phone number
      description: |
        Starts phone sign-in. Responds identically whether or not the number is registered.
        Rate-limited per number, device and IP.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpStartRequest' }
            example:
              phoneNumber: '+251911234567'
              channel: SMS
      responses:
        '202':
          description: Code sent (or silently suppressed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyPhoneOtp
      summary: Verify a phone code and obtain a session
      description: |
        Exchanges a valid code for a session. **Guest upgrade:** if the request carries a guest
        bearer token, the guest's data (preferences, usage, history) is merged into the
        registered account and `mergedGuestUserId` is returned.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: exchangeOAuthIdToken
      summary: Sign in with a Google or Apple ID token
      description: |
        Verifies the provider ID token (signature, audience, nonce, expiry) server-side.
        Same guest-upgrade merge behaviour as OTP verification.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [GOOGLE, APPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthExchangeRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/email/register:
    post:
      tags: [Auth]
      operationId: registerWithEmail
      summary: Register with email and password
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRegisterRequest' }
      responses:
        '201':
          description: Account created; email verification pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/email/login:
    post:
      tags: [Auth]
      operationId: loginWithEmail
      summary: Sign in with email and password
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailLoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Start password recovery
      description: Always returns 202 to avoid account enumeration.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordForgotRequest' }
      responses:
        '202': { description: Recovery email sent if the account exists. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete password recovery
      description: Consumes the single-use reset token and revokes all existing sessions.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: |
        Every refresh issues a new refresh token and invalidates the presented one. Tokens belong
        to a token family; presenting an already-rotated token is treated as theft and **revokes
        the whole family** (`REFRESH_TOKEN_REUSED`). Access tokens live 10–15 minutes.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session (or all sessions)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session(s) revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/guest:
    post:
      tags: [Auth]
      operationId: createGuestSession
      summary: Create an attested guest session for trial AI use
      description: |
        Creates (or resumes) an anonymous guest account bound to one installation. Requires a
        valid Play Integrity / App Attest verdict over a nonce from `/auth/attestation-nonces`.
        Offline typing never needs this call. Guests cannot purchase, sync history or join
        organisations.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSessionRequest' }
      responses:
        '200':
          description: Guest session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Devices
  /api/v1/devices:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register or update the current installation
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Device registered (idempotent on installationId).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Update app/OS version or push token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device and its sessions
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/devices/{deviceId}/attestations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: submitDeviceAttestation
      summary: Submit a device-integrity verdict
      description: Verified server-side with Google/Apple. Result is stored on the device row and used for abuse controls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationEvidence' }
      responses:
        '200':
          description: Attestation evaluated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/devices/{deviceId}/resource-installations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: reportResourceInstallations
      summary: Report language-resource install outcomes
      description: Operational telemetry only (version, status, checksum/signature verification). Contains no text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInstallationReport' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Me
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get the current user's profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/deletion-request:
    post:
      tags: [Me]
      operationId: requestAccountDeletion
      summary: Schedule account deletion
      description: |
        Schedules deletion after a cancellation window. On purge the user data key is destroyed
        (crypto-shredding encrypted history, dictionary, labels). Financial records required by
        law are retained in pseudonymised form. Active store subscriptions must be cancelled in
        the store; the response lists any that remain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionRequestCreate' }
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Me]
      operationId: cancelAccountDeletion
      summary: Cancel a pending deletion request
      responses:
        '204': { description: Cancelled. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/data-exports:
    post:
      tags: [Me]
      operationId: requestDataExport
      summary: Request an export of personal data
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataExportCreate' }
      responses:
        '202':
          description: Export queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/me/data-exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Me]
      operationId: getDataExport
      summary: Get export status and short-lived download URL
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/consents:
    get:
      tags: [Me]
      operationId: listConsents
      summary: List the latest state of each consent
      responses:
        '200':
          description: Consents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/consents/{consentCode}:
    parameters:
      - name: consentCode
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentCode' }
    put:
      tags: [Me]
      operationId: setConsent
      summary: Grant or revoke a consent
      description: |
        Appends a consent record (append-only history). Revoking `SAVE_AI_HISTORY` stops new
        history writes and offers deletion; revoking `PAYMENT_MANDATE` cancels linked mandates.
        `TERMS_ACCEPTANCE` and `PRIVACY_NOTICE` cannot be revoked (delete the account instead).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentUpdate' }
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Config
  /api/v1/config:
    get:
      tags: [Config]
      operationId: getClientConfig
      summary: Get remote configuration and evaluated feature flags
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      responses:
        '200':
          description: Configuration for this client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfig' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/ai/capabilities:
    get:
      tags: [Config]
      operationId: getAiCapabilities
      summary: List available AI tasks and language pairs
      description: Drives client UI. A pair is listed only when an enabled capability exists; marketing must use `qualityTier`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Capability matrix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCapabilities' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Languages
  /api/v1/languages:
    get:
      tags: [Languages]
      operationId: listLanguages
      summary: List supported languages and scripts
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Language catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Language' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/languages/{languageCode}/transliteration-profiles:
    parameters:
      - $ref: '#/components/parameters/LanguageCodePath'
    get:
      tags: [Languages]
      operationId: listTransliterationProfiles
      summary: List ACTIVE transliteration profiles for a language
      description: Profiles are metadata; mappings live in signed TRANSLITERATION_RULES resources executed on-device.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransliterationProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/language-resources:
    get:
      tags: [Languages]
      operationId: listLanguageResources
      summary: List signed language-resource manifests for this client
      description: |
        Returns manifests compatible with the platform, app version and release channel, filtered
        by staged-rollout bucket. Clients verify the Ed25519 manifest signature against pinned
        keys **and** the artifact SHA-256 before atomically activating a resource; the last
        known-good version is kept for rollback. Delta resources name `baseResourceId`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
        - name: appVersion
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/ReleaseChannel' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ResourceType' }
        - name: languageCode
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Manifests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LanguageResourceManifest' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/language-resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Languages]
      operationId: getLanguageResource
      summary: Get one signed resource manifest
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanguageResourceManifest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resource-signing-keys:
    get:
      tags: [Languages]
      operationId: listResourceSigningKeys
      summary: List resource-signing public keys (for rotation)
      description: |
        Clients ship with pinned keys; this endpoint only announces *additional* keys signed by a
        currently pinned key (`endorsementSignature`) so rotation needs no app release.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Signing keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SigningKey' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Preferences
  /api/v1/me/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Get user preferences
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replacePreferences
      summary: Replace user preferences
      description: Optimistic concurrency via `revision`; a stale revision returns 409 `REVISION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/typing-languages:
    get:
      tags: [Preferences]
      operationId: getTypingLanguages
      summary: Get enabled typing languages and per-language input modes
      responses:
        '200':
          description: Typing languages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replaceTypingLanguages
      summary: Replace the typing-language list, order and input modes
      description: |
        Synchronises preferences only. The server resolves `transliterationProfileCode` to an
        ACTIVE profile of the same language (`PROFILE_NOT_ACTIVE` otherwise). The keyboard caches
        the result and **never calls the API on a keypress**; conversion is local.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
            example:
              revision: 3
              languages:
                - languageCode: am
                  enabled: true
                  isPrimary: true
                  sortOrder: 10
                  inputMode: PHONETIC_LATIN_TO_NATIVE
                  transliterationProfileCode: AM_PHONETIC_QWERTY_TO_ETHIOPIC
                  conversionTrigger: LIVE_COMPOSING
                  showTransliterationCandidates: true
                  unknownTokenBehavior: PRESERVE_LATIN
                - languageCode: en
                  enabled: true
                  isPrimary: false
                  sortOrder: 20
                  inputMode: LATIN_PASSTHROUGH
                  conversionTrigger: LIVE_COMPOSING
                  showTransliterationCandidates: false
                  unknownTokenBehavior: PRESERVE_LATIN
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypingLanguagesDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/me/destination-profiles:
    get:
      tags: [Preferences]
      operationId: listDestinationProfiles
      summary: List destination profiles
      description: |
        Destination profiles replace per-contact preferences: the keyboard cannot know the
        recipient, so the user picks a named profile ("Mum — Amharic, honorific") from the
        destination chip. Labels travel over TLS and are encrypted at rest with the user data key.
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DestinationProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Preferences]
      operationId: createDestinationProfile
      summary: Create a destination profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DestinationProfileInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/me/destination-profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [Preferences]
      operationId: updateDestinationProfile
      summary: Replace a destination profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DestinationProfileInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Preferences]
      operationId: deleteDestinationProfile
      summary: Delete a destination profile
      description: App rules that point at this profile are removed too.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/app-destination-rules:
    get:
      tags: [Preferences]
      operationId: getAppDestinationRules
      summary: Get Android per-app destination rules
      description: |
        Android only (`EditorInfo.packageName`); iOS does not reliably expose the host app.
        The client computes `appPackageHmac = HMAC-SHA256(perUserRuleKey, packageName)`; the
        server never receives plaintext package names.
      responses:
        '200':
          description: Rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Preferences]
      operationId: replaceAppDestinationRules
      summary: Replace Android per-app destination rules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDestinationRulesDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/style-profiles/{languageCode}:
    parameters:
      - $ref: '#/components/parameters/LanguageCodePath'
    get:
      tags: [Preferences]
      operationId: getStyleProfile
      summary: Get the personal writing-style profile for a language
      responses:
        '200':
          description: Style profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Preferences]
      operationId: replaceStyleProfile
      summary: Replace the personal writing-style profile for a language
      description: |
        Requires the `PERSONAL_STYLE` entitlement. Only explicit settings and structured
        on-device-computed `learnedHints` are accepted — never raw writing samples.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleProfile' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/dictionary/changes:
    get:
      tags: [Preferences]
      operationId: pullDictionaryChanges
      summary: Pull personal-dictionary changes since a sync token
      description: Requires `DICTIONARY_SYNC` consent and entitlement. Words are decrypted server-side for delivery over TLS only.
      parameters:
        - name: since
          in: query
          description: Opaque sync token from a previous response; omit for a full sync.
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryChangesPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Preferences]
      operationId: pushDictionaryChanges
      summary: Push a batch of personal-dictionary changes
      description: Idempotent per `clientChangeId`. Stored as ciphertext plus keyed HMAC for de-duplication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryChangesRequest' }
      responses:
        '200':
          description: Batch result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryChangesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- AI
  /api/v1/ai/translate:
    post:
      tags: [AI]
      operationId: translateText
      summary: Translate explicitly submitted text
      description: |
        Feature `TRANSLATE`. Only the submitted text is processed; it is not persisted unless
        `saveToHistory` is true **and** history is enabled. The result is shown for review and
        inserted only after user confirmation; the host app sends the message.

        Cultural intelligence: Amharic and Tigrinya inflect for addressee gender and formality.
        When `addressee.gender` is `UNKNOWN` the response may include gender `alternatives` and an
        `AMBIGUITY` note. Calendar/time/numeral options convert dates and times (e.g. Ethiopian
        clock hours count from 06:00).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateRequest' }
            example:
              text: እባክህ ነገ ጠዋት 3 ሰዓት ላይ ደውልልኝ።
              sourceLanguage: am
              destinationLanguage: en
              style: NATURAL
              preserveNames: true
              culturalOptions:
                calendar: GREGORIAN
                timeNotation: INTERNATIONAL
                numerals: WESTERN
                adaptIdioms: true
      responses:
        '200':
          description: Translation for review.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslateResponse' }
              example:
                requestId: 0193a5c2-6f1e-7c3a-9b2d-4e5f6a7b8c9d
                sourceLanguage: am
                detectedSourceLanguage: am
                detectionConfidence: 0.98
                destinationLanguage: en
                translatedText: Please call me tomorrow at 9 a.m.
                alternatives: []
                notes:
                  - type: CULTURAL
                    message: "Converted Ethiopian time '3 ሰዓት ጠዋት' to 9 a.m."
                qualityTier: BETA
                replayed: false
                usage:
                  featureCode: TRANSLATE
                  unitsCharged: 1
                  unit: REQUEST
                  usageSource: PLAN_ALLOWANCE
                  remaining: 9
                  resetsAt: '2026-11-17T21:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/transform:
    post:
      tags: [AI]
      operationId: transformText
      summary: Grammar, rewrite, tone, summarise, explain or script-convert text
      description: |
        One endpoint for writing tasks; `task` selects the feature code
        (`GRAMMAR_CORRECTION`, `REWRITE`, `TONE_ADJUST`, `SUMMARIZE`, `EXPLAIN_TEXT`,
        `SCRIPT_CONVERSION`). User text is treated strictly as data, never as instructions.

        `SCRIPT_CONVERSION` is AI-assisted whole-sentence conversion of romanised Amharic/Tigrinya
        to Ge'ez with context; it is distinct from local keystroke transliteration.

        **Streaming (companion app only):** send `Accept: text/event-stream` to receive Server-Sent
        Events: `event: delta` (`{"text":"..."}`), `event: done` (a full `TransformResponse`),
        `event: error` (a `Problem`). Usage is settled on `done`; a dropped stream before `done`
        releases the reservation. The keyboard uses JSON with an 8 s client timeout.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransformRequest' }
            example:
              task: TONE_ADJUST
              text: ሰላም፣ ሪፖርቱን ቶሎ ላክልኝ።
              language: am
              options:
                tone: HONORIFIC
              addressee:
                formality: HONORIFIC
                gender: UNKNOWN
      responses:
        '200':
          description: Result for review (JSON or SSE stream).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransformResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE stream with `delta`, `done` and `error` events.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/replies:
    post:
      tags: [AI]
      operationId: suggestReplies
      summary: Suggest replies to text the user explicitly supplied
      description: |
        Feature `SMART_REPLY`. `contextText` must come from an explicit user action (paste,
        selection, share sheet). The keyboard never reads other apps' messages.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepliesRequest' }
      responses:
        '200':
          description: Suggestions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepliesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/drafts:
    post:
      tags: [AI]
      operationId: draftDocument
      summary: Draft a professional email, letter or similar document
      description: Feature `DRAFT_DOCUMENT`. Supports SSE streaming as described for `/ai/transform`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftRequest' }
      responses:
        '200':
          description: Draft (JSON or SSE stream).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE stream with `delta`, `done` and `error` events.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/detect-language:
    post:
      tags: [AI]
      operationId: detectLanguage
      summary: Detect language(s) of explicitly submitted text
      description: Feature `DETECT_LANGUAGE` — unmetered, rate-limited. Prefer the on-device language-ID model when installed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectLanguageRequest' }
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectLanguageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/ai/feedback:
    post:
      tags: [AI]
      operationId: submitAiFeedback
      summary: Rate an AI result
      description: |
        Stores rating and reason codes linked to `aiRequestId`. A free-text `comment` is accepted
        only with a granted `FEEDBACK_TEXT` consent and is encrypted. No input/output text is
        attached unless `includeContent` is true and the same consent is granted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '202': { description: Feedback recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- History
  /api/v1/me/history:
    get:
      tags: [History]
      operationId: listHistory
      summary: List opt-in AI history items
      parameters:
        - name: favorite
          in: query
          schema: { type: boolean }
        - name: featureCode
          in: query
          schema: { $ref: '#/components/schemas/FeatureCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History page (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [History]
      operationId: clearHistory
      summary: Delete all history items
      responses:
        '204': { description: All history deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/history/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [History]
      operationId: getHistoryItem
      summary: Get one history item
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [History]
      operationId: updateHistoryItem
      summary: Mark or unmark a history item as favourite
      description: Favourites are exempt from automatic retention expiry until unmarked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HistoryItemUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [History]
      operationId: deleteHistoryItem
      summary: Delete one history item
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Speech
  /api/v1/speech/upload-sessions:
    post:
      tags: [Speech]
      operationId: createAudioUploadSession
      summary: Get a short-lived signed URL for an audio upload
      description: |
        For audio longer than the inline limit. The object lives in a private bucket with a
        lifecycle rule and is deleted right after processing (or at `expiresAt` + 1 h at most).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSessionRequest' }
      responses:
        '201':
          description: Upload session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speech/transcriptions:
    post:
      tags: [Speech]
      operationId: createTranscription
      summary: Transcribe speech to text
      description: |
        Feature `SPEECH_TO_TEXT`, metered in seconds of provider-confirmed audio, rounded up to a
        whole second per request. Inline audio (≤ 30 s) usually completes synchronously (200);
        uploaded audio returns a job (202). Audio and transcripts are not retained by default;
        job results are held in an encrypted ephemeral store for at most 10 minutes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscriptionRequest' }
      responses:
        '200':
          description: Completed synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '202':
          description: Job accepted; poll the job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/transcriptions/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Speech]
      operationId: getSpeechJob
      summary: Get a speech job status and result
      description: Used for both transcription and speech-translation jobs. Results expire at `resultExpiresAt`.
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/speech/translations:
    post:
      tags: [Speech]
      operationId: createSpeechTranslation
      summary: Transcribe and translate speech (optionally speak the result)
      description: Feature `SPEECH_TRANSLATE` (seconds). If `synthesizeSpeech` is true, `TEXT_TO_SPEECH` characters are also charged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechTranslationRequest' }
      responses:
        '200':
          description: Completed synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/synthesis:
    post:
      tags: [Speech]
      operationId: synthesizeSpeech
      summary: Text-to-speech and pronunciation playback
      description: |
        Feature `TEXT_TO_SPEECH`, metered in characters. `Accept: application/json` returns a
        short-lived audio URL (≤ 10 min); `Accept: audio/mpeg` or `audio/ogg` streams audio.
        `pronunciationMode` also returns a Latin romanisation produced by the reverse
        transliteration profile.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynthesisRequest' }
      responses:
        '200':
          description: Synthesised speech.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisResponse' }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/ogg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/speech/voices:
    get:
      tags: [Speech]
      operationId: listVoices
      summary: List available TTS voices
      parameters:
        - name: languageCode
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Voices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Voice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Realtime
  /api/v1/realtime/sessions:
    post:
      tags: [Realtime]
      operationId: createRealtimeSession
      summary: Start a voice-to-voice or live-conversation session
      description: |
        Features `VOICE_TO_VOICE` / `LIVE_CONVERSATION`, metered in server-measured seconds of
        session audio. Companion app (and Android keyboard dictation) only. Returns a single-use
        `ticket` (valid 60 s) for the WebSocket `websocketUrl`; pass it as the
        `Sec-WebSocket-Protocol` value `ticket.<ticket>`. Allowance is reserved in 60 s blocks and
        settled on close.

        **WebSocket protocol**
        - Client → server *binary* frames: audio per `audioInput` (default PCM16 little-endian,
          16 kHz, mono, 20–100 ms frames).
        - Client → server *text* frames (`RealtimeClientMessage`): `start`, `speaker_switch`
          (manual turn change in conversation mode), `stop`, `ping`.
        - Server → client *text* frames (`RealtimeServerMessage`): `partial_transcript`,
          `final_transcript`, `translation`, `tts_audio` (base64 chunk; binary frames may be used
          when `audioOutput.transport = BINARY`), `usage`, `error`, `session_ended`, `pong`.
        - The server closes with 4001 (ticket invalid), 4002 (quota exhausted), 4003 (max
          duration), 4500 (provider failure). No audio or transcript is persisted.
      x-websocket-protocol:
        subprotocolPrefix: ticket.
        clientTextMessage: { $ref: '#/components/schemas/RealtimeClientMessage' }
        serverTextMessage: { $ref: '#/components/schemas/RealtimeServerMessage' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealtimeSessionRequest' }
            example:
              mode: LIVE_CONVERSATION
              languageA: am
              languageB: en
              synthesizeSpeech: true
              maxDurationSeconds: 900
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/realtime/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Realtime]
      operationId: getRealtimeSession
      summary: Get realtime session status and billed seconds
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/realtime/sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Realtime]
      operationId: endRealtimeSession
      summary: End a realtime session and settle usage
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Entitlements
  /api/v1/me/entitlements:
    get:
      tags: [Entitlements]
      operationId: getEntitlements
      summary: Get effective plan, allowances and a signed entitlement token
      description: |
        Effective plan = highest `planRank` among ACTIVE/GRACE_PERIOD subscriptions and
        organisation seats (allowances are not summed). `entitlementToken` is an Ed25519 JWS
        valid 24 h with 72 h offline grace; clients may use it **only** for offline gates such as
        on-device premium models. Server-metered features are always re-checked server-side.
      responses:
        '200':
          description: Entitlements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
              example:
                plan:
                  planCode: PREMIUM
                  displayName: Premium
                  planRank: 10
                  source: SUBSCRIPTION
                  effectiveUntil: '2026-12-17T08:00:00Z'
                features:
                  - featureCode: TRANSLATE
                    accessEnabled: true
                    includedUnits: 600
                    unit: REQUEST
                    resetPeriod: MONTHLY
                    used: 42
                    remaining: 558
                    resetsAt: '2026-12-17T08:00:00Z'
                  - featureCode: ON_DEVICE_AI_MODELS
                    accessEnabled: true
                    unit: NONE
                    resetPeriod: NONE
                creditBalance: 250
                entitlementToken:
                  jws: eyJhbGciOiJFZERTQSIsImtpZCI6ImVudC0yMDI2LTExIn0.eyJzdWIiOiIuLi4ifQ.c2ln
                  keyId: ent-2026-11
                  expiresAt: '2026-11-18T08:00:00Z'
                  offlineGraceUntil: '2026-11-21T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/usage:
    get:
      tags: [Entitlements]
      operationId: getUsage
      summary: Get usage per feature for current and recent periods
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/credits:
    get:
      tags: [Entitlements]
      operationId: getCredits
      summary: Get AI credit balance and lots
      responses:
        '200':
          description: Credit summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/credits/transactions:
    get:
      tags: [Entitlements]
      operationId: listCreditTransactions
      summary: List AI credit ledger entries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger page (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditTransaction' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Billing
  /api/v1/billing/options:
    get:
      tags: [Billing]
      operationId: getBillingOptions
      summary: Get approved purchase flow, products and payment methods
      description: |
        Evaluates `billing_market_channel_policies` (missing/expired/REVIEW_REQUIRED/BLOCKED
        ⇒ `purchaseUiAllowed = false`, `purchaseFlow = NONE`). Methods are returned only when the
        provider, merchant account, base method, account method, adapter and policy gates all pass.
        Only public method codes are exposed — never merchant-account IDs or secret references.
        The market is decided from account/storefront and user-selected country, not IP alone.
      parameters:
        - name: marketCountry
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: clientPlatform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
        - name: distributionChannel
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DistributionChannel' }
        - name: storefront
          in: query
          description: Store storefront country reported by the store SDK, when available.
          schema: { type: string, maxLength: 8 }
      responses:
        '200':
          description: Options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/billing/products:
    get:
      tags: [Billing]
      operationId: listBillingProducts
      summary: List sellable products and active prices for a market and channel
      parameters:
        - name: marketCountry
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: salesChannel
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SalesChannel' }
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/billing/promotions/validate:
    post:
      tags: [Billing]
      operationId: validatePromotion
      summary: Check a promotion code against a product and market
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionValidateRequest' }
      responses:
        '200':
          description: Validation result (invalid codes return `valid = false`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/billing/orders:
    post:
      tags: [Billing]
      operationId: createPaymentOrder
      summary: Create a server-priced payment order
      description: |
        The server resolves the active price for product, period, market, channel and renewal
        model; the client never supplies an amount. `amount.total = list − discount + (tax if
        EXCLUSIVE)`. Upgrades (`upgradeFromSubscriptionId`) apply the unused value of the
        current term as a server-computed discount. Store purchases do **not** use orders — see
        `/billing/store-purchases`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example:
              productCode: PLAN_PREMIUM
              billingPeriod: MONTHLY
              marketCountry: ET
              salesChannel: ANDROID_DIRECT
              renewalPreference: MANUAL_RENEW
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
              example:
                orderId: 0193a5c2-7a10-7d11-8e2f-1a2b3c4d5e6f
                orderReference: EAK-ET-2611-7Q4M2X
                orderType: SUBSCRIPTION_PURCHASE
                status: AWAITING_PAYMENT
                productCode: PLAN_PREMIUM
                billingPeriod: MONTHLY
                renewalModel: MANUAL_RENEW
                marketCountry: ET
                salesChannel: ANDROID_DIRECT
                taxBehavior: INCLUSIVE
                amounts:
                  list: { amountMinor: 29900, currency: ETB, exponent: 2 }
                  discount: { amountMinor: 0, currency: ETB, exponent: 2 }
                  tax: { amountMinor: 3900, currency: ETB, exponent: 2 }
                  total: { amountMinor: 29900, currency: ETB, exponent: 2 }
                expiresAt: '2026-11-17T09:30:00Z'
                allowedMethods:
                  - methodCode: CHAPA_TELEBIRR
                    providerCode: CHAPA
                    displayName: telebirr
                    methodType: MOBILE_MONEY
                    supportsAutoRenew: false
                    requiresRedirect: true
                createdAt: '2026-11-17T09:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/billing/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Billing]
      operationId: getPaymentOrder
      summary: Get order status and fulfilment
      description: Poll after returning from checkout. A redirect/success screen is never proof of payment.
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: cancelPaymentOrder
      summary: Cancel an unpaid order
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/billing/orders/{orderId}/attempts:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: createPaymentAttempt
      summary: Start a payment attempt with an approved method
      description: |
        The server resolves the provider, merchant account and account-enabled method from the
        public `methodCode` and the order's market/currency/environment. Retrying with another
        method creates a new attempt on the same order (never a duplicate entitlement).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttemptRequest' }
      responses:
        '201':
          description: Attempt started; follow `nextAction`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/billing/orders/{orderId}/attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Billing]
      operationId: getPaymentAttempt
      summary: Get payment attempt status
      responses:
        '200':
          description: Attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/orders/{orderId}/manual-transfer-claims:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Billing]
      operationId: submitManualTransferClaim
      summary: Submit a bank-transfer reference for reconciliation
      description: |
        A claim only. Premium is never granted from a screenshot; finance reconciles against bank
        data or an authorised reviewer approves. Evidence is stored privately with restricted access.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ManualTransferClaimForm' }
            encoding:
              evidence:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '201':
          description: Claim submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualTransferClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/billing/mandates:
    post:
      tags: [Billing]
      operationId: createPaymentMandate
      summary: Start a recurring-payment mandate after explicit consent
      description: |
        Requires a granted, unrevoked `PAYMENT_MANDATE` consent record (`consentRecordId`) and an
        account-level method approved for auto-renew (`MANDATE_NOT_SUPPORTED` otherwise). A prior
        one-time charge is never treated as a mandate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMandateRequest' }
      responses:
        '201':
          description: Mandate created; follow `nextAction` to sign it with the provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/billing/mandates/{mandateId}:
    parameters:
      - $ref: '#/components/parameters/MandateId'
    delete:
      tags: [Billing]
      operationId: revokePaymentMandate
      summary: Revoke a mandate and stop future debits
      description: Calls provider cancellation where supported and records the outcome; no further debits are scheduled either way.
      responses:
        '200':
          description: Mandate revoked (or cancellation pending at provider).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/store-purchases:
    post:
      tags: [Billing]
      operationId: verifyStorePurchase
      summary: Verify and link a Google Play or App Store purchase
      description: |
        Verifies with the Play Developer API or App Store Server API, checks `appAccountToken` /
        obfuscated account ID matches the caller, acknowledges Google purchases (within 3 days or
        Google refunds them) and fulfils the same internal subscription/credit records.
        Re-submitting the same purchase is idempotent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorePurchaseRequest' }
      responses:
        '200':
          description: Verified and linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorePurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/subscriptions:
    get:
      tags: [Billing]
      operationId: listSubscriptions
      summary: List current and past subscriptions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/subscriptions/{subscriptionId}/renew:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Billing]
      operationId: renewSubscription
      summary: Create a manual-renewal order for the next term
      description: The new term starts at the current period end (stacking). Not available for STORE_MANAGED subscriptions.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewSubscriptionRequest' }
      responses:
        '201':
          description: Renewal order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/me/subscriptions/{subscriptionId}/cancel-renewal:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Billing]
      operationId: cancelSubscriptionRenewal
      summary: Turn off automatic renewal
      description: |
        For AUTO_RENEW, cancels the mandate where supported and sets `cancelAtPeriodEnd`. For
        STORE_MANAGED, returns `manageUrl` — store subscriptions must be cancelled in the store.
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/receipts:
    get:
      tags: [Billing]
      operationId: listReceipts
      summary: List payment receipts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Receipts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Billing]
      operationId: getReceipt
      summary: Get one receipt
      responses:
        '200':
          description: Receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Webhooks
  /api/v1/billing/webhooks/{providerCode}/{accountCode}:
    parameters:
      - $ref: '#/components/parameters/ProviderCodePath'
      - name: accountCode
        in: path
        required: true
        description: Merchant account code; selects the account-specific webhook secret.
        schema: { type: string, maxLength: 60, pattern: '^[A-Za-z0-9_-]+$' }
    post:
      tags: [Webhooks]
      operationId: receiveGatewayWebhook
      summary: Receive a payment-gateway webhook
      description: |
        No bearer token. Processing:
        1. Verify the provider signature with the merchant account's webhook secret (and network
           allowlist where supported). Invalid ⇒ 401, event stored as INVALID, not processed.
        2. Persist idempotently on `(provider, external_event_id)`; providers without event IDs
           use `sha256(payload)`. Store only a redacted payload and its hash.
        3. Acknowledge with 200 immediately; process asynchronously via the outbox.
        4. Fetch the transaction from the provider API and match order reference, amount,
           currency, merchant account, method and environment before fulfilment. The webhook body
           alone never grants anything.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RawProviderEvent' }
      responses:
        '200':
          description: Received (including duplicates).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/billing/store-notifications/{providerCode}:
    parameters:
      - name: providerCode
        in: path
        required: true
        schema:
          type: string
          enum: [GOOGLE_PLAY, APPLE_APP_STORE]
    post:
      tags: [Webhooks]
      operationId: receiveStoreNotification
      summary: Receive Google Play RTDN or App Store Server Notifications V2
      description: |
        Google: Pub/Sub push with OIDC-authenticated push subscription (verify the Google-signed
        JWT audience). Apple: `signedPayload` JWS verified against Apple's certificate chain.
        Stored idempotently, acknowledged with 200, then verified against the Play Developer API /
        App Store Server API before any `store_purchases` or subscription change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RawProviderEvent' }
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Authentication of the notification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

