    get:
      tags: [Glossaries]
      operationId: getGlossary
      summary: Get a glossary
      responses:
        '200':
          description: Glossary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Glossary' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Glossaries]
