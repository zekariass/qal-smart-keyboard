  # ---------------------------------------------------------------- Partner API
  /partner/v1/translate:
    post:
      tags: [Partner]
      operationId: partnerTranslate
      summary: Translate text (partner API)
      description: |
        Same engine and guardrails as `/api/v1/ai/translate`; usage is charged to the API client's
        organisation. Organisations with `zeroDataRetentionRequired` are routed only to providers
        flagged zero-data-retention (`ZERO_RETENTION_UNAVAILABLE` otherwise).
      security:
        - partnerApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateCoreRequest' }
      responses:
        '200':
          description: Translation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /partner/v1/transform:
    post:
      tags: [Partner]
      operationId: partnerTransform
      summary: Grammar, rewrite, tone, summarise, explain or script-convert (partner API)
      security:
        - partnerApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransformRequest' }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransformResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /partner/v1/transliterate:
    post:
      tags: [Partner]
      operationId: partnerTransliterate
      summary: Deterministic Latin ↔ Ge'ez transliteration (partner API)
      description: |
        Runs the same Rust `keyboard-core` and signed profile versions as the mobile keyboards,
        so output is identical for the same profile/version/input. No AI provider is involved.
        Billed per character under the partner contract.
      security:
        - partnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransliterateRequest' }
            example:
              text: selam new
              languageCode: am
              profileCode: AM_PHONETIC_QWERTY_TO_ETHIOPIC
              direction: LATIN_TO_NATIVE
              returnCandidates: true
              maxCandidates: 3
      responses:
        '200':
          description: Transliteration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransliterateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /partner/v1/detect-language:
    post:
      tags: [Partner]
      operationId: partnerDetectLanguage
      summary: Detect language(s) (partner API)
      security:
        - partnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectLanguageRequest' }
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectLanguageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /partner/v1/speech/transcriptions:
    post:
      tags: [Partner]
      operationId: partnerCreateTranscription
      summary: Transcribe speech (partner API)
      description: Inline audio ≤ 30 s, or an `audioUrl` the partner hosts (HTTPS, fetched once, not retained).
      security:
        - partnerApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerTranscriptionRequest' }
      responses:
        '200':
          description: Completed synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /partner/v1/speech/transcriptions/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Partner]
      operationId: partnerGetTranscription
      summary: Get a transcription job (partner API)
      security:
        - partnerApiKey: []
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeechJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /partner/v1/usage:
    get:
      tags: [Partner]
      operationId: partnerGetUsage
      summary: Get usage for the calling API client
      security:
        - partnerApiKey: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /partner/v1/languages:
    get:
      tags: [Partner]
      operationId: partnerListLanguages
      summary: List languages, profiles and capabilities available to the API client
      security:
        - partnerApiKey: []
      responses:
        '200':
          description: Languages and capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerLanguages' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (10–15 min) user access token from `/auth/*`. Guest tokens carry `accountType = GUEST`.
    partnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key (sk_live_… / sk_test_…)
      description: |
        Partner API key sent as `Authorization: Bearer sk_live_…`. Stored server-side as prefix +
        SHA-256 hash; scoped (translate, transform, transliterate, detect_language, speech,
        usage_read), rate-limited per key and optionally IP-restricted. `sk_test_` keys hit
        sandbox providers and are not billed.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, unique per logical operation, retained for 24 h per user/API client.
        - **At-most-once charging:** usage, credits, orders, attempts, mandates and store fulfilment
          are applied at most once per key.
        - **AI results:** a retry with the same key and body returns the original result from an
          encrypted ephemeral cache (≤ 10 min, `replayed: true`). After cache expiry the request is
          recomputed **without a second charge**. PostgreSQL never stores AI text.
        - Reusing a key with a different body returns 409 `IDEMPOTENCY_KEY_REUSED`; an in-flight
          duplicate returns 409 `REQUEST_IN_PROGRESS` with `Retry-After`.
      schema: { type: string, format: uuid }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema: { $ref: '#/components/schemas/ClientPlatformEnum' }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Semantic app version, e.g. `2.0.3`.
      schema: { type: string, maxLength: 40 }
    ClientSurface:
      name: X-Client-Surface
      in: header
      required: false
      description: Which client surface made the call (affects timeouts, streaming and analytics).
      schema:
        type: string
        enum: [KEYBOARD, COMPANION]
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: UI locale for messages (e.g. `am`, `ti`, `om`, `en`).
      schema: { type: string, maxLength: 35 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous `nextCursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LanguageCodePath:
      name: languageCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LanguageCode' }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MandateId:
      name: mandateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderCodePath:
      name: providerCode
      in: path
      required: true
      description: Stable payment provider code (e.g. CHAPA, ARIFPAY, TELEBIRR_DIRECT).
      schema: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]*$' }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GlossaryId:
      name: glossaryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    X-Correlation-Id:
      description: Correlation ID for support and tracing; also returned in Problem bodies.
      schema: { type: string, maxLength: 100 }
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema: { type: integer }
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed or invalid request (`VALIDATION_FAILED`, `INPUT_TOO_LONG`, `LANGUAGE_NOT_SUPPORTED`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/validation-failed
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            correlationId: d8d14c6e-f6da-4c1b-8be8-6be9b5c4f1f5
            errors:
              - field: destinationLanguage
                code: REQUIRED
                message: destinationLanguage is required.
    Unauthorized:
      description: Missing/invalid/expired credentials (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `REFRESH_TOKEN_REUSED`, `OTP_INVALID`, `API_KEY_INVALID`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed (`FEATURE_NOT_ENTITLED`, `CONSENT_REQUIRED`, `GUEST_NOT_ALLOWED`, `ATTESTATION_REQUIRED`, `BILLING_POLICY_DENIED`, `API_SCOPE_MISSING`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is not visible to the caller (`NOT_FOUND`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (`IDEMPOTENCY_KEY_REUSED`, `REQUEST_IN_PROGRESS`, `REVISION_CONFLICT`, `ORDER_NOT_PAYABLE`, `STORE_PURCHASE_ALREADY_LINKED`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Semantically invalid for current state (`PROFILE_NOT_ACTIVE`, `PRICE_NOT_AVAILABLE`, `PAYMENT_METHOD_UNAVAILABLE`, `MANDATE_NOT_SUPPORTED`, `STORE_PURCHASE_INVALID`, `OUTPUT_GUARDRAIL_FAILED`, ...).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: |
        `RATE_LIMITED` (short-term abuse/rate limit; honour `Retry-After`) or `QUOTA_EXCEEDED`
        (plan allowance and credits exhausted; body is a `QuotaExceededProblem` with reset time and
        upgrade/credit options).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/QuotaExceededProblem'
              - $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/quota-exceeded
            title: Daily translation allowance used
            status: 429
            code: QUOTA_EXCEEDED
            correlationId: 6a1f0c2e-3b4d-4e5f-8a9b-0c1d2e3f4a5b
            featureCode: TRANSLATE
            resetAt: '2026-11-17T21:00:00Z'
            creditBalance: 0
            upgradeOptions:
              - type: PLAN
                productCode: PLAN_PREMIUM
              - type: CREDIT_PACK
                productCode: CREDITS_500
    ServiceUnavailable:
      description: Provider or capability temporarily unavailable (`PROVIDER_UNAVAILABLE`, `PROVIDER_TIMEOUT`, `LANGUAGE_PAIR_UNAVAILABLE`, `ZERO_RETENTION_UNAVAILABLE`). No usage is charged.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/language-pair-unavailable
            title: Translation is not currently available for this language pair.
            status: 503
            code: LANGUAGE_PAIR_UNAVAILABLE
            correlationId: d8d14c6e-f6da-4c1b-8be8-6be9b5c4f1f5
            sourceLanguage: om
            destinationLanguage: ti

  schemas:
    # ------------------------------------------------------------ primitives
    LanguageCode:
      type: string
      description: BCP 47-compatible language tag (e.g. `am`, `ti`, `om`, `en`, `ti-ER`).
      pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
      maxLength: 35
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: '^[A-Z]{2}$'
    CurrencyCode:
      type: string
      description: ISO 4217 currency code.
      pattern: '^[A-Z]{3}$'
    NextCursor:
      type: string
      description: Cursor for the next page; absent when there are no more results.
      maxLength: 512
    ClientPlatformEnum:
      type: string
      enum: [ANDROID, IOS, WEB]
    FeatureCode:
      type: string
      description: Canonical feature codes (`feature_catalog`). Typing features are never entitlement-gated.
      enum:
        - OFFLINE_TYPING
        - DIRECT_SCRIPT_LAYOUT
        - PHONETIC_TRANSLITERATION
        - OFFLINE_SUGGESTIONS
        - DETECT_LANGUAGE
        - TRANSLATE
        - GRAMMAR_CORRECTION
        - REWRITE
        - TONE_ADJUST
        - SMART_REPLY
        - SUMMARIZE
        - EXPLAIN_TEXT
        - DRAFT_DOCUMENT
        - SCRIPT_CONVERSION
        - SPEECH_TO_TEXT
        - SPEECH_TRANSLATE
        - TEXT_TO_SPEECH
        - VOICE_TO_VOICE
        - LIVE_CONVERSATION
        - HISTORY_SYNC
        - DICTIONARY_SYNC
        - PERSONAL_STYLE
        - CUSTOM_GLOSSARY
        - ON_DEVICE_AI_MODELS
    MeteringUnit:
      type: string
      description: REQUEST; SECOND (audio, rounded up per request to a whole second); CHARACTER (TTS); NONE (boolean access).
      enum: [REQUEST, SECOND, CHARACTER, NONE]
    ResetPeriod:
      type: string
      enum: [NONE, DAILY, WEEKLY, MONTHLY, YEARLY]
    QualityTier:
      type: string
      enum: [UNVERIFIED, EXPERIMENTAL, BETA, PRODUCTION]
    ExecutionMode:
      type: string
      enum: [SERVER, ON_DEVICE, HYBRID]
    Money:
      type: object
      description: Integer minor units with explicit exponent (ETB 2, UGX 0). `29900`/ETB/2 = 299.00 ETB.
      required: [amountMinor, currency, exponent]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 0 }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exponent: { type: integer, minimum: 0, maximum: 4 }
    Addressee:
      type: object
      description: |
        Who the text is addressed to. Amharic/Tigrinya verbs and pronouns inflect for gender and
        formality; `HONORIFIC` selects respectful forms (e.g. እርስዎ). `UNKNOWN` gender may yield
        alternatives.
      properties:
        formality:
          type: string
          enum: [INFORMAL, FORMAL, HONORIFIC]
          default: INFORMAL
        gender:
          type: string
          enum: [MASCULINE, FEMININE, PLURAL, UNKNOWN]
          default: UNKNOWN
    CulturalOptions:
      type: object
      properties:
        calendar:
          type: string
          enum: [GREGORIAN, ETHIOPIAN]
          description: Convert dates to this calendar in the output.
        timeNotation:
          type: string
          enum: [INTERNATIONAL, ETHIOPIAN]
          description: ETHIOPIAN counts clock hours from 06:00 (06:00 = 12 ሰዓት / 0).
        numerals:
          type: string
          enum: [WESTERN, ETHIOPIC]
        adaptIdioms:
          type: boolean
          default: true
          description: Replace idioms with natural equivalents and explain them in `notes`.
    AiNote:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [CULTURAL, AMBIGUITY, GLOSSARY_APPLIED, NAME_PRESERVED, QUALITY, SAFETY]
        message: { type: string, maxLength: 500 }
        span:
          type: object
          properties:
            start: { type: integer, minimum: 0 }
            end: { type: integer, minimum: 0 }
    UsageSummary:
      type: object
      required: [featureCode, unitsCharged, unit, usageSource]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        unitsCharged: { type: integer, minimum: 0 }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
        usageSource:
          type: string
          enum: [PLAN_ALLOWANCE, AI_CREDITS, ORGANIZATION, PARTNER_CONTRACT, UNMETERED]
        remaining:
          type: integer
          description: Remaining plan allowance in this period (absent if unlimited/not applicable).
        creditBalance: { type: number, minimum: 0 }
        resetsAt: { type: string, format: date-time }

    # ------------------------------------------------------------ errors
    Problem:
      type: object
      description: RFC 9457 Problem Details with extension members.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri, description: 'Problem type URI, or `about:blank`.' }
        title: { type: string, description: "Short, safe, localised summary." }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: |
            Stable machine-readable code. Clients switch on `code`, never on `title`.
            VALIDATION_FAILED, INPUT_TOO_LONG, UNAUTHENTICATED, TOKEN_EXPIRED, REFRESH_TOKEN_REUSED,
            OTP_INVALID, OTP_EXPIRED, OTP_TOO_MANY_ATTEMPTS, EMAIL_ALREADY_REGISTERED,
            ATTESTATION_REQUIRED, ATTESTATION_FAILED, ACCOUNT_SUSPENDED, DELETION_PENDING,
            GUEST_NOT_ALLOWED, FORBIDDEN, NOT_FOUND, REVISION_CONFLICT, IDEMPOTENCY_KEY_REUSED,
            REQUEST_IN_PROGRESS, CONSENT_REQUIRED, FEATURE_NOT_ENTITLED, QUOTA_EXCEEDED,
            RATE_LIMITED, LANGUAGE_NOT_SUPPORTED, LANGUAGE_PAIR_UNAVAILABLE, PROFILE_NOT_ACTIVE,
            OUTPUT_GUARDRAIL_FAILED, CONTENT_REJECTED, PROVIDER_UNAVAILABLE, PROVIDER_TIMEOUT,
            ZERO_RETENTION_UNAVAILABLE, UPLOAD_EXPIRED, AUDIO_TOO_LONG, UNSUPPORTED_AUDIO_FORMAT,
            REALTIME_SESSION_LIMIT, BILLING_POLICY_DENIED, PRODUCT_NOT_AVAILABLE,
            PRICE_NOT_AVAILABLE, PROMOTION_INVALID, PAYMENT_METHOD_UNAVAILABLE, ORDER_NOT_PAYABLE,
            ORDER_EXPIRED, PAYMENT_VERIFICATION_FAILED, MANDATE_NOT_SUPPORTED,
            STORE_PURCHASE_INVALID, STORE_PURCHASE_ALREADY_LINKED, SUBSCRIPTION_NOT_RENEWABLE,
            SEAT_UNAVAILABLE, API_KEY_INVALID, API_SCOPE_MISSING, WEBHOOK_SIGNATURE_INVALID,
            APP_VERSION_UNSUPPORTED, INTERNAL_ERROR.
          pattern: '^[A-Z][A-Z0-9_]*$'
        correlationId: { type: string, maxLength: 100 }
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            required: [code, message]
            properties:
              field: { type: string, description: JSON Pointer or dotted path of the offending field. }
              code: { type: string }
              message: { type: string }
      additionalProperties: true
    QuotaExceededProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [featureCode]
          properties:
            featureCode: { $ref: '#/components/schemas/FeatureCode' }
            resetAt: { type: string, format: date-time }
            creditBalance: { type: number, minimum: 0 }
            upgradeOptions:
              type: array
              items:
                type: object
                required: [type, productCode]
                properties:
                  type:
                    type: string
                    enum: [PLAN, CREDIT_PACK]
                  productCode: { type: string }

    # ------------------------------------------------------------ auth
    AttestationNonce:
      type: object
      required: [nonce, expiresAt]
      properties:
        nonce: { type: string, minLength: 16, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
    AttestationEvidence:
      type: object
      required: [provider, token, nonce]
      properties:
        provider:
          type: string
          enum: [PLAY_INTEGRITY, APP_ATTEST]
        token:
          type: string
          maxLength: 16384
          writeOnly: true
          description: Play Integrity token, or App Attest attestation/assertion object (base64).
        keyId:
          type: string
          maxLength: 256
          description: App Attest key identifier (iOS only).
        nonce: { type: string, maxLength: 128 }
    AttestationResult:
      type: object
      required: [attestationStatus, checkedAt]
      properties:
        attestationStatus:
          type: string
          enum: [VALID, FAILED, UNSUPPORTED]
        checkedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    DeviceRegistration:
      type: object
      required: [installationId, platform]
      properties:
        installationId: { type: string, format: uuid, description: Random per-install ID; not a hardware identifier. }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        pushProvider:
          type: string
          enum: [FCM, APNS]
        pushToken: { type: string, maxLength: 4096, writeOnly: true }
    OtpStartRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          description: E.164 phone number.
          pattern: '^\+[1-9][0-9]{6,14}$'
        channel:
          type: string
          enum: [SMS, VOICE_CALL]
          default: SMS
        attestation: { $ref: '#/components/schemas/AttestationEvidence' }
    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, codeLength]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }
        codeLength: { type: integer, minimum: 4, maximum: 8 }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{4,8}$', writeOnly: true }
        ageConfirmed: { type: boolean, description: Required for new accounts (minimum digital age of consent). }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    OAuthExchangeRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken: { type: string, maxLength: 8192, writeOnly: true }
        nonce: { type: string, maxLength: 256 }
        authorizationCode: { type: string, maxLength: 2048, writeOnly: true, description: "Apple only, for token revocation on account deletion." }
        displayName: { type: string, maxLength: 120 }
        ageConfirmed: { type: boolean }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailRegisterRequest:
      type: object
      required: [email, password, ageConfirmed]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        displayName: { type: string, maxLength: 120 }
        ageConfirmed: { type: boolean, const: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    EmailLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 128, writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, maxLength: 256, writeOnly: true }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 512, writeOnly: true }
    LogoutRequest:
      type: object
      properties:
        allDevices: { type: boolean, default: false }
    GuestSessionRequest:
      type: object
      required: [installationId, platform, attestation]
      properties:
        installationId: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        attestation: { $ref: '#/components/schemas/AttestationEvidence' }
    AuthSession:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, tokenType, user]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken: { type: string, readOnly: true }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, readOnly: true, description: Store in Keystore/Keychain only; shared with the iOS extension via keychain access group (Full Access). }
        refreshTokenExpiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        isNewUser: { type: boolean }
        mergedGuestUserId: { type: string, format: uuid, description: Present when a guest account was merged into this account. }
        user: { $ref: '#/components/schemas/UserProfile' }

    # ------------------------------------------------------------ devices / me
    Device:
      type: object
      required: [id, installationId, platform, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        installationId: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        attestationStatus:
          type: string
          enum: [NOT_CHECKED, VALID, FAILED, UNSUPPORTED]
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time, readOnly: true }
    DeviceUpdate:
      type: object
      properties:
        deviceName: { type: string, maxLength: 160 }
        appVersion: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 80 }
        pushProvider:
          type: string
          enum: [FCM, APNS]
        pushToken: { type: string, maxLength: 4096, writeOnly: true }
    ResourceInstallationReport:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [resourceId, installedVersion, status]
            properties:
              resourceId: { type: string, format: uuid }
              installedVersion: { type: string, maxLength: 40 }
              status:
                type: string
                enum: [PENDING, INSTALLED, FAILED, REMOVED, ROLLED_BACK]
              checksumVerified: { type: boolean }
              signatureVerified: { type: boolean }
              errorCode: { type: string, maxLength: 80 }
    UserProfile:
      type: object
      required: [id, accountType, accountStatus]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        accountType:
          type: string
          enum: [REGISTERED, GUEST]
        accountStatus:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, DELETION_PENDING]
        displayName: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        phoneNumberMasked: { type: string, description: 'e.g. +251 9•• ••• 567', readOnly: true }
        phoneVerified: { type: boolean }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        marketSource:
          type: string
          enum: [USER_SELECTED, STORE_STOREFRONT, PHONE_NUMBER, BILLING_HISTORY, DEFAULT]
        uiLocale: { type: string, maxLength: 35 }
        timeZone: { type: string, maxLength: 64, description: "IANA zone, e.g. Africa/Addis_Ababa." }
        createdAt: { type: string, format: date-time, readOnly: true }
    UserProfileUpdate:
      type: object
      properties:
        displayName: { type: string, maxLength: 120 }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        uiLocale: { type: string, maxLength: 35 }
        timeZone: { type: string, maxLength: 64 }
    DeletionRequestCreate:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }
        reason: { type: string, maxLength: 255 }
    DeletionRequest:
      type: object
      required: [id, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, SCHEDULED, CANCELLED, PROCESSING, COMPLETED, FAILED]
        requestedAt: { type: string, format: date-time }
        scheduledPurgeAt: { type: string, format: date-time }
        activeStoreSubscriptions:
          type: array
          description: Store subscriptions the user must cancel in the store to stop being charged.
          items: { $ref: '#/components/schemas/Subscription' }
    DataExportCreate:
      type: object
      properties:
        format:
          type: string
          enum: [JSON]
          default: JSON
    DataExport:
      type: object
      required: [id, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, PROCESSING, READY, EXPIRED, FAILED]
        requestedAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        downloadUrl: { type: string, format: uri, description: Signed URL valid ≤ 15 minutes. }
        downloadExpiresAt: { type: string, format: date-time }
    ConsentCode:
      type: string
      enum:
        - TERMS_ACCEPTANCE
        - PRIVACY_NOTICE
        - AI_PROCESSING
        - SAVE_AI_HISTORY
        - SAVE_AUDIO_HISTORY
        - DICTIONARY_SYNC
        - FEEDBACK_TEXT
        - COMMUNITY_CONTRIBUTION
        - PERSONAL_STYLE
        - PAYMENT_MANDATE
        - ANALYTICS
        - MARKETING
    Consent:
      type: object
      required: [id, consentCode, consentVersion, isGranted, recordedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true, description: Consent record ID (used as `consentRecordId` for mandates). }
        consentCode: { $ref: '#/components/schemas/ConsentCode' }
        consentVersion: { type: string, maxLength: 40 }
        isGranted: { type: boolean }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
    ConsentUpdate:
      type: object
      required: [consentVersion, isGranted]
      properties:
        consentVersion: { type: string, maxLength: 40, description: Version of the text shown to the user. }
        isGranted: { type: boolean }
        details:
          type: object
          description: Consent-specific context, e.g. mandate amount/frequency shown to the user.
          additionalProperties: true

    # ------------------------------------------------------------ config
    ClientConfig:
      type: object
      required: [configVersion, minSupportedAppVersion, flags, values, serverTime]
      properties:
        configVersion: { type: integer }
        minSupportedAppVersion: { type: string }
        recommendedAppVersion: { type: string }
        flags:
          type: object
          description: Evaluated feature flags for this user/device/app version.
          additionalProperties: { type: boolean }
        values:
          type: object
          description: Active `app_configurations` values for this platform scope.
          additionalProperties: true
        serverTime: { type: string, format: date-time }
    AiCapabilities:
      type: object
      required: [items, generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [featureCode, qualityTier, execution]
            properties:
              featureCode: { $ref: '#/components/schemas/FeatureCode' }
              sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
              destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
              qualityTier: { $ref: '#/components/schemas/QualityTier' }
              execution: { $ref: '#/components/schemas/ExecutionMode' }
              supportsAutoDetection: { type: boolean }
              supportsStreaming: { type: boolean }
              maxInputCharacters: { type: integer, minimum: 1 }

    # ------------------------------------------------------------ languages
    InputMode:
      type: string
      enum: [DIRECT_SCRIPT_LAYOUT, PHONETIC_LATIN_TO_NATIVE, LATIN_PASSTHROUGH]
    Language:
      type: object
      required: [code, englishName, writingDirection, supportLevel]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        englishName: { type: string }
        nativeName: { type: string }
        scriptCode: { type: string, description: "ISO 15924 (Ethi, Latn, Arab)." }
        writingDirection:
          type: string
          enum: [LTR, RTL]
        supportLevel:
          type: string
          enum: [PLANNED, ALPHA, BETA, GA]
        isLaunchLanguage: { type: boolean }
        inputModes:
          type: array
          items: { $ref: '#/components/schemas/InputMode' }
    TransliterationProfile:
      type: object
      required: [code, version, languageCode, sourceScript, targetScript, status]
      properties:
        code: { type: string, maxLength: 100 }
        version: { type: string, maxLength: 40 }
        displayName: { type: string }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        sourceScript: { type: string }
        targetScript: { type: string }
        inputScheme:
          type: string
          enum: [PHONETIC, KEYMAP, ROMANIZATION]
        reversible: { type: boolean, description: Supports native → Latin (pronunciation/romanised display). }
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        rulesResourceId: { type: string, format: uuid }
    ReleaseChannel:
      type: string
      enum: [INTERNAL, BETA, STABLE]
    ResourceType:
      type: string
      enum:
        - KEYBOARD_LAYOUT
        - TRANSLITERATION_RULES
        - DICTIONARY
        - FREQUENCY_LIST
        - PREDICTION_MODEL
        - AUTOCORRECTION_MODEL
        - PROTECTED_TERMS
        - EMOJI_KEYWORDS
        - PRONUNCIATION
        - SPELL_MODEL
        - LANGUAGE_ID_MODEL
        - TRANSLATION_MODEL
        - ASR_MODEL
        - TTS_VOICE
        - ON_DEVICE_LLM
        - OTHER
    LanguageResourceManifest:
      type: object
      description: >-
        Discovery metadata for one pack, used to decide what to download. It is NOT trusted:
        the downloaded artifact is a self-authenticating container (docs/specs/pack-format-v1.md)
        whose embedded manifest is Ed25519-signed and verified on the device before activation.
      required: [id, languageCode, resourceType, version, platform, channel, artifactUrl, sha256, sizeBytes, signatureKeyId]
      properties:
        id: { type: string, format: uuid }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        version: { type: string, description: Semantic version. }
        platform:
          type: string
          enum: [SHARED, ANDROID, IOS]
        channel: { $ref: '#/components/schemas/ReleaseChannel' }
        artifactUrl: { type: string, format: uri, description: HTTPS CDN URL. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the artifact inside the container; equals the signed manifest value. }
        sizeBytes: { type: integer, format: int64, minimum: 0, description: Artifact size inside the container; equals the signed manifest value. }
        containerSizeBytes: { type: integer, format: int64, minimum: 0, description: Size of the whole container file, for download planning. }
        baseResourceId: { type: string, format: uuid, description: Present for delta artifacts; apply only on top of this installed resource. }
        signatureKeyId: { type: string }
        minAppVersion: { type: string }
        licenseCode: { type: string, description: SPDX or internal licence code; non-commercial licences are never published. }
        deviceRequirements:
          type: object
          properties:
            minRamMb: { type: integer, minimum: 0 }
            minFreeStorageMb: { type: integer, minimum: 0 }
            accelerator:
              type: string
              enum: [NONE, NNAPI, GPU, NPU, CORE_ML]
            minOsVersion: { type: string }
            wifiOnlyDefault: { type: boolean }
            iosExtensionCompatible: { type: boolean, description: False for resources too large for the keyboard extension memory ceiling. }
        transliteration:
          type: object
          description: Present for TRANSLITERATION_RULES.
          properties:
            profileCode: { type: string }
            profileVersion: { type: string }
            normalizationForm:
              type: string
              enum: [NFC, NFD]
            rankingVersion: { type: string }
        releaseNotes: { type: string }
        publishedAt: { type: string, format: date-time }
    SigningKey:
      type: object
      required: [keyId, algorithm, publicKey, status]
      properties:
        keyId: { type: string }
        algorithm:
          type: string
          const: Ed25519
        publicKey: { type: string, description: Base64 raw public key. }
        status:
          type: string
          enum: [ACTIVE, RETIRING, REVOKED]
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        endorsedByKeyId: { type: string }
        endorsementSignature: { type: string }

    # ------------------------------------------------------------ preferences
    Formality:
      type: string
      enum: [INFORMAL, FORMAL, HONORIFIC]
    AddresseeGender:
      type: string
      enum: [MASCULINE, FEMININE, PLURAL, UNKNOWN]
    TranslationStyle:
      type: string
      enum: [LITERAL, NATURAL, POLITE, PROFESSIONAL, FRIENDLY]
    Tone:
      type: string
      enum: [FRIENDLY, POLITE, PROFESSIONAL, CONCISE, APOLOGETIC, HONORIFIC]
    Preferences:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0, description: Optimistic-concurrency revision; echo the last value read. }
        defaultSourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        sourceDetectionMode:
          type: string
          enum: [AUTO, MANUAL]
          default: AUTO
        defaultDestinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        translationMode:
          type: string
          enum: [DISABLED, MANUAL, PROMPT]
          default: MANUAL
        defaultTranslationStyle: { $ref: '#/components/schemas/TranslationStyle' }
        preserveNamesInTranslation: { type: boolean, default: true }
        voiceInputLanguageMode:
          type: string
          enum: [AUTO, MANUAL]
        preferredVoiceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        calendarSystem:
          type: string
          enum: [GREGORIAN, ETHIOPIAN]
          default: GREGORIAN
        timeNotation:
          type: string
          enum: [INTERNATIONAL, ETHIOPIAN]
          default: INTERNATIONAL
        numeralStyle:
          type: string
          enum: [WESTERN, ETHIOPIC]
          default: WESTERN
        defaultFormality: { $ref: '#/components/schemas/Formality' }
        defaultAddresseeGender: { $ref: '#/components/schemas/AddresseeGender' }
        aiProcessingPreference:
          type: string
          enum: [SERVER, PREFER_ON_DEVICE, ON_DEVICE_ONLY]
          default: SERVER
          description: ON_DEVICE_ONLY disables server AI; features without an installed on-device model become unavailable.
        historyEnabled: { type: boolean, default: false, description: Requires SAVE_AI_HISTORY consent. }
        historyRetentionDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
        keyboardTheme: { type: string, maxLength: 40 }
        hapticsEnabled: { type: boolean }
        soundEnabled: { type: boolean }
        analyticsOptIn: { type: boolean, default: false }
        updatedAt: { type: string, format: date-time, readOnly: true }
    TypingLanguage:
      type: object
      required: [languageCode, enabled, inputMode]
      properties:
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean }
        isPrimary: { type: boolean, default: false }
        sortOrder: { type: integer, default: 100 }
        inputMode: { $ref: '#/components/schemas/InputMode' }
        transliterationProfileCode:
          type: string
          maxLength: 100
          description: Required iff `inputMode = PHONETIC_LATIN_TO_NATIVE`; must be an ACTIVE profile of this language.
        conversionTrigger:
          type: string
          enum: [LIVE_COMPOSING, WORD_BOUNDARY, MANUAL]
          default: LIVE_COMPOSING
        showTransliterationCandidates: { type: boolean, default: true }
        unknownTokenBehavior:
          type: string
          enum: [PRESERVE_LATIN, SUGGEST_ONLY]
          default: PRESERVE_LATIN
    TypingLanguagesDocument:
      type: object
      required: [languages, revision]
      properties:
        revision: { type: integer, minimum: 0 }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TypingLanguage' }
    DestinationProfileInput:
      type: object
      required: [label, destinationLanguage]
      properties:
        label: { type: string, minLength: 1, maxLength: 80, description: Encrypted at rest with the user data key. }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        formality: { $ref: '#/components/schemas/Formality' }
        addresseeGender: { $ref: '#/components/schemas/AddresseeGender' }
        defaultTone: { $ref: '#/components/schemas/Tone' }
        defaultStyle: { $ref: '#/components/schemas/TranslationStyle' }
        glossaryId: { type: string, format: uuid }
        sortOrder: { type: integer }
    DestinationProfile:
      allOf:
        - $ref: '#/components/schemas/DestinationProfileInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }
    AppDestinationRule:
      type: object
      required: [appPackageHmac]
      description: Exactly one of `destinationProfileId` or `destinationLanguage` must be set.
      properties:
        appPackageHmac: { type: string, pattern: '^[0-9a-f]{64}$', description: "HMAC-SHA256(per-user rule key, packageName), hex." }
        destinationProfileId: { type: string, format: uuid }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean, default: true }
    AppDestinationRulesDocument:
      type: object
      required: [rules, revision]
      properties:
        revision: { type: integer, minimum: 0 }
        rules:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppDestinationRule' }
    StyleProfile:
      type: object
      required: [languageCode, enabled]
      properties:
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        enabled: { type: boolean }
        formality: { $ref: '#/components/schemas/Formality' }
        lengthPreference:
          type: string
          enum: [SHORT, BALANCED, DETAILED]
        emojiUse:
          type: string
          enum: [NONE, LIGHT, FREQUENT]
        greeting: { type: string, maxLength: 120, description: Encrypted at rest. }
        signOff: { type: string, maxLength: 200, description: Encrypted at rest. }
        preferredPhrases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        avoidPhrases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        learnedHints:
          type: object
          description: Structured parameters computed on-device from accepted AI results. Never raw text.
          properties:
            averageSentenceLength: { type: number, minimum: 0, maximum: 200 }
            formalityScore: { type: number, minimum: 0, maximum: 1 }
            emojiRate: { type: number, minimum: 0, maximum: 1 }
            codeSwitchRate: { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
        updatedAt: { type: string, format: date-time, readOnly: true }
    DictionaryChange:
      type: object
      required: [op, languageCode, word, clientChangeId]
      properties:
        op:
          type: string
          enum: [ADD, DELETE]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        word: { type: string, minLength: 1, maxLength: 64 }
        clientChangeId: { type: string, format: uuid }
        changedAt: { type: string, format: date-time }
    DictionaryChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DictionaryChange' }
    DictionaryChangesResult:
      type: object
      required: [applied, syncToken]
      properties:
        applied: { type: integer, minimum: 0 }
        rejected:
          type: array
          items:
            type: object
            required: [clientChangeId, code]
            properties:
              clientChangeId: { type: string, format: uuid }
              code: { type: string }
        syncToken: { type: string, maxLength: 128 }
    DictionaryChangesPage:
      type: object
      required: [changes, syncToken, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryChange' }
        syncToken: { type: string, maxLength: 128 }
        hasMore: { type: boolean }

    # ------------------------------------------------------------ AI
    TranslateCoreRequest:
      type: object
      required: [text, destinationLanguage]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        sourceLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: Omit for automatic detection.
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        style: { $ref: '#/components/schemas/TranslationStyle' }
        preserveNames: { type: boolean, default: true }
        glossaryId: { type: string, format: uuid }
        addressee: { $ref: '#/components/schemas/Addressee' }
        culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
    TranslateRequest:
      allOf:
        - $ref: '#/components/schemas/TranslateCoreRequest'
        - type: object
          properties:
            destinationProfileId:
              type: string
              format: uuid
              description: Fills destination, addressee, style and glossary defaults; explicit fields win.
            saveToHistory: { type: boolean, default: false, description: Honoured only when history is enabled. }
    Alternative:
      type: object
      required: [text]
      properties:
        label: { type: string, maxLength: 80, description: 'e.g. "Addressing a woman"' }
        text: { type: string }
        addressee: { $ref: '#/components/schemas/Addressee' }
    TranslateResponse:
      type: object
      required: [requestId, destinationLanguage, translatedText, qualityTier, replayed]
      properties:
        requestId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        detectedSourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        detectionConfidence: { type: number, minimum: 0, maximum: 1 }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        translatedText: { type: string }
        alternatives:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Alternative' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean, description: True when returned from the idempotency replay cache. }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    TransformTask:
      type: string
      enum: [GRAMMAR_CORRECTION, REWRITE, TONE_ADJUST, SUMMARIZE, EXPLAIN_TEXT, SCRIPT_CONVERSION]
    TransformRequest:
      type: object
      required: [task, text]
      properties:
        task: { $ref: '#/components/schemas/TransformTask' }
        text: { type: string, minLength: 1, maxLength: 5000 }
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: Language of `text`; omit for detection.
        options:
          type: object
          properties:
            mode:
              type: string
              description: GRAMMAR_CORRECTION → GRAMMAR | SPELLING_ONLY. REWRITE → NATURAL | SHORTEN | EXPAND | CLARIFY.
              enum: [GRAMMAR, SPELLING_ONLY, NATURAL, SHORTEN, EXPAND, CLARIFY]
            tone:
              $ref: '#/components/schemas/Tone'
              description: Required for TONE_ADJUST.
            targetLength:
              type: string
              enum: [SHORT, MEDIUM, LONG]
              description: SUMMARIZE / REWRITE.
            explainIn:
              $ref: '#/components/schemas/LanguageCode'
              description: EXPLAIN_TEXT output language.
            sourceRomanization:
              type: string
              enum: [AUTO, SERA, INFORMAL_CHAT]
              description: SCRIPT_CONVERSION input convention.
        addressee: { $ref: '#/components/schemas/Addressee' }
        glossaryId: { type: string, format: uuid }
        applyStyleProfile: { type: boolean, default: false, description: Requires PERSONAL_STYLE. }
        saveToHistory: { type: boolean, default: false }
    TextEdit:
      type: object
      required: [start, end, replacement]
      properties:
        start: { type: integer, minimum: 0, description: UTF-16 offset into the input (clients map to graphemes). }
        end: { type: integer, minimum: 0 }
        original: { type: string }
        replacement: { type: string }
        category:
          type: string
          enum: [SPELLING, GRAMMAR, PUNCTUATION, STYLE, SCRIPT]
    TransformResponse:
      type: object
      required: [requestId, task, resultText, qualityTier, replayed]
      properties:
        requestId: { type: string, format: uuid }
        task: { $ref: '#/components/schemas/TransformTask' }
        language: { $ref: '#/components/schemas/LanguageCode' }
        resultText: { type: string }
        edits:
          type: array
          description: GRAMMAR_CORRECTION / SCRIPT_CONVERSION edit list for inline review.
          items: { $ref: '#/components/schemas/TextEdit' }
        alternatives:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Alternative' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean }
        historyItemId: { type: string, format: uuid }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    RepliesRequest:
      type: object
      required: [contextText, replyLanguage]
      properties:
        contextText: { type: string, minLength: 1, maxLength: 2000, description: Message text the user explicitly pasted/selected/shared. }
        contextLanguage: { $ref: '#/components/schemas/LanguageCode' }
        replyLanguage: { $ref: '#/components/schemas/LanguageCode' }
        count: { type: integer, minimum: 1, maximum: 5, default: 3 }
        tone: { $ref: '#/components/schemas/Tone' }
        addressee: { $ref: '#/components/schemas/Addressee' }
        applyStyleProfile: { type: boolean, default: false }
    RepliesResponse:
      type: object
      required: [requestId, suggestions, replayed]
      properties:
        requestId: { type: string, format: uuid }
        suggestions:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              tone: { $ref: '#/components/schemas/Tone' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        replayed: { type: boolean }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    DraftRequest:
      type: object
      required: [documentType, language, purpose]
      properties:
        documentType:
          type: string
          enum: [EMAIL, LETTER, APPLICATION, ANNOUNCEMENT, OTHER]
        language: { $ref: '#/components/schemas/LanguageCode' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        keyPoints:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
        recipient:
          type: object
          properties:
            name: { type: string, maxLength: 120 }
            role: { type: string, maxLength: 120 }
            formality: { $ref: '#/components/schemas/Formality' }
            gender: { $ref: '#/components/schemas/AddresseeGender' }
        senderName: { type: string, maxLength: 120 }
        length:
          type: string
          enum: [SHORT, MEDIUM, LONG]
          default: MEDIUM
        includeSubject: { type: boolean, default: true }
        culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
        applyStyleProfile: { type: boolean, default: false }
        glossaryId: { type: string, format: uuid }
    DraftResponse:
      type: object
      required: [requestId, body, replayed]
      properties:
        requestId: { type: string, format: uuid }
        subject: { type: string }
        body: { type: string }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        qualityTier: { $ref: '#/components/schemas/QualityTier' }
        replayed: { type: boolean }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    DetectLanguageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LanguageCode' }
    DetectLanguageResponse:
      type: object
      required: [languages, mixedLanguage]
      properties:
        languages:
          type: array
          items:
            type: object
            required: [languageCode, confidence]
            properties:
              languageCode: { $ref: '#/components/schemas/LanguageCode' }
              scriptCode: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
        mixedLanguage: { type: boolean, description: True when code-switching is detected. }
        romanizedNative: { type: boolean, description: True when Amharic/Tigrinya appears to be written in Latin script. }
    FeedbackRequest:
      type: object
      required: [aiRequestId, rating]
      properties:
        aiRequestId: { type: string, format: uuid }
        rating:
          type: string
          enum: [POSITIVE, NEGATIVE]
        reasonCodes:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [WRONG_MEANING, WRONG_TONE, WRONG_GENDER_OR_FORMALITY, UNNATURAL, SPELLING, NAME_CHANGED, WRONG_SCRIPT, TOO_SLOW, OTHER]
        comment: { type: string, maxLength: 1000, description: Requires FEEDBACK_TEXT consent; encrypted. }
        includeContent: { type: boolean, default: false, description: Attach the input/output text (client-supplied) with FEEDBACK_TEXT consent. }
        inputText: { type: string, maxLength: 5000 }
        outputText: { type: string, maxLength: 10000 }

    # ------------------------------------------------------------ history
    HistoryItem:
      type: object
      required: [id, featureCode, inputText, outputText, favorite, createdAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        inputText: { type: string }
        outputText: { type: string }
        favorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    HistoryItemUpdate:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }

    # ------------------------------------------------------------ speech
    AudioContentType:
      type: string
      enum: ['audio/ogg; codecs=opus', 'audio/webm; codecs=opus', audio/wav, audio/flac, audio/mp4]
    UploadSessionRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType: { $ref: '#/components/schemas/AudioContentType' }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        estimatedDurationMs: { type: integer, minimum: 1, maximum: 600000 }
    UploadSession:
      type: object
      required: [uploadSessionId, uploadUrl, method, expiresAt, maxBytes]
      properties:
        uploadSessionId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method:
          type: string
          const: PUT
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time, description: ≤ 5 minutes after issue. }
        maxBytes: { type: integer }
    InlineAudio:
      type: object
      required: [contentType, dataBase64]
      properties:
        contentType: { $ref: '#/components/schemas/AudioContentType' }
        dataBase64: { type: string, contentEncoding: base64, maxLength: 1400000, description: ≤ 30 s of audio. }
    TranscriptionRequest:
      type: object
      description: Exactly one of `uploadSessionId` or `inlineAudio`.
      properties:
        uploadSessionId: { type: string, format: uuid }
        inlineAudio: { $ref: '#/components/schemas/InlineAudio' }
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
          description: Omit with `autoDetect` true.
        autoDetect: { type: boolean, default: false }
        candidateLanguages:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/LanguageCode' }
        punctuate: { type: boolean, default: true }
        outputScript:
          type: string
          enum: [NATIVE, LATIN]
          default: NATIVE
        saveToHistory: { type: boolean, default: false }
      oneOf:
        - required: [uploadSessionId]
        - required: [inlineAudio]
    SpeechTranslationRequest:
      allOf:
        - $ref: '#/components/schemas/TranscriptionRequest'
        - type: object
          required: [destinationLanguage]
          properties:
            destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
            addressee: { $ref: '#/components/schemas/Addressee' }
            culturalOptions: { $ref: '#/components/schemas/CulturalOptions' }
            synthesizeSpeech: { type: boolean, default: false }
            voiceId: { type: string, maxLength: 120 }
    PartnerTranscriptionRequest:
      type: object
      description: Exactly one of `audioUrl` or `inlineAudio`.
      properties:
        audioUrl: { type: string, format: uri, description: HTTPS URL fetched once and not retained. }
        inlineAudio: { $ref: '#/components/schemas/InlineAudio' }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        autoDetect: { type: boolean, default: false }
        punctuate: { type: boolean, default: true }
        destinationLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: If set, also translate (SPEECH_TRANSLATE).
      oneOf:
        - required: [audioUrl]
        - required: [inlineAudio]
    SpeechJob:
      type: object
      required: [jobId, jobType, status, createdAt]
      properties:
        jobId: { type: string, format: uuid }
        jobType:
          type: string
          enum: [TRANSCRIPTION, TRANSCRIBE_TRANSLATE, SYNTHESIS]
        status:
          type: string
          enum: [PENDING, UPLOADING, PROCESSING, SUCCEEDED, FAILED, CANCELLED, EXPIRED]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        detectedLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        transcript: { type: string }
        translation: { type: string }
        synthesizedAudioUrl: { type: string, format: uri }
        audioDurationMs: { type: integer, minimum: 0 }
        notes:
          type: array
          items: { $ref: '#/components/schemas/AiNote' }
        usage:
          type: array
          items: { $ref: '#/components/schemas/UsageSummary' }
        error: { $ref: '#/components/schemas/Problem' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        resultExpiresAt: { type: string, format: date-time, description: Results are purged from the ephemeral store after this time (≤ 10 min). }
    SynthesisRequest:
      type: object
      required: [text, languageCode]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        voiceId: { type: string, maxLength: 120 }
        speed: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
        pronunciationMode: { type: boolean, default: false, description: Also return a Latin romanisation for learners. }
        outputFormat:
          type: string
          enum: [MP3, OGG_OPUS]
          default: MP3
    SynthesisResponse:
      type: object
      required: [audioUrl, audioUrlExpiresAt, durationMs]
      properties:
        audioUrl: { type: string, format: uri }
        audioUrlExpiresAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        romanization: { type: string }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    Voice:
      type: object
      required: [voiceId, languageCode, displayName, execution]
      properties:
        voiceId: { type: string }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        displayName: { type: string }
        gender:
          type: string
          enum: [FEMALE, MALE, NEUTRAL]
        quality:
          type: string
          enum: [STANDARD, NEURAL]
        execution: { $ref: '#/components/schemas/ExecutionMode' }
        sampleUrl: { type: string, format: uri }

    # ------------------------------------------------------------ realtime
    RealtimeSessionRequest:
      type: object
      required: [mode, languageA, languageB]
      properties:
        mode:
          type: string
          enum: [VOICE_TO_VOICE, LIVE_CONVERSATION]
        languageA: { $ref: '#/components/schemas/LanguageCode' }
        languageB: { $ref: '#/components/schemas/LanguageCode' }
        autoDetectSpeaker: { type: boolean, default: false, description: Detect turn language automatically instead of manual speaker switching. }
        synthesizeSpeech: { type: boolean, default: true }
        voiceA: { type: string, maxLength: 120 }
        voiceB: { type: string, maxLength: 120 }
        addressee: { $ref: '#/components/schemas/Addressee' }
        maxDurationSeconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
    RealtimeSession:
      type: object
      required: [sessionId, mode, status]
      properties:
        sessionId: { type: string, format: uuid }
        mode:
          type: string
          enum: [VOICE_TO_VOICE, LIVE_CONVERSATION]
        status:
          type: string
          enum: [CREATED, ACTIVE, ENDED, FAILED, EXPIRED]
        languageA: { $ref: '#/components/schemas/LanguageCode' }
        languageB: { $ref: '#/components/schemas/LanguageCode' }
        websocketUrl: { type: string, format: uri, description: 'wss:// URL; present only on creation.' }
        ticket: { type: string, readOnly: true, description: "Single-use, valid 60 s; present only on creation." }
        ticketExpiresAt: { type: string, format: date-time }
        audioInput:
          type: object
          properties:
            encoding:
              type: string
              enum: [PCM16LE, OPUS]
            sampleRateHz: { type: integer, enum: [16000, 24000, 48000] }
            channels: { type: integer, const: 1 }
            frameDurationMs: { type: integer, minimum: 20, maximum: 100 }
        audioOutput:
          type: object
          properties:
            encoding:
              type: string
              enum: [PCM16LE, OGG_OPUS, MP3]
            sampleRateHz: { type: integer }
            transport:
              type: string
              enum: [BASE64_JSON, BINARY]
        maxDurationSeconds: { type: integer }
        billedSeconds: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        usage: { $ref: '#/components/schemas/UsageSummary' }
    RealtimeClientMessage:
      type: object
      description: Client → server WebSocket text frame.
      required: [type]
      properties:
        type:
          type: string
          enum: [start, speaker_switch, stop, ping]
        speaker:
          type: string
          enum: [A, B]
        clientTimestampMs: { type: integer, format: int64 }
    RealtimeServerMessage:
      type: object
      description: Server → client WebSocket text frame.
      required: [type]
      properties:
        type:
          type: string
          enum: [partial_transcript, final_transcript, translation, tts_audio, usage, error, session_ended, pong]
        turnId: { type: string }
        speaker:
          type: string
          enum: [A, B]
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        text: { type: string }
        audioBase64: { type: string, contentEncoding: base64 }
        audioSequence: { type: integer, minimum: 0 }
        secondsUsed: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
        code: { type: string }
        message: { type: string }

    # ------------------------------------------------------------ entitlements
    FeatureEntitlement:
      type: object
      required: [featureCode, accessEnabled, unit, resetPeriod]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        accessEnabled: { type: boolean }
        includedUnits: { type: integer, description: Absent = unlimited (or boolean access when unit is NONE). }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
        resetPeriod: { $ref: '#/components/schemas/ResetPeriod' }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        resetsAt: { type: string, format: date-time }
    Entitlements:
      type: object
      required: [plan, features, entitlementToken]
      properties:
        plan:
          type: object
          required: [planCode, planRank, source]
          properties:
            planCode: { type: string, description: 'FREE, PREMIUM, PREMIUM_PLUS, BUSINESS (data-driven).' }
            displayName: { type: string }
            planRank: { type: integer }
            source:
              type: string
              enum: [DEFAULT, SUBSCRIPTION, ORGANIZATION_SEAT]
            subscriptionId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            effectiveUntil: { type: string, format: date-time }
        features:
          type: array
          items: { $ref: '#/components/schemas/FeatureEntitlement' }
        creditBalance: { type: number, minimum: 0 }
        entitlementToken:
          type: object
          required: [jws, keyId, expiresAt, offlineGraceUntil]
          properties:
            jws: { type: string, description: 'Ed25519 JWS; claims: sub, deviceId, planCode, features (boolean gates), iat, exp.' }
            keyId: { type: string }
            expiresAt: { type: string, format: date-time }
            offlineGraceUntil: { type: string, format: date-time }
    UsageReport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [featureCode, periodStart, periodEnd, usedUnits, unit]
            properties:
              featureCode: { $ref: '#/components/schemas/FeatureCode' }
              periodStart: { type: string, format: date-time }
              periodEnd: { type: string, format: date-time }
              usedUnits: { type: integer, minimum: 0 }
              includedUnits: { type: integer }
              creditsConsumed: { type: number, minimum: 0, description: Credits are fractional (6 decimal places) because audio is costed per second. }
              unit: { $ref: '#/components/schemas/MeteringUnit' }
    CreditSummary:
      type: object
      required: [balanceUnits, lots]
      properties:
        balanceUnits: { type: number, minimum: 0, description: Exact balance (6 dp); display rounded down to whole credits. }
        nextExpiryAt: { type: string, format: date-time }
        lots:
          type: array
          items:
            type: object
            required: [lotId, originalUnits, remainingUnits, source]
            properties:
              lotId: { type: string, format: uuid }
              originalUnits: { type: number, exclusiveMinimum: 0 }
              remainingUnits: { type: number, minimum: 0 }
              source:
                type: string
                enum: [PURCHASE, GRANT, PROMOTION, REFUND, ADJUSTMENT]
              expiresAt: { type: string, format: date-time }
    CreditTransaction:
      type: object
      required: [id, transactionType, deltaUnits, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        transactionType:
          type: string
          enum: [PURCHASE, GRANT, CONSUMPTION, REFUND, EXPIRY, ADJUSTMENT, REVERSAL]
        deltaUnits: { type: number }
        balanceAfter: { type: number, minimum: 0 }
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        lotId: { type: string, format: uuid }
        aiRequestId: { type: string, format: uuid }
        paymentOrderId: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ billing
    SalesChannel:
      type: string
      enum: [WEB, ANDROID_GOOGLE_PLAY, ANDROID_DIRECT, IOS_APP_STORE, IOS_DIRECT, ADMIN, PARTNER]
    DistributionChannel:
      type: string
      enum: [GOOGLE_PLAY, APPLE_APP_STORE, DIRECT_DOWNLOAD, WEB]
    PurchaseFlow:
      type: string
      enum: [STORE_BILLING, LOCAL_GATEWAY_IN_APP, EXTERNAL_WEB_CHECKOUT, CONSUMPTION_ONLY, NONE]
    BillingPeriod:
      type: string
      enum: [ONE_TIME, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, LIFETIME]
    RenewalModel:
      type: string
      enum: [NONE, MANUAL_RENEW, AUTO_RENEW, STORE_MANAGED]
    TaxBehavior:
      type: string
      enum: [INCLUSIVE, EXCLUSIVE, NOT_APPLICABLE]
    Price:
      type: object
      required: [billingPeriod, renewalModel, listPrice, taxBehavior]
      properties:
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        listPrice: { $ref: '#/components/schemas/Money' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        displayPrice: { type: string, description: "Localised display string, e.g. \"299.00 ብር\"." }
        storeProductId: { type: string, description: Store SKU to launch the store billing flow (STORE_BILLING only). }
        storeOfferId: { type: string }
    Product:
      type: object
      required: [productCode, productType, displayName, prices]
      properties:
        productCode: { type: string, maxLength: 60, description: 'e.g. PLAN_PREMIUM, PLAN_PREMIUM_PLUS, CREDITS_500.' }
        productType:
          type: string
          enum: [SUBSCRIPTION, AI_CREDIT_PACK, ADD_ON]
        displayName: { type: string }
        description: { type: string }
        planCode: { type: string }
        creditUnits: { type: integer, minimum: 1 }
        creditValidityDays: { type: integer, minimum: 1 }
        prices:
          type: array
          items: { $ref: '#/components/schemas/Price' }
    PaymentMethodOption:
      type: object
      required: [methodCode, providerCode, displayName, methodType]
      description: Public method only — never merchant account IDs or secrets.
      properties:
        methodCode: { type: string, maxLength: 60, description: 'Public method code, e.g. CHAPA_TELEBIRR, CHAPA_CBEBIRR, ARIFPAY_CARD.' }
        providerCode: { type: string, maxLength: 40 }
        displayName: { type: string }
        methodType:
          type: string
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD, PAYPAL, APP_STORE, MANUAL]
        supportsAutoRenew: { type: boolean }
        requiresRedirect: { type: boolean }
        minAmount: { $ref: '#/components/schemas/Money' }
        maxAmount: { $ref: '#/components/schemas/Money' }
        logoUrl: { type: string, format: uri }
    BillingOptions:
      type: object
      required: [marketCountry, clientPlatform, distributionChannel, purchaseFlow, purchaseUiAllowed, products, paymentMethods, policyEvaluatedAt]
      properties:
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        clientPlatform: { $ref: '#/components/schemas/ClientPlatformEnum' }
        distributionChannel: { $ref: '#/components/schemas/DistributionChannel' }
        purchaseFlow: { $ref: '#/components/schemas/PurchaseFlow' }
        purchaseUiAllowed: { type: boolean, description: "False ⇒ show no prices, buttons or purchase calls-to-action." }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        paymentMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethodOption' }
        notice: { type: string, description: Optional localised notice (e.g. consumption-only explanation without purchase CTA). }
        policyEvaluatedAt: { type: string, format: date-time }
    PromotionValidateRequest:
      type: object
      required: [code, productCode, billingPeriod, marketCountry, salesChannel]
      properties:
        code: { type: string, minLength: 3, maxLength: 40 }
        productCode: { type: string, maxLength: 60 }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
    PromotionValidation:
      type: object
      required: [valid, code]
      properties:
        valid: { type: boolean }
        code: { type: string }
        discount: { $ref: '#/components/schemas/Money' }
        discountPercent: { type: integer, minimum: 1, maximum: 100 }
        reasonCode:
          type: string
          enum: [NOT_FOUND, EXPIRED, NOT_ELIGIBLE, REDEMPTION_LIMIT_REACHED, NOT_APPLICABLE_TO_PRODUCT]
        validUntil: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [productCode, billingPeriod, marketCountry, salesChannel]
      properties:
        productCode: { type: string, maxLength: 60 }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        renewalPreference:
          type: string
          enum: [NONE, MANUAL_RENEW, AUTO_RENEW]
          default: MANUAL_RENEW
        promotionCode: { type: string, maxLength: 40 }
        upgradeFromSubscriptionId: { type: string, format: uuid }
    OrderAmounts:
      type: object
      required: [list, discount, tax, total]
      properties:
        list: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    PaymentOrder:
      type: object
      required: [orderId, orderReference, orderType, status, productCode, marketCountry, salesChannel, amounts, taxBehavior, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        orderReference: { type: string, maxLength: 40, description: Human-readable reference used with providers and bank transfers. }
        orderType:
          type: string
          enum: [SUBSCRIPTION_PURCHASE, SUBSCRIPTION_RENEWAL, SUBSCRIPTION_UPGRADE, AI_CREDIT_TOPUP, ADD_ON_PURCHASE]
        status:
          type: string
          enum: [CREATED, AWAITING_PAYMENT, PAID, FAILED, CANCELLED, EXPIRED, PARTIALLY_REFUNDED, REFUNDED]
        productCode: { type: string }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        renewalModel: { $ref: '#/components/schemas/RenewalModel' }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        amounts: { $ref: '#/components/schemas/OrderAmounts' }
        discountReason:
          type: string
          enum: [PROMOTION, UPGRADE_PRORATION, ADMIN]
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        allowedMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethodOption' }
        fulfilment:
          type: object
          properties:
            subscriptionId: { type: string, format: uuid }
            creditLotId: { type: string, format: uuid }
            receiptId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CreateAttemptRequest:
      type: object
      required: [methodCode]
      properties:
        methodCode: { type: string, maxLength: 60 }
        returnUrl: { type: string, format: uri, description: "App deep link; must match a server-side allowlist. UX only, never proof of payment." }
        payerPhoneNumber: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: For approved direct wallet push charges. }
        locale: { type: string, maxLength: 35 }
    PaymentAttempt:
      type: object
      required: [attemptId, attemptNumber, status, methodCode, providerCode, createdAt]
      properties:
        attemptId: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [INITIATED, PENDING, REQUIRES_ACTION, SUCCEEDED, FAILED, CANCELLED, EXPIRED, UNKNOWN]
        methodCode: { type: string }
        providerCode: { type: string }
        nextAction:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [NONE, REDIRECT, DIRECT_CHARGE_PENDING, BANK_TRANSFER]
            checkoutUrl: { type: string, format: uri, description: Provider-hosted checkout (open in a browser tab/custom tab). }
            directChargeInstructions:
              type: object
              properties:
                message: { type: string, description: 'e.g. "Approve the payment in the telebirr app".' }
                expiresAt: { type: string, format: date-time }
            bankTransferInstructions:
              type: object
              properties:
                bankName: { type: string }
                accountName: { type: string }
                accountNumber: { type: string }
                reference: { type: string, description: Must be quoted exactly in the transfer. }
                amount: { $ref: '#/components/schemas/Money' }
                expiresAt: { type: string, format: date-time }
        failureCode: { type: string }
        failureMessage: { type: string, maxLength: 500, description: "Safe, localised message." }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ManualTransferClaimForm:
      type: object
      required: [attemptId, bankReference, transferDate]
      properties:
        attemptId: { type: string, format: uuid }
        payerName: { type: string, maxLength: 160 }
        bankReference: { type: string, maxLength: 160 }
        transferDate: { type: string, format: date }
        evidence: { type: string, format: binary, description: Optional JPEG/PNG/PDF ≤ 5 MB. }
    ManualTransferClaim:
      type: object
      required: [claimId, status, submittedAt]
      properties:
        claimId: { type: string, format: uuid }
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, MATCHED, REJECTED]
        submittedAt: { type: string, format: date-time }
    CreateMandateRequest:
      type: object
      required: [subscriptionId, methodCode, consentRecordId, maxAmount, intervalUnit]
      properties:
        subscriptionId: { type: string, format: uuid }
        methodCode: { type: string, maxLength: 60 }
        consentRecordId: { type: string, format: uuid, description: "Granted PAYMENT_MANDATE consent showing amount, frequency and cancellation terms." }
        maxAmount: { $ref: '#/components/schemas/Money' }
        intervalUnit:
          type: string
          enum: [DAY, WEEK, MONTH, YEAR]
        intervalCount: { type: integer, minimum: 1, default: 1 }
        returnUrl: { type: string, format: uri }
    PaymentMandate:
      type: object
      required: [mandateId, status, providerCode, methodCode, maxAmount, intervalUnit, intervalCount]
      properties:
        mandateId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, SIGNING_REQUIRED, ACTIVE, PAUSED, CANCELLED, EXPIRED, FAILED, REVOKED]
        providerCode: { type: string }
        methodCode: { type: string }
        maxAmount: { $ref: '#/components/schemas/Money' }
        intervalUnit:
          type: string
          enum: [DAY, WEEK, MONTH, YEAR]
        intervalCount: { type: integer, minimum: 1 }
        nextAction:
          type: object
          properties:
            signingUrl: { type: string, format: uri }
            instructions: { type: string }
        consentedAt: { type: string, format: date-time }
        nextChargeAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
    StorePurchaseRequest:
      type: object
      required: [provider, productId]
      description: Google requires `purchaseToken` (+ `packageName`); Apple requires `signedTransactionInfo`.
      properties:
        provider:
          type: string
          enum: [GOOGLE_PLAY, APPLE_APP_STORE]
        productId: { type: string, maxLength: 255 }
        purchaseToken: { type: string, maxLength: 4096, writeOnly: true }
        packageName: { type: string, maxLength: 255 }
        signedTransactionInfo: { type: string, maxLength: 16384, writeOnly: true, description: StoreKit 2 JWS transaction. }
        appAccountToken: { type: string, format: uuid, description: Must equal the account token the app set at purchase (StoreKit appAccountToken / Play obfuscatedAccountId). }
      oneOf:
        - required: [purchaseToken, packageName]
        - required: [signedTransactionInfo]
    StorePurchaseResult:
      type: object
      required: [storePurchaseId, status, environment]
      properties:
        storePurchaseId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, ACTIVE, IN_GRACE_PERIOD, ON_HOLD, PAUSED, CANCELLED, EXPIRED, REVOKED, REFUNDED]
        environment:
          type: string
          enum: [SANDBOX, PRODUCTION]
        acknowledgedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        subscription: { $ref: '#/components/schemas/Subscription' }
        creditLotId: { type: string, format: uuid }
    Subscription:
      type: object
      required: [subscriptionId, planCode, status, sourceType, billingMode]
      properties:
        subscriptionId: { type: string, format: uuid }
        planCode: { type: string }
        status:
          type: string
          enum: [PENDING, ACTIVE, GRACE_PERIOD, PAST_DUE, PAUSED, CANCELLED, EXPIRED, REVOKED, UPGRADED]
        sourceType:
          type: string
          enum: [PAYMENT, STORE, ADMIN_GRANT, PROMOTION, PARTNER]
        billingMode:
          type: string
          enum: [MANUAL_RENEW, AUTO_RENEW, STORE_MANAGED, GRANT, LIFETIME]
        providerCode: { type: string }
        methodCode: { type: string }
        mandateId: { type: string, format: uuid }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        autoRenewEnabled: { type: boolean }
        cancelAtPeriodEnd: { type: boolean }
        nextBillingAt: { type: string, format: date-time }
        renewable: { type: boolean, description: True when `/renew` can create a manual-renewal order. }
        manageUrl: { type: string, format: uri, description: Store subscription management URL (STORE_MANAGED). }
    RenewSubscriptionRequest:
      type: object
      required: [salesChannel]
      properties:
        salesChannel: { $ref: '#/components/schemas/SalesChannel' }
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        promotionCode: { type: string, maxLength: 40 }
    Receipt:
      type: object
      required: [receiptId, receiptNumber, orderId, issuedAt, lines, total]
      properties:
        receiptId: { type: string, format: uuid }
        receiptNumber: { type: string, description: Sequential per market/seller. }
        orderId: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        sellerName: { type: string }
        sellerTaxId: { type: string }
        buyerName: { type: string }
        marketCountry: { $ref: '#/components/schemas/CountryCode' }
        taxBehavior: { $ref: '#/components/schemas/TaxBehavior' }
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, amount]
            properties:
              description: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitAmount: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        paymentMethodDisplay: { type: string }
        pdfUrl: { type: string, format: uri }
    RawProviderEvent:
      type: object
      description: Provider-specific payload; parsed and verified by the provider adapter.
      additionalProperties: true
    WebhookAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean, const: true }

    # ------------------------------------------------------------ organizations
    OrgRole:
      type: string
      enum: [OWNER, ADMIN, BILLING, MEMBER]
    OrganizationDataPolicy:
      type: object
      properties:
        zeroDataRetentionRequired: { type: boolean, default: false }
        allowedProcessingRegions:
          type: array
          items: { type: string, maxLength: 40 }
        historyDisabled: { type: boolean, default: false }
    Organization:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        billingEmail: { type: string, format: email }
        dataPolicy: { $ref: '#/components/schemas/OrganizationDataPolicy' }
        myRole: { $ref: '#/components/schemas/OrgRole' }
        createdAt: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [name, countryCode]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        billingEmail: { type: string, format: email }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        billingEmail: { type: string, format: email }
        dataPolicy: { $ref: '#/components/schemas/OrganizationDataPolicy' }
    OrganizationMember:
      type: object
      required: [userId, role, status]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string }
        contactMasked: { type: string }
        role: { $ref: '#/components/schemas/OrgRole' }
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        seat: { $ref: '#/components/schemas/SeatAssignment' }
        joinedAt: { type: string, format: date-time }
    InvitationCreate:
      type: object
      required: [role]
      description: Exactly one of `email` or `phoneNumber`.
      properties:
        email: { type: string, format: email }
        phoneNumber: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        role: { $ref: '#/components/schemas/OrgRole' }
        assignSeatFromSubscriptionId: { type: string, format: uuid }
      oneOf:
        - required: [email]
        - required: [phoneNumber]
    Invitation:
      type: object
      required: [invitationId, role, status, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRole' }
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        expiresAt: { type: string, format: date-time }
    SeatAssignmentRequest:
      type: object
      required: [organizationSubscriptionId]
      properties:
        organizationSubscriptionId: { type: string, format: uuid }
    SeatAssignment:
      type: object
      required: [organizationSubscriptionId, planCode, assignedAt]
      properties:
        organizationSubscriptionId: { type: string, format: uuid }
        planCode: { type: string }
        assignedAt: { type: string, format: date-time }
    FeatureUsage:
      type: object
      required: [featureCode, usedUnits, unit]
      properties:
        featureCode: { $ref: '#/components/schemas/FeatureCode' }
        usedUnits: { type: integer, minimum: 0 }
        unit: { $ref: '#/components/schemas/MeteringUnit' }
    OrganizationUsage:
      type: object
      required: [periodStart, periodEnd, byFeature]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/FeatureUsage' }
        byApiClient:
          type: array
          items:
            type: object
            required: [apiClientId, usage]
            properties:
              apiClientId: { type: string, format: uuid }
              usage:
                type: array
                items: { $ref: '#/components/schemas/FeatureUsage' }
    ApiScope:
      type: string
      enum: [translate, transform, transliterate, detect_language, speech, usage_read]
    ApiClientCreate:
      type: object
      required: [name, environment, scopes]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        environment:
          type: string
          enum: [TEST, LIVE]
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiScope' }
        rateLimitPerMinute: { type: integer, minimum: 1, maximum: 10000 }
        allowedIpCidrs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 43 }
    ApiKeySummary:
      type: object
      required: [keyId, prefix, status, createdAt]
      properties:
        keyId: { type: string, format: uuid }
        prefix: { type: string, description: 'First characters for identification, e.g. sk_live_7Hq2.' }
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        description: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApiClient:
      type: object
      required: [clientId, name, environment, scopes, status]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        environment:
          type: string
          enum: [TEST, LIVE]
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ApiScope' }
        rateLimitPerMinute: { type: integer }
        allowedIpCidrs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKeySummary' }
        createdAt: { type: string, format: date-time }
    ApiKeyCreate:
      type: object
      properties:
        description: { type: string, maxLength: 200 }
        expiresAt: { type: string, format: date-time }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKeySummary'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, readOnly: true, description: Full API key. Returned only once; store it securely. }

    # ------------------------------------------------------------ glossaries
    Glossary:
      type: object
      required: [glossaryId, name, ownerType, sourceLanguage, destinationLanguage, enforcement]
      properties:
        glossaryId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        ownerType:
          type: string
          enum: [USER, ORGANIZATION]
        organizationId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
          description: STRICT fails the guardrail if a matched term is not rendered as specified.
        entryCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GlossaryCreate:
      type: object
      required: [name, sourceLanguage, destinationLanguage]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        organizationId: { type: string, format: uuid }
        sourceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        destinationLanguage: { $ref: '#/components/schemas/LanguageCode' }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
          default: PREFER
    GlossaryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enforcement:
          type: string
          enum: [PREFER, STRICT]
    GlossaryEntryInput:
      type: object
      required: [sourceTerm]
      description: Either `targetTerm` or `doNotTranslate = true`.
      properties:
        sourceTerm: { type: string, minLength: 1, maxLength: 200 }
        targetTerm: { type: string, maxLength: 200 }
        doNotTranslate: { type: boolean, default: false }
        caseSensitive: { type: boolean, default: false }
        partOfSpeech: { type: string, maxLength: 30 }
        note: { type: string, maxLength: 500 }
    GlossaryEntry:
      allOf:
        - $ref: '#/components/schemas/GlossaryEntryInput'
        - type: object
          required: [entryId]
          properties:
            entryId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    GlossaryBatchRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [UPSERT, DELETE]
              entryId: { type: string, format: uuid, description: Required for DELETE; optional for UPSERT (match by sourceTerm otherwise). }
              entry: { $ref: '#/components/schemas/GlossaryEntryInput' }
    GlossaryBatchResult:
      type: object
      required: [upserted, deleted]
      properties:
        upserted: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            required: [index, code]
            properties:
              index: { type: integer, minimum: 0 }
              code: { type: string }
              message: { type: string }

    # ------------------------------------------------------------ partner
    TransliterateRequest:
      type: object
      required: [text, languageCode, direction]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        profileCode: { type: string, maxLength: 100, description: Defaults to the language's active phonetic profile. }
        profileVersion: { type: string, maxLength: 40, description: Pin a version for reproducible output. }
        direction:
          type: string
          enum: [LATIN_TO_NATIVE, NATIVE_TO_LATIN]
        returnCandidates: { type: boolean, default: false }
        maxCandidates: { type: integer, minimum: 1, maximum: 5, default: 3 }
    TransliterateResponse:
      type: object
      required: [text, profileCode, profileVersion]
      properties:
        text: { type: string }
        profileCode: { type: string }
        profileVersion: { type: string }
        tokens:
          type: array
          description: Present when `returnCandidates` is true.
          items:
            type: object
            required: [input, output]
            properties:
              input: { type: string }
              output: { type: string }
              candidates:
                type: array
                items: { type: string }
              preserved: { type: boolean, description: True for protected/unknown tokens kept as-is. }
        charactersBilled: { type: integer, minimum: 0 }
    PartnerUsage:
      type: object
      required: [apiClientId, periodStart, periodEnd, byFeature]
      properties:
        apiClientId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/FeatureUsage' }
    PartnerLanguages:
      type: object
      required: [languages, transliterationProfiles, capabilities]
      properties:
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        transliterationProfiles:
          type: array
          items: { $ref: '#/components/schemas/TransliterationProfile' }
        capabilities: { $ref: '#/components/schemas/AiCapabilities' }
