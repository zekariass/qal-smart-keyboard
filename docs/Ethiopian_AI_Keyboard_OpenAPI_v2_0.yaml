          description: Glossaries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Glossary' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Glossaries]
      operationId: createGlossary
      summary: Create a glossary
      description: Requires the `CUSTOM_GLOSSARY` entitlement (personal) or organisation ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlossaryCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Glossary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/glossaries/{glossaryId}:
    parameters:
