# CI for Qal Smart Keyboard (implementation plan step F0.2).
# Jobs for modules that do not exist yet (core, ios, admin-web) skip themselves
# until their build file appears, so this workflow stays green while the repo grows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_baseline:
        description: "core-bench: re-record core/benches/baseline.json on this runner and upload it as an artifact instead of gating"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and docs sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generated copies match docs/
        run: ./contracts/sync.sh --check
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1 lint --format=github-actions contracts/openapi.yaml
      - name: Generate client types and type-check them (B1.3)
        run: backend/scripts/gen-client-types.sh "$RUNNER_TEMP/client-types"

  schema:
    name: Schema applies on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_DB: qal
          POSTGRES_USER: qal
          POSTGRES_PASSWORD: qal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qal -d qal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: qal
      PGPASSWORD: qal_ci
      PGDATABASE: qal
    steps:
      - uses: actions/checkout@v5
      - name: Apply V1 baseline
        run: psql -v ON_ERROR_STOP=1 -q -f backend/src/main/resources/db/migration/V1__baseline.sql
      - name: Expect 86 tables
        run: |
          n=$(psql -tAc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "tables=$n"
          test "$n" -eq 86

  backend:
    name: Backend (Java 25, Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qal
          POSTGRES_USER: qal
          POSTGRES_PASSWORD: qal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qal -d qal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/qal
      DB_USER: qal
      DB_PASSWORD: qal_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  android:
    name: Android (play + direct)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # A1.1: the app build compiles the Rust core with cargo-ndk (NOT yet run in CI).
      - name: Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add --toolchain 1.91.0 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install cargo-ndk and the NDK
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" >/dev/null
      - name: Assemble and unit test
        run: ./gradlew --no-daemon --continue :app:assemblePlayDebug :app:assembleDirectDebug testDebugUnitTest :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      # Job logs need a GitHub login; annotations do not. On failure, surface failing tests and compile
      # errors as annotations (test names and assertion messages only; tests never carry user data).
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^(e: |FAILURE: |\* What went wrong)' "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r line; do
            echo "::error title=Gradle::${line//$'\r'/}"
          done
          find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 | xargs -0 -r grep -l -E '<(failure|error)' | while read -r f; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for kind in ('failure', 'error'):
                  el = case.find(kind)
                  if el is not None:
                      msg = (el.get('message') or el.text or '').strip().splitlines()[:3]
                      msg = ' | '.join(msg)[:600].replace('%', '%25').replace('\n', ' ')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{kind}: {msg}")
          PY
          done | head -30

  language-data:
    name: Language data (eval harness, Fidel table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s language-data/eval/tests -v
      - name: Fidel table generator is up to date
        run: |
          python -I language-data/scripts/gen_fidel_table.py --check
          python -I -m unittest discover -s language-data/scripts -p "test_*.py" -v

  core:
    name: Rust keyboard-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect crate
        id: detect
        run: |
          if [ -f core/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "core/Cargo.toml not found; skipping until step C1.1"; fi
      - if: steps.detect.outputs.present == 'true'
        # Installs the channel and components pinned in core/rust-toolchain.toml.
        working-directory: core
        run: rustup toolchain install
      - if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --lib -- -D warnings   # shipped build, without the test-only `builder` feature
          cargo test
      - name: Build cdylib and generate Kotlin bindings (smoke check)
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: |
          cargo build --release
          cargo run --features cli --bin uniffi-bindgen -- generate \
            --library target/release/libqal_keyboard_core.so --language kotlin --out-dir "$RUNNER_TEMP/kotlin"

  core-bench:
    name: Rust keyboard-core benchmark gate (>10% p50 regression fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate script unit tests
        run: python -I -m unittest discover -s core/scripts -p "test_bench_gate.py" -v
      - name: Install pinned toolchain
        working-directory: core
        run: rustup toolchain install
      - name: Benchmark gate (min-of-runs p50 vs core/benches/baseline.json)
        if: ${{ !inputs.record_baseline }}
        run: python -I core/scripts/bench_gate.py
      - name: Record baseline on this runner (workflow_dispatch only)
        if: ${{ inputs.record_baseline }}
        run: python -I core/scripts/bench_gate.py --update --runs 5
      - name: Upload recorded baseline
        if: ${{ inputs.record_baseline }}
        uses: actions/upload-artifact@v5
        with:
          name: bench-baseline
          path: core/benches/baseline.json

  # iOS (xcodebuild on macos-latest) and admin-web (Node) jobs are added by
  # steps I5.1 and H3.6 when those projects exist.
