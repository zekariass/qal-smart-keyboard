# CI for Qal Smart Keyboard (implementation plan step F0.2).
# Jobs for modules that do not exist yet (core, ios, admin-web) skip themselves
# until their build file appears, so this workflow stays green while the repo grows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and docs sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generated copies match docs/
        run: ./contracts/sync.sh --check
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1 lint --format=github-actions contracts/openapi.yaml

  schema:
    name: Schema applies on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_DB: qal
          POSTGRES_USER: qal
          POSTGRES_PASSWORD: qal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qal -d qal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: qal
      PGPASSWORD: qal_ci
      PGDATABASE: qal
    steps:
      - uses: actions/checkout@v5
      - name: Apply V1 baseline
        run: psql -v ON_ERROR_STOP=1 -q -f backend/src/main/resources/db/migration/V1__baseline.sql
      - name: Expect 86 tables
        run: |
          n=$(psql -tAc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "tables=$n"
          test "$n" -eq 86

  backend:
    name: Backend (Java 25, Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qal
          POSTGRES_USER: qal
          POSTGRES_PASSWORD: qal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qal -d qal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/qal
      DB_USER: qal
      DB_PASSWORD: qal_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  android:
    name: Android (play + direct)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble and unit test
        run: ./gradlew --no-daemon :app:assemblePlayDebug :app:assembleDirectDebug testDebugUnitTest

  language-data:
    name: Language data (eval harness, Fidel table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s language-data/eval/tests -v
      - name: Fidel table generator is up to date
        run: |
          python -I language-data/scripts/gen_fidel_table.py --check
          python -I -m unittest discover -s language-data/scripts -p "test_*.py" -v

  core:
    name: Rust keyboard-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect crate
        id: detect
        run: |
          if [ -f core/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "core/Cargo.toml not found; skipping until step C1.1"; fi
      - if: steps.detect.outputs.present == 'true'
        # Installs the channel and components pinned in core/rust-toolchain.toml.
        working-directory: core
        run: rustup toolchain install
      - if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --lib -- -D warnings   # shipped build, without the test-only `builder` feature
          cargo test
      - name: Build cdylib and generate Kotlin bindings (smoke check)
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: |
          cargo build --release
          cargo run --features cli --bin uniffi-bindgen -- generate \
            --library target/release/libqal_keyboard_core.so --language kotlin --out-dir "$RUNNER_TEMP/kotlin"

  # iOS (xcodebuild on macos-latest) and admin-web (Node) jobs are added by
  # steps I5.1 and H3.6 when those projects exist.
