spring:
  application:
    name: qal-smart-keyboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/qal}
    username: ${DB_USER:qal}
    password: ${DB_PASSWORD:qal_dev_only}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (V1__baseline.sql)
    open-in-view: false
  flyway:
    enabled: true

# Per-user envelope encryption (B1.5, ADR 0005). Startup fails if no KMS provider is configured.
# Local development: QAL_KMS_PROVIDER=local and QAL_LOCAL_KMS_KEK=<base64 of 32 random bytes>.
# The local KMS is refused under the prod/production/staging profiles.
qal:
  crypto:
    kms:
      provider: ${QAL_KMS_PROVIDER:}
    local-kms:
      kek: ${QAL_LOCAL_KMS_KEK:}
    cloud-kms:
      key-name: ${QAL_CLOUD_KMS_KEY_NAME:}
