spring:
  application:
    name: qal-smart-keyboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/qal}
    username: ${DB_USER:qal}
    password: ${DB_PASSWORD:qal_dev_only}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (V1__baseline.sql)
    open-in-view: false
  flyway:
    enabled: true

# Per-user envelope encryption (B1.5, ADR 0005). Startup fails if no KMS provider is configured.
# Local development: QAL_KMS_PROVIDER=local and QAL_LOCAL_KMS_KEK=<base64 of 32 random bytes>.
# The local KMS is refused under the prod/production/staging profiles.
qal:
  crypto:
    kms:
      provider: ${QAL_KMS_PROVIDER:}
    local-kms:
      kek: ${QAL_LOCAL_KMS_KEK:}
    cloud-kms:
      key-name: ${QAL_CLOUD_KMS_KEY_NAME:}
  # Phone OTP (B2.1, ADR 0006). Startup fails without a secret (base64 of >= 32 random bytes).
  identity:
    otp:
      secret-key: ${QAL_OTP_SECRET_KEY:}
    # Access tokens (B2.4, ADR 0006): ES256 key pair as PEM. Startup fails without it.
    tokens:
      signing-key:
        key-id: ${QAL_JWT_KEY_ID:qal-1}
        private-key: ${QAL_JWT_PRIVATE_KEY:}
        public-key: ${QAL_JWT_PUBLIC_KEY:}
    # E-mail + password sign-in (ADR 0033). verification-required=true needs an e-mail provider (startup fails without
    # one). No real e-mail vendor adapter exists yet, so production runs either with QAL_EMAIL_VERIFICATION_REQUIRED=false
    # (unverified sign-up; loud WARN, password reset answers 503) or with QAL_EMAIL_ENABLED=false.
    email:
      enabled: ${QAL_EMAIL_ENABLED:true}
      verification-required: ${QAL_EMAIL_VERIFICATION_REQUIRED:true}
    # Attestation (B2.3, ADR 0008): no real Play Integrity / App Attest adapter exists yet, so without the mock switch no
    # guest session is ever created. QAL_ATTESTATION_MOCK=true is for development only (refused under prod/production/staging).
    attestation:
      mock:
        enabled: ${QAL_ATTESTATION_MOCK:false}
    # Google sign-in (B2.2, ADR 0009): accepted OAuth client ids (the ID token's aud), comma separated: the web client id
    # the Android app passes as serverClientId, plus the Android/iOS ids. Empty = Google sign-in off (startup WARN).
    oauth:
      google:
        client-ids: ${QAL_GOOGLE_CLIENT_IDS:}
  # Entitlement tokens (B4.4, ADR 0013): Ed25519 key pair as PEM (or the private key as an OKP JWK). Startup fails without it.
  entitlements:
    token:
      signing-key:
        key-id: ${QAL_ENTITLEMENT_TOKEN_KEY_ID:ent-1}
        private-key: ${QAL_ENTITLEMENT_TOKEN_PRIVATE_KEY:}
        public-key: ${QAL_ENTITLEMENT_TOKEN_PUBLIC_KEY:}
  # SMS provider (B2.1, ADR 0025). No default: 'sms-ethiopia' (production, needs the API key), or 'log' / 'capture'
  # (development only, refused under prod/production/staging).
  notifications:
    sms:
      provider: ${QAL_SMS_PROVIDER:}
      sms-ethiopia:
        api-key: ${QAL_SMS_ETHIOPIA_API_KEY:}
        base-url: ${QAL_SMS_ETHIOPIA_BASE_URL:https://smsethiopia.com/}
        connect-timeout: ${QAL_SMS_ETHIOPIA_CONNECT_TIMEOUT:2s}
        read-timeout: ${QAL_SMS_ETHIOPIA_READ_TIMEOUT:5s}
    # E-mail provider (ADR 0033): 'none' (default: nothing can be sent), or 'log' / 'capture' (development only, refused
    # under prod/production/staging). The vendor is an open decision (ADR 0033).
    email:
      provider: ${QAL_EMAIL_PROVIDER:none}
  # Language packs (B3.1). Download URLs are pre-signed S3 (MinIO locally, infra/compose: bucket qal-language-packs).
  # Without credentials stored s3:// locations cannot be served (500); the prod/production/staging profiles refuse to start.
  languages:
    internal-channel-enabled: ${QAL_PACKS_INTERNAL_CHANNEL:false}
    artifacts:
      endpoint: ${QAL_PACKS_S3_ENDPOINT:}
      bucket: ${QAL_PACKS_S3_BUCKET:qal-language-packs}
      region: ${QAL_PACKS_S3_REGION:us-east-1}
      access-key: ${QAL_PACKS_S3_ACCESS_KEY:}
      secret-key: ${QAL_PACKS_S3_SECRET_KEY:}
      url-ttl: ${QAL_PACKS_S3_URL_TTL:15m}
      path-style: ${QAL_PACKS_S3_PATH_STYLE:true}
    # Admin pack publishing (B3.2, ADR 0019). The server re-signs staged/published packs with this Ed25519 key (32-byte
    # seed, base64 or hex; a KMS signer replaces it later). Without it staging and publishing fail; an ephemeral key is
    # refused under prod/production/staging. Uploads and re-signed packs are written with the separate write credential.
    publishing:
      max-container-bytes: ${QAL_PACKS_MAX_UPLOAD_BYTES:33685504}
      license-allow-list: ${QAL_LICENSE_ALLOW_LIST:}
      signing:
        provider: ${QAL_PACK_SIGNING_PROVIDER:local}
        key-id: ${QAL_PACK_SIGNING_KEY_ID:}
        private-key: ${QAL_PACK_SIGNING_PRIVATE_KEY:}
        kms-key-name: ${QAL_PACK_SIGNING_KMS_KEY_NAME:}
      storage:
        endpoint: ${QAL_PACKS_S3_WRITE_ENDPOINT:}
        access-key: ${QAL_PACKS_S3_WRITE_ACCESS_KEY:}
        secret-key: ${QAL_PACKS_S3_WRITE_SECRET_KEY:}
  # Admin API /admin/v1 (B3.2, ADR 0019): interim, app access tokens + admin_roles until workforce OIDC with MFA exists.
  # Off by default (every admin operation answers 404).
  admin:
    enabled: ${QAL_ADMIN_ENABLED:false}
  # Account deletion (B6.2, ADR 0015): cancellable grace period (SD 19.4: 14 days) and the executor's db-scheduler task.
  privacy:
    deletion:
      grace-period: ${QAL_DELETION_GRACE_PERIOD:14d}
      executor-interval: ${QAL_DELETION_EXECUTOR_INTERVAL:5m}
    # Data export (B6.1, ADR 0022): asynchronous archive, sealed with the user's data key, kept in a private bucket
    # (infra/compose: qal-exports, give it a 7-day lifecycle rule) and downloaded through the API for 7 days. Without
    # credentials the job fails its exports (FAILED); the prod/production/staging profiles refuse to start.
    export:
      link-ttl: ${QAL_EXPORT_LINK_TTL:7d}
      max-per-window: ${QAL_EXPORT_MAX_PER_WINDOW:3}
      window: ${QAL_EXPORT_WINDOW:24h}
      max-archive-bytes: ${QAL_EXPORT_MAX_ARCHIVE_BYTES:67108864}
      job-enabled: ${QAL_EXPORT_JOB_ENABLED:true}
      poll-interval: ${QAL_EXPORT_POLL_INTERVAL:10s}
      public-base-url: ${QAL_PUBLIC_BASE_URL:}
      storage:
        endpoint: ${QAL_EXPORTS_S3_ENDPOINT:}
        bucket: ${QAL_EXPORTS_S3_BUCKET:qal-exports}
        region: ${QAL_EXPORTS_S3_REGION:us-east-1}
        access-key: ${QAL_EXPORTS_S3_ACCESS_KEY:}
        secret-key: ${QAL_EXPORTS_S3_SECRET_KEY:}
        path-style: ${QAL_EXPORTS_S3_PATH_STYLE:true}
  # Retention (B6.3, ADR 0020): a daily db-scheduler task (cron, UTC) purges every data class past its period. Defaults
  # come from SD 19.2 and are listed in ADR 0020; override one with qal.retention.periods.<rule-code>, for example
  # QAL_RETENTION_PERIODS_OTP_CHALLENGES=48h. An unknown or kept (financial) rule code stops the application at start.
  retention:
    enabled: ${QAL_RETENTION_ENABLED:true}
    cron: ${QAL_RETENTION_CRON:0 0 3 * * *}
    batch-size: ${QAL_RETENTION_BATCH_SIZE:1000}
  # AI provider SPI (B5.1, ADR 0014). The mock and the WireMock-shaped HTTP adapter are for development only (refused
  # under prod/production/staging). Real vendors (ADR 0007 D46, ADR 0023): OpenAI and Google Cloud Translation; each
  # adapter exists only when its key is set, and keys come from the environment only. Their ai_providers rows (V19) stay
  # DISABLED until an operator records the DPA and enables them.
  ai:
    openai:
      api-key: ${QAL_OPENAI_API_KEY:}
      # Required when the key is set (startup fails otherwise): the OpenAI model id. No default on purpose.
      model: ${QAL_OPENAI_MODEL:}
      base-url: ${QAL_OPENAI_BASE_URL:https://api.openai.com/v1}
      max-output-tokens: ${QAL_OPENAI_MAX_OUTPUT_TOKENS:4096}
      reasoning-effort: ${QAL_OPENAI_REASONING_EFFORT:}
      # Per-feature max_completion_tokens (ADR 0027), on top of the built-in DRAFT_DOCUMENT: 8192 (an e-mail needs more
      # room than a grammar fix, reasoning tokens included); 0 = not sent for that feature. Example:
      # max-output-tokens-by-feature:
      #   DRAFT_DOCUMENT: 8192
    google-translate:
      api-key: ${QAL_GOOGLE_TRANSLATE_API_KEY:}
      base-url: ${QAL_GOOGLE_TRANSLATE_BASE_URL:https://translation.googleapis.com}
    registry-cache-ttl: ${QAL_AI_REGISTRY_CACHE_TTL:30s}
    # Routing (B5.2, ADR 0014): ordering from ai_routing_policies, failover limits, circuit breaker, kill switch, cost cap.
    # Kill switch without a deploy: app_configurations row ai.kill_switch (BACKEND scope); the sets below are the
    # restart-time emergency switch.
    routing:
      max-attempts: ${QAL_AI_ROUTING_MAX_ATTEMPTS:3}
      attempt-timeout: ${QAL_AI_ROUTING_ATTEMPT_TIMEOUT:4s}
      deadline: ${QAL_AI_ROUTING_DEADLINE:8s}
      policy-cache-ttl: 30s
      kill-switch-cache-ttl: 5s
      cost-cache-ttl: 10s
      killed-providers: ${QAL_AI_KILLED_PROVIDERS:}
      killed-features: ${QAL_AI_KILLED_FEATURES:}
    # Request pipeline (B5.3, ADR 0017): one time budget for route + guardrail retry + fallback; AI_PROCESSING consent
    # is not required for explicit actions unless switched on.
    pipeline:
      deadline: ${QAL_AI_PIPELINE_DEADLINE:8s}
      require-ai-processing-consent: ${QAL_AI_REQUIRE_PROCESSING_CONSENT:false}
      catalog-cache-ttl: 30s
      min-script-ratio: 0.9
      # Per-feature time budgets (ADR 0027), on top of the built-in defaults: SUMMARIZE, EXPLAIN_TEXT and SMART_REPLY
      # 12s per attempt / 20s in total, DRAFT_DOCUMENT 20s / 30s. Every other feature uses the deadline above and
      # routing.attempt-timeout (the keyboard's 4s / 8s). Example:
      # feature-timeouts:
      #   DRAFT_DOCUMENT: { attempt-timeout: 20s, deadline: 30s }
    # Idempotency (B5.4, ADR 0017): encrypted replay cache (0s..10m, 0s = off) and request fingerprints (>= 24h).
    idempotency:
      cache-ttl: ${QAL_AI_REPLAY_CACHE_TTL:10m}
      fingerprint-retention: 24h
      sweep-interval: 1m
    mock:
      enabled: ${QAL_AI_MOCK:false}
    http:
      enabled: ${QAL_AI_HTTP:false}
      base-url: ${QAL_AI_HTTP_BASE_URL:http://localhost:8089}
      api-key: ${QAL_AI_HTTP_API_KEY:}
  # Billing-country detection (ADR 0045). CF-IPCountry is trusted only from the configured edge: the direct peer inside
  # QAL_GEO_TRUSTED_PROXIES (comma-separated CIDRs) and/or the shared secret header X-Qal-Edge-Secret = QAL_GEO_EDGE_SECRET
  # (every configured check must pass; none configured = never trusted). DEV_MOCK_COUNTRY (e.g. ET) replaces the IP
  # country in development; the prod/production/staging profiles refuse to start with it.
  geo:
    trusted-proxies: ${QAL_GEO_TRUSTED_PROXIES:}
    edge-secret: ${QAL_GEO_EDGE_SECRET:}
    dev-mock-country: ${DEV_MOCK_COUNTRY:}
  # Billing core (ADR 0045): provider routing per country and channel (billing_provider_routes), orders, hosted checkout,
  # verify-then-grant. QAL_PUBLIC_BASE_URL is the API origin providers call back (notify and return URLs).
  billing:
    environment: ${QAL_BILLING_ENVIRONMENT:SANDBOX}
    public-base-url: ${QAL_PUBLIC_BASE_URL:}
    app-return-uri: ${QAL_BILLING_APP_RETURN_URI:qalkeyboard://billing/return}
    order-ttl: ${QAL_BILLING_ORDER_TTL:30m}
    attempt-ttl: ${QAL_BILLING_ATTEMPT_TTL:30m}
    min-country-confidence: ${QAL_BILLING_MIN_COUNTRY_CONFIDENCE:MEDIUM}
    reconciliation:
      enabled: ${QAL_BILLING_RECONCILIATION_ENABLED:true}
      interval: ${QAL_BILLING_RECONCILIATION_INTERVAL:2m}
      stuck-after: ${QAL_BILLING_RECONCILIATION_STUCK_AFTER:10m}
      recheck-every: ${QAL_BILLING_RECONCILIATION_RECHECK_EVERY:5m}
      give-up-after: ${QAL_BILLING_RECONCILIATION_GIVE_UP_AFTER:48h}
    # ArifPay (Ethiopian default provider). The adapter exists only when ARIFPAY_SECRET_KEY is set; a sandbox key needs
    # QAL_ARIFPAY_ENVIRONMENT=SANDBOX (the default; routes /api/sandbox/...). Production also needs
    # QAL_ARIFPAY_WEBHOOK_SECRET (>= 32 characters) for the notify-URL token.
    arifpay:
      api-key: ${ARIFPAY_SECRET_KEY:}
      environment: ${QAL_ARIFPAY_ENVIRONMENT:SANDBOX}
      base-url: ${QAL_ARIFPAY_BASE_URL:}
      webhook-secret: ${QAL_ARIFPAY_WEBHOOK_SECRET:}
      connect-timeout: ${QAL_ARIFPAY_CONNECT_TIMEOUT:3s}
      read-timeout: ${QAL_ARIFPAY_READ_TIMEOUT:10s}
    # Chapa (Ethiopian alternative, ADR 0045 step A2). The adapter exists only when CHAPA_SECRET_KEY is set; a test key
    # (CHASECK_TEST-...) needs QAL_CHAPA_ENVIRONMENT=SANDBOX (the default), a live key PRODUCTION. CHAPA_WEBHOOK_SECRET is
    # the dashboard webhook "secret hash" (required in prod/production/staging; without it webhooks are refused).
    chapa:
      secret-key: ${CHAPA_SECRET_KEY:}
      webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
      environment: ${QAL_CHAPA_ENVIRONMENT:SANDBOX}
      base-url: ${QAL_CHAPA_BASE_URL:}
      connect-timeout: ${QAL_CHAPA_CONNECT_TIMEOUT:3s}
      read-timeout: ${QAL_CHAPA_READ_TIMEOUT:10s}
      accept-secret-hash-signature: ${QAL_CHAPA_ACCEPT_SECRET_HASH_SIGNATURE:true}
  # Crash reporting (ADR 0024, ADR 0007 D47): the environment tag; blank = the active Spring profiles ("default").
  observability:
    sentry:
      environment: ${QAL_SENTRY_ENVIRONMENT:}

# Crash reporting (ADR 0024). Off unless QAL_SENTRY_DSN is set (blank DSN = SDK disabled, nothing sent). Content-free:
# platform.observability.SentryConfiguration forces no default PII, no request bodies, no tracing, no breadcrumbs, and
# scrubs every event (exception messages, user, cookies, query strings, headers outside an allow-list).
sentry:
  dsn: ${QAL_SENTRY_DSN:}
  send-default-pii: false
  max-request-body-size: none
  logging:
    # Only ERROR log lines become events (with their message template only); no log line becomes a breadcrumb.
    minimum-event-level: error
    minimum-breadcrumb-level: error
