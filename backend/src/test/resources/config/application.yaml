# Test-only overrides, loaded by Spring Boot on top of classpath:/application.yaml for every
# @SpringBootTest (classpath:/config/ has higher precedence). Never packaged in the application jar.
#
# B1.5: the local development KMS with a random per-JVM key-encryption key, so tests need no secret.
qal:
  crypto:
    kms:
      provider: local
    local-kms:
      allow-ephemeral-kek: true
  # B2.1: random per-JVM OTP secret and the logging SMS mock (body not logged).
  identity:
    otp:
      allow-ephemeral-secret-key: true
    # B2.4: random per-JVM ES256 access-token key.
    tokens:
      signing-key:
        allow-ephemeral: true
    # B2.3: the mock Play Integrity / App Attest verifiers (token format in MockAttestationTokens).
    attestation:
      mock:
        enabled: true
  # B4.4: random per-JVM Ed25519 entitlement-token key.
  entitlements:
    token:
      signing-key:
        allow-ephemeral: true
  notifications:
    sms:
      provider: log
  # B4.2: the reservation expiry sweeper (a db-scheduler task) is off in tests; UsageSweeperSchedulerIT turns it on and
  # the metering ITs call the sweep directly.
  usage:
    sweeper-enabled: false
  # B6.2: the account deletion executor (a db-scheduler task) is off in tests; DeletionIT calls it directly.
  privacy:
    deletion:
      executor-enabled: false
